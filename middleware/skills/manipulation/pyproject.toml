[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosy-skill-manipulation"
version = "0.1.0"
description = "ROS-free manipulation Skill contracts and evidence gates"
requires-python = ">=3.12"
dependencies = ["rosy-skill-api==0.1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rosy.skills.manipulation*"]
namespaces = true
