# CAP-001 Capability 정적 선언 (D-11)
# Robot Profile(profile.yaml)과 일치해야 한다 (HWA-003).
capability_version: 1
navigation:
  goal_navigation: true
  return_home: true
  max_linear_velocity: 0.20
  max_angular_velocity: 0.80
teleop: true
slam: true
swarm:                      # D-20 (SWM-005)
  # follow: SwarmManager + POST /api/v1/swarm/follow (SWM-002)
  # lead:   WS /ws/swarm/pose, >=10 Hz (SWM-003)
  # 둘 다 서빙되는 경로가 있을 때만 true 다 — CAP-001 을 읽고 Fleet 이 호출한다.
  follow: true
  lead: true
docking:
  supported: false               # DNC-001 — Pinky Pro 미지원
sensors: [lidar, imu, battery, encoder]
events: ["nav.*", "safety.*", "battery.*", "mode.*", "waypoint.*", "map.*", "system.*", "command.*"]
api_versions: [v1]
protocol_version: "1.0"
