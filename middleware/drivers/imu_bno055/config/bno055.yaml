# Optional BNO055 profile. This file is not loaded by the default Rosy OS
# runtime; select the IMU launch explicitly after Device calibration.
imu_bno055:
  ros__parameters:
    interface: /dev/i2c-0
    frame_id: imu_link
    rate: 100.0
    reset_on_start: false
    # Zero means the reported quantity is available but covariance is unknown.
    orientation_stddev_rad: 0.0
    angular_velocity_stddev_deg_s: 0.0
    linear_acceleration_stddev_mps2: 0.0
