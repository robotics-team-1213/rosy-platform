<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101214">
  <title>Rosy Robot — {{title}}</title>
  <link rel="icon" type="image/svg+xml" href="/common/icons/robot.svg">
  <link rel="stylesheet" href="/common/tokens.css">
  <script src="/common/theme.js"></script>
  <link rel="stylesheet" href="/common/components.css">
  <link rel="stylesheet" href="/common/motor-health.css">
  <link rel="stylesheet" href="/common/app-shell.css">
  <link rel="stylesheet" href="/assets/shell/shell.css">
  <script type="module" src="/common/ui.js"></script>
  <script type="module" src="/assets/shell/shell.js"></script>
</head>
<body data-surface="{{surface}}">
  <a class="skip-link" href="#surface-main">본문으로 건너뛰기</a>
  <ui-shell grammar="{{grammar}}" class="ui-app-shell">
    <ui-topbar>
      <ui-brand href="/dashboard" aria-label="Rosy Robot 홈"><b>Rosy Robot</b><small>{{title}}</small></ui-brand>
      <span data-spacer></span>
      <ui-text id="shell-notice" scale="label" role="status"></ui-text>
      <ui-tag id="shell-role" aria-label="접속 권한">인증 대기</ui-tag>
      <ui-button kind="irreversible" id="shell-estop" data-always-live type="button">비상 정지</ui-button>
    </ui-topbar>
    <div class="ui-app-body" data-seats="rail">
      <div class="ui-rail"><nav id="surface-switch" class="ui-rail-nav" aria-label="화면 전환"></nav></div>
      <div class="ui-subnav"></div>
      <main id="surface-main" class="ui-app-main surface-main" tabindex="-1">
        <a data-account-profile hidden></a>
        <h1 class="sr-only">Rosy Robot — {{title}}</h1>
        <ui-empty id="surface-status">화면을 불러오는 중입니다.</ui-empty>
        <ui-status id="safety-mode-status" role="status" hidden></ui-status>
{{slots}}
      </main>
    </div>
  </ui-shell>
</body>
</html>
