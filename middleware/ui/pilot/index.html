<!doctype html>
<html lang="ko" data-theme="dark" data-theme-pin="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101214">
  <title>Rosy Pilot</title>
  <link rel="icon" type="image/svg+xml" href="/common/icons/pilot.svg">
  <link rel="stylesheet" href="/common/tokens.css">
  <link rel="stylesheet" href="/common/components.css">
  <link rel="stylesheet" href="/pilot/assets/styles.css">
  <link rel="manifest" href="/pilot/assets/manifest.webmanifest">
  <script type="module" src="/common/ui.js"></script>
  <script type="module" src="/pilot/assets/app.js"></script>
</head>
<body>
  <ui-shell grammar="spatial">
    <ui-topbar>
      <ui-brand><b>Rosy Pilot</b><small>직접 조종</small></ui-brand>
      <span data-spacer></span>
      <ui-text id="pilot-notice" scale="label" role="status"></ui-text>
      <ui-tag data-gate-state>대기</ui-tag>
      <ui-button kind="quiet" type="button" data-goto="/console">운용 지도</ui-button>
      <ui-button kind="irreversible" type="button" data-estop data-always-live>비상 정지</ui-button>
    </ui-topbar>
    <main id="pilot-main" class="pilot-main">
      <h1 class="sr-only">Rosy Pilot — 접속 게이트</h1>
      <ui-empty data-pilot-note hidden>Pinky CORE 연결을 확인합니다.</ui-empty>
      <section class="pilot-panel" data-screen="connect" aria-labelledby="pilot-gate-heading"></section>
      <section class="pilot-drive" data-screen="drive" aria-label="주행" hidden></section>
      <section class="pilot-panel" data-screen="arm" aria-label="OMX-AI Gazebo 연습" hidden></section>
    </main>
  </ui-shell>
</body>
</html>
