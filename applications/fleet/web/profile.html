<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rosy Fleet — 내 계정</title>
  <link rel="icon" type="image/svg+xml" href="/common/icons/console.svg">
  <link rel="stylesheet" href="/common/tokens.css">
  <script src="/common/theme.js"></script>
  <link rel="stylesheet" href="/common/components.css">
  <link rel="stylesheet" href="/console/assets/password-login.css">
  <script type="module" src="/common/ui.js"></script>
  <script type="module" src="/console/assets/profile-page.js"></script>
</head>
<body>
  <ui-shell grammar="procedure">
    <ui-topbar><ui-brand href="/console"><b>Rosy Fleet</b><small>내 계정</small></ui-brand><span data-spacer></span><ui-button kind="quiet" data-theme-cycle="" data-icon-only="" type="button" aria-label="테마 변경" data-action-icon="theme-dark"></ui-button></ui-topbar>
    <main class="fleet-login-main">
      <h1>내 계정</h1>
      <ui-status id="profile-status" state="pending">계정 상태를 확인하고 있습니다.</ui-status>
      <a id="profile-login" href="/console/login" hidden>로그인</a>
      <div id="profile-content" hidden>
        <h2>계정 정보</h2>
        <dl><dt>로그인 ID</dt><dd id="profile-id"></dd><dt>이메일</dt><dd id="profile-email"></dd>
          <dt>역할</dt><dd id="profile-role"></dd></dl>
        <section id="profile-grants" hidden><h2>서비스별 권한</h2><ul id="profile-grant-list"></ul></section>
        <p>ID·이메일·권한 변경은 현장 관리자가 처리합니다.</p>
        <form id="profile-name-form" class="password-login-form">
          <label for="profile-name">표시 이름</label>
          <input id="profile-name" class="ui-field password-login-field" autocomplete="nickname" maxlength="80" required>
          <ui-button id="profile-name-save" kind="primary" type="button">표시 이름 저장</ui-button>
        </form>
        <h2>비밀번호 변경</h2>
        <p>변경하면 이 브라우저를 제외한 이전 로그인 세션이 종료됩니다.</p>
        <form id="profile-password-form" class="password-login-form">
          <label for="profile-current">현재 비밀번호</label>
          <input id="profile-current" class="ui-field password-login-field" type="password" autocomplete="current-password" maxlength="1024" required>
          <label for="profile-new">새 비밀번호 · 8자 이상, ID·현재 비밀번호와 다르게</label>
          <input id="profile-new" class="ui-field password-login-field" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required>
          <label for="profile-confirm">새 비밀번호 확인</label>
          <input id="profile-confirm" class="ui-field password-login-field" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required>
          <ui-button id="profile-password-save" kind="primary" type="button">비밀번호 변경</ui-button>
        </form>
      </div>
      <ui-button id="profile-reload" kind="quiet" type="button">계정 상태 다시 확인</ui-button>
      <p><a id="profile-back" href="/console">원래 업무로 돌아가기</a></p>
    </main>
  </ui-shell>
</body>
</html>
