<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rosy Fleet — 학습</title>
  <link rel="icon" type="image/svg+xml" href="/common/icons/console.svg">
  <link rel="stylesheet" href="/common/tokens.css">
  <script src="/common/theme.js"></script>
  <link rel="stylesheet" href="/common/components.css">
  <link rel="stylesheet" href="/common/component-controls.css">
  <link rel="stylesheet" href="/console/assets/fleet-document.css">
  <link rel="stylesheet" href="/console/assets/learning.css">
  <script type="module" src="/common/ui.js"></script>
</head>
<body>
  <a class="skip-link" href="#learning-main">학습 안내로 이동</a>
  <ui-shell grammar="procedure">
    <!-- fleet:document-header:start -->
<header class="fleet-document-header"><ui-topbar><ui-brand href="/console"><b>Rosy Fleet</b><small>학습</small></ui-brand><span data-spacer></span><ui-button kind="quiet" data-theme-cycle="" data-icon-only="" type="button" aria-label="테마 변경" data-action-icon="theme-dark"></ui-button></ui-topbar></header>
<!-- fleet:document-header:end -->
    <main id="learning-main" class="learning-main fleet-document ui-task-page" data-host-focus="{{focus}}" tabindex="-1">
      <ui-section aria-labelledby="learning-title">
        <h1 id="learning-title" class="ui-page-heading">로봇 학습 센터</h1>
        <p class="learning-hub-note">이 주소는 담당자가 등록한 보호된 Learning 원본으로 바로 이동합니다. 등록된 원본이 없으면 이 안내가 열립니다.</p>
        <p class="learning-focus-note">이 호스트의 운영 연결이 아직 등록되지 않았습니다. 담당자가 보호된 Learning 원본을 등록하면 이 주소는 곧바로 Learning 화면으로 이동합니다.</p>
        <ui-actions><a class="ui-disclosure-row" href="/console?view=work">Fleet 작업으로 돌아가기</a></ui-actions>
      </ui-section>
    </main>
  </ui-shell>
</body>
</html>
