<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rosy Fleet — 로그인</title>
  <link rel="icon" type="image/svg+xml" href="/common/icons/console.svg">
  <link rel="stylesheet" href="/common/tokens.css">
  <script src="/common/theme.js"></script>
  <link rel="stylesheet" href="/common/components.css">
  <link rel="stylesheet" href="/console/assets/password-login.css">
  <script type="module" src="/common/ui.js"></script>
  <script type="module" src="/console/assets/login-page.js"></script>
</head>
<body>
  <ui-shell grammar="procedure">
    <ui-topbar><ui-brand href="/console"><b>Rosy Fleet</b><small>관제 로그인</small></ui-brand><span data-spacer></span><ui-button kind="quiet" data-theme-cycle="" data-icon-only="" type="button" aria-label="테마 변경" data-action-icon="theme-dark"></ui-button></ui-topbar>
    <main class="fleet-login-main">
      <h1>관제 로그인</h1>
      <p>이 현장의 계정으로 로그인하세요. 로봇 직접 연결은 별도 권한이 필요합니다.</p>
      <p id="login-context">로그인 후 원래 업무로 돌아갑니다.</p>
      <div id="password-login" class="password-login"></div>
      <ui-status id="login-availability" state="pending">로그인 설정을 확인하고 있습니다.</ui-status>
      <a id="login-back" href="/console">원래 업무로 돌아가기</a>
    </main>
  </ui-shell>
</body>
</html>
