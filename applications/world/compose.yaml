name: rosy-world
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  world:
    image: rosy-world:${ROSY_WORLD_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    user: "${ROSY_WORLD_UID:-10001}:${ROSY_WORLD_GID:-10001}"
    command:
      - python
      - -B
      - /world/serve.py
      - --bundle
      - /world
      - --worlds-dir
      - /var/lib/rosy-world/worlds
      - --host
      - 0.0.0.0
      - --port
      - "8140"
    environment:
      ROSY_WORLD_INGEST_TOKEN: "${ROSY_WORLD_INGEST_TOKEN:-}"
      ROSY_WORLD_MDNS_HOST: "${ROSY_WORLD_MDNS_HOST:-}"
      ROSY_FLEET_MDNS_HOST: "${ROSY_FLEET_MDNS_HOST:-}"
    ports:
      - "${ROSY_WORLD_BIND:-0.0.0.0}:${ROSY_WORLD_PORT:-8140}:8140"
    volumes:
      - type: bind
        source: .
        target: /world
        read_only: true
      - type: bind
        source: "${ROSY_WORLD_WORLDS_DIR:-./data/worlds}"
        target: /var/lib/rosy-world/worlds
        read_only: false
      # NSS queries host Avahi daemon for *.local resolution (no IP literals or extra_hosts).
      - type: bind
        source: /run/avahi-daemon
        target: /run/avahi-daemon
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8140/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Non-root multicast _rosy-world._tcp advertiser on host network (works without D-Bus or /etc/avahi writes).
  world-advertise:
    profiles: ["mdns"]
    image: rosy-world:${ROSY_WORLD_IMAGE_TAG:-local}
    user: "${ROSY_WORLD_UID:-10001}:${ROSY_WORLD_GID:-10001}"
    network_mode: host
    command:
      - python
      - -B
      - /world/world_mdns.py
      - advertise
      - --mode
      - zeroconf
      - --port
      - "${ROSY_WORLD_PORT:-8140}"
      - --hostname
      - "${ROSY_WORLD_MDNS_HOST:-}"
      - --health-url
      - "http://127.0.0.1:${ROSY_WORLD_PORT:-8140}/healthz"
    volumes:
      - type: bind
        source: .
        target: /world
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      world:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # Read-only bridge joining a separate Non-World Fleet stack via mDNS (<host>.local).
  real-bridge:
    profiles: ["real"]
    image: rosy-world:${ROSY_WORLD_IMAGE_TAG:-local}
    user: "${ROSY_WORLD_UID:-10001}:${ROSY_WORLD_GID:-10001}"
    command:
      - python
      - -B
      - /world/bridge_real_fleet.py
      - --fleet-mdns-host
      - "${ROSY_FLEET_MDNS_HOST:-rosy-fleet-r.local}"
      - --fleet-port
      - "${ROSY_FLEET_PORT:-8443}"
      - --world-url
      - http://world:8140
      - --bundle
      - /world
      - --interval
      - "${ROSY_WORLD_BRIDGE_INTERVAL:-0.5}"
    environment:
      ROSY_FLEET_TOKEN: "${ROSY_FLEET_TOKEN:-}"
      ROSY_WORLD_INGEST_TOKEN: "${ROSY_WORLD_INGEST_TOKEN:-}"
      SSL_CERT_FILE: /run/rosy-ca/site-ca.crt
    volumes:
      - type: bind
        source: .
        target: /world
        read_only: true
      - type: bind
        source: "${ROSY_FLEET_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}"
        target: /run/rosy-ca/site-ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/avahi-daemon
        target: /run/avahi-daemon
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      world:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  sim-swarm:
    profiles: ["demo-swarm"]
    image: rosy-world:${ROSY_WORLD_IMAGE_TAG:-local}
    user: "${ROSY_WORLD_UID:-10001}:${ROSY_WORLD_GID:-10001}"
    command:
      - python
      - -B
      - /world/world_swarm.py
      - --bundle
      - /world
      - --world-url
      - http://world:8140
    environment:
      ROSY_WORLD_INGEST_TOKEN: "${ROSY_WORLD_INGEST_TOKEN:-}"
    volumes:
      - type: bind
        source: .
        target: /world
        read_only: true
      - type: bind
        source: /run/avahi-daemon
        target: /run/avahi-daemon
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      world:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
