# D-927 C3: the one-arm simulation ARM_TRANSFER installation. tools/sim/transfer_installation.py builds the
# owner catalog, the Fleet PhysicalTransferPolicy and the observer/writer bases from this file only.
# Poses come from the reviewed cell job (cell.yaml + recipe.yaml), so pick/place match the sim world's boxes.
schema: rosy.sim-transfer-installation/1
workcell_id: omx_cell_sim
instance_id: omx_cell_sim_01
calibration_revision: omx-f-gazebo-only-v1   # = run_cell_owner.py CellOwnerSettings
transform_revision: gz-world-is-link0-v1
base: {position_m: [0, 0, 0], orientation_xyzw: [0, 0, 0, 1]}   # robot base = link0 = sim world origin
cell: operations/processes/cell/examples/omx_sim/cell.yaml
recipe: operations/processes/cell/examples/omx_sim/recipe.yaml
source_step: 0   # pick at the infeed
target_step: 1   # first place on pallet A
object: {ref: object-1, body: infeed_block}
# Arm links at rest must stay this far outside each zone, before and after (PHYSICAL_ZONE_OCCUPIED).
zone_half_m: [0.035, 0.035]
zone_clearance_above_m: 0.03
zone_margin_m: 0.01
producer_id: sim-transfer-observer
evaluator_revision: sim-transfer-observer-v1
# Settle tolerances for a MuJoCo place; tighten after C4 measures the real spread.
position_tolerance_m: 0.01
orientation_tolerance_rad: 0.1
max_linear_speed_m_s: 0.01
max_angular_speed_rad_s: 0.05
max_age_ns: 500000000
min_separation_ns: 100000000
capability_revision: sim-arm-transfer-1
config_revision: sim-transfer-installation-1
