# OMX-F simulation cell planning profile (D-402 §4). Its sha256 is the plan's
# profile_revision, and the simulation ArmCommandOwner config is built from it.
#
# These are NOMINAL limits for Gazebo only. They are not OMX-F hardware limits:
# the URDF's +/-2*pi bounds protect nothing, and no ROBOTIS hardware limit for
# OMX-F has been pinned yet. Real hardware needs its own measured profile and
# collision scene (D-402 §4, §7). This planner has no collision scene.
schema: rosy.omx-sim-cell-profile.v1
profile: simulation
# sha256 of the canonical omx_f_kinematics.yaml document (OmxKinematics.revision).
# A geometry change must be re-reviewed against these limits before it is accepted.
kinematics_revision: 27cd572830f931b57eedec55081b77749f65dcd059d11e34199bdcb1bb6db04d

# Rates: open_manipulator 5.1.2 moveit_config omx_f/joint_limits.yaml gives
# max_velocity 5.0 rad/s and max_acceleration 5.0 rad/s^2 per joint with
# default scaling 0.1 "for beginners". 0.1 x 5.0 = 0.5 for both, below the URDF 4.8 rad/s.
#
# Positions: narrowed from URDF +/-2*pi. Each range (a) contains 0 (Gazebo spawn pose)
# and the SRDF "home" (0, -1.57, 1.57, 1.57, 0) so the owner never latches HOLD on the
# arm's own rest poses, and (b) covers the elbow-up top-down IK over the workspace box
# below (swept 2026-10-01: q2 in [-1.05, 0.90], q3 in [-1.13, 1.46], q4 in [0.96, 2.06]
# for z <= 0.15 m) with ~0.1-0.3 rad margin. Everything else is excluded.
joints:
  joint1: {position: [-2.6, 2.6], velocity: 0.5, acceleration: 0.5}   # one turn minus 0.54 rad each side; one heading per target
  joint2: {position: [-1.7, 1.2], velocity: 0.5, acceleration: 0.5}
  joint3: {position: [-1.3, 1.7], velocity: 0.5, acceleration: 0.5}
  joint4: {position: [-0.3, 2.3], velocity: 0.5, acceleration: 0.5}
  # The gripper is symmetric under 180 deg, so q5 needs a window of at least pi;
  # +/-2.0 rad = pi + 0.86 rad margin.
  joint5: {position: [-2.0, 2.0], velocity: 0.5, acceleration: 0.5}

gripper:
  joint: gripper_joint_1
  # SRDF group_state close = 0.0, open = 1.0; vendor teleop clamps to [0.0, 1.1].
  # Lower bound -0.1 leaves room for the ~0.011 rad mimic readback error below closed.
  position: [-0.1, 1.1]
  velocity: 0.5
  acceleration: 0.5
  open: 1.0
  closed: 0.0

# One ROS goal per phase; a phase that needs longer is rejected, never split (D-402 §6).
# Rejection is the safe outcome: no partial plan, the Job holds for the operator.
# Basis (measured 2026-10-02 with planning_limit_fraction 0.8, 800 random layouts:
# home (0.12, 0, 0.12), pick/place uniform in the 0.08-0.25 m ring at z 0.01-0.06 m,
# random yaw, carry_z 0.11 m): over the 550 geometrically feasible layouts the longest
# non-grasp phase is p50 16.2 s, p90 28.1 s, p95 35.2 s, max 63.3 s. A 30 s cap rejected
# 48/550 (8.7%); 40 s rejects 17/550 (3.1%), the slow tail being wrist swings near the
# singularity radius. Grasp is one 1.0 rad stroke: 3.5 s at 0.4 rad/s, 0.4 rad/s^2, + 0.5 s.
phase_max_duration_s:
  approach: 40.0
  grasp: 4.0
  transfer: 40.0
  release: 40.0

# TCP box in link0. Radial reach at table height is ~0.28 m (L1 0.1205 + L2 0.162,
# wrist 0.1206 above TCP); above z 0.22 m the reachable radius collapses below 0.1 m.
# z_min 0.005 keeps the TCP (~fingertip) off the base plane.
workspace:
  min_m: [-0.28, -0.28, 0.005]
  max_m: [0.28, 0.28, 0.22]

# The planner times trajectories at limit x this fraction; the owner still admits up to
# the full limits above. Reason: the JointTrajectoryController interpolates between the
# reported points with quintic splines, and at the trapezoid's accel/cruise/decel corners
# that spline overshoots the reported acceleration (review probe 2026-10-02: ~1.65x).
# 0.8 gives headroom so ordinary blends stay at or below the full limit; it does not
# bound the worst corner overshoot, which remains a simulation-only risk (D-402 §4).
planning_limit_fraction: 0.8

# 5 mm Cartesian samples: at the 0.05 m singularity radius a step turns joint1 by at most
# 0.1 rad; at the reach edge the spline chord error between IK-exact samples is sub-mm.
cartesian_step_m: 0.005
# Angular sample spacing for yaw changes and gripper strokes.
angular_step_rad: 0.05
# Largest legitimate per-sample change is ~0.1 rad (joint1 near the singularity radius)
# plus one angular step 0.05; 0.25 rad still catches a pi branch flip of joint5.
max_waypoint_joint_step_rad: 0.25
# Wrist point closer than this to the joint1 axis is rejected: joint1 is ill-defined there
# and the TCP would be over the base body (link0 footprint).
singularity_radius_m: 0.05
# Start-state checks (D-402 §6 home rule). 0.02 rad = twice the 0.01 rad arm readback
# tolerance used by the Pilot Gazebo probe (deploy/robot/omx/probe_pilot_sim_http.py).
tool_down_tolerance_rad: 0.02
home_joint_tolerance_rad: 0.02
start_state_tolerance_rad: 0.02

owner:
  # Same as the Pilot simulation owner (pilot_sim_server.py).
  max_joint_state_age_s: 0.5
  # Longest phase plus 5 s for ROS acceptance/feedback latency.
  action_timeout_s: 45.0
