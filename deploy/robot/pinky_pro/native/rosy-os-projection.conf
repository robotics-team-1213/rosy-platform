[Service]
Type=oneshot
RemainAfterExit=yes
ExecStartPre=
ExecStartPre=/usr/bin/python3 -I -B /opt/rosy/os-bootstrap/os_storage_dispatch.py --projected
ExecStart=
ExecStart=/usr/bin/test -s /var/lib/rosy/provisioning/complete.json
ProtectHome=read-only
RuntimeDirectory=rosy-os-state
RuntimeDirectoryMode=0700
ReadWritePaths=-/run/rosy-os-state -/var/lib/rosy-device/state/config.lock
