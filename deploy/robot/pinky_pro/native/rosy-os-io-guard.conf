[Unit]
Requires=rosy-os-motion-guard.service
After=rosy-os-motion-guard.service

[Service]
# EnvironmentFile wins over Environment and is read after the operator's runtime.env.
EnvironmentFile=-/run/rosy-os-update/motion.env
# Reconstruct again on every I/O restart, including after /run loss.
ExecStartPre=+/usr/bin/python3 -I -B /opt/rosy/os-bootstrap/native-runtime/os_motion_guard.py reconcile
ReadWritePaths=/run/rosy-os-update
