# D-189 D4: /var/lib/rosy is a root-owned parent. Each unit owns only its own
# subdirectory (StateDirectory=rosy/<unit>), and root-only state stays root's.
d /var/lib/rosy 0755 root root -
# slam_toolbox in rosy-navigation (User=rosy-io) writes saved maps here. The
# setgid group lets CORE (Group=rosy-core) read a saved map back under UMask=0027.
d /var/lib/rosy/maps 2750 rosy-io rosy-core -
# A map a 005 card left owned by rosy-core must not block slam_toolbox's save.
z /var/lib/rosy/maps/* - rosy-io rosy-core -
# D-373: learned-perception models. The operator's delivery writes them as root
# (sudo -n install); rosy-camera only reads. Shadow recordings need no rule:
# they live under the camera unit's own StateDirectory=rosy/camera.
d /var/lib/rosy/models 0750 root rosy-camera -
# D-411: Pilot recordings. rosy-camera's pilot_recorder_node writes them; the setgid
# group lets CORE (Group=rosy-core, ReadOnlyPaths) list and stream them under UMask=0027.
# The recorder never creates this directory itself.
d /var/lib/rosy/pilot-recordings 2750 rosy-camera rosy-core -
# Cards that ran release 2026.09.23-005 had these chowned to rosy-core by the
# old StateDirectory=rosy. Hand them back to root; modes are left as they are.
Z /var/lib/rosy/provisioning - root root -
Z /var/lib/rosy/releases - root root -
Z /var/lib/rosy/config - root root -
