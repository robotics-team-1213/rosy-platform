# Installed only by the A/B root assembler.
[Unit]
# Requires would stop cached recovery on CORE maintenance while activation owns the release lock.
# The frozen helper itself requires a fresh PROJECTED receipt before any mutation.
Wants=rosy-sd-provision.service
After=rosy-sd-provision.service

[Service]
Type=oneshot
RemainAfterExit=yes
ExecStart=
ExecStart=/usr/bin/python3 -I -B /opt/rosy/os-bootstrap/native-runtime/os_boot_recover.py
ExecStartPost=
ProtectHome=read-only
ReadWritePaths=-/var/lib/rosy-device/state/config.lock
TimeoutStartSec=180
