# OS-owned early admission; no application launcher may run before recovery.
[Service]
Type=oneshot
RemainAfterExit=yes
ExecStart=
ExecStart=/usr/bin/python3 -I -B /opt/rosy/os-bootstrap/os_storage_dispatch.py
ExecStartPost=/usr/bin/python3 -I -B /opt/rosy/os-bootstrap/os_ssh_hostkeys.py
ReadWritePaths=/var/lib/rosy-device /etc/ssh
ProtectHome=read-only
