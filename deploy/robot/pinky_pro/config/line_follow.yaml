/**/ir_adc_node:
  ros__parameters:
    interface: /dev/i2c-1
    address: 8
    rate_hz: 20.0

/**/line_observer_node:
  ros__parameters:
    # Measure these six endpoints on each robot, then enable. The external file
    # is mounted read-only into rosy-io, so tuning never rebuilds the image.
    ir_calibration_enabled: false
    ir_black: [0.0, 0.0, 0.0]
    ir_white: [0.0, 0.0, 0.0]
    ir_min_span: 100.0
    ir_min_white: 0.55
    ir_min_contrast: 0.15
    camera_bright_threshold: 180
    camera_roi_top_fraction: 0.40
    camera_washed_fraction: 0.40
    camera_min_pixels: 80
