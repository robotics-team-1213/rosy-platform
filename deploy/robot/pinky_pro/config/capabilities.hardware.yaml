# Pinky Pro board support — runtime mode `hardware`.
# Motor + RPLidar + Nav2 localization/navigation. SLAM is not launched.
capability_version: 1
navigation:
  goal_navigation: true
  return_home: true
  max_linear_velocity: 0.20
  max_angular_velocity: 0.80
teleop: true
slam: false
swarm:
  # Implemented in CORE, held for this slice: following drives the robot
  # autonomously and needs field acceptance before it is advertised.
  follow: false
  lead: false
vision:
  enabled: false
omx:
  enabled: false
ai:
  enabled: false
docking:
  supported: false
sensors: [lidar, encoder]
events: ["safety.*", "mode.*", "waypoint.*", "system.*", "command.*"]
api_versions: [v1]
protocol_version: "1.0"
