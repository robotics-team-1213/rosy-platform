# Pinky Pro board support — runtime mode `core`.
# CORE only. No /dev. Do not advertise motors, lidar, or Nav2.
capability_version: 1
navigation:
  goal_navigation: false
  return_home: false
  max_linear_velocity: 0.20
  max_angular_velocity: 0.80
teleop: false
slam: false
swarm:
  # CORE only: no motors and no Nav2, so there is nothing to follow with.
  follow: false
  lead: false
vision:
  enabled: false
omx:
  enabled: false
ai:
  enabled: false
docking:
  supported: false
sensors: []
events: ["safety.*", "mode.*", "waypoint.*", "system.*", "command.*"]
api_versions: [v1]
protocol_version: "1.0"
