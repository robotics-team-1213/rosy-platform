# ROSY OS v1 product-image inputs (D-161)
#
# The product target is Ubuntu Server 24.04 LTS arm64 with native ROS 2 Jazzy.
# Any `null` or `verified: false` value is an explicit release blocker. Replace
# it only with evidence captured on the native ARM64 build host.

schema_version: 1

board:
  name: pinky_pro
  host: raspberry-pi-5
  first_runtime: core
  note: >-
    First ROSY OS board support. Runtime overlays live in
    deploy/robot/pinky_pro/config/capabilities.{core,motor,hardware}.yaml.

product_artifact:
  format: raw-disk-image
  compression: xz
  filename_template: rosy-os-pinky-pro-{release_id}-arm64.img.xz
  intermediate_suffix: .img
  rootfs_expansion_mib: 8192
  raspberry_pi_imager_compatible: true
  contains_partition_table: true
  device_neutral: true
  forbidden_formats: [iso]
  required_files:
    - manifest.json
    - SHA256SUMS
    - SHA256SUMS.sig
    - sbom.spdx.json
    - deb-packages.txt
    - rosy-packages.txt
    - required-ros-packages.txt
    - source-revision.txt
    - base-image-provenance.json
    - build-provenance.json
    - artifact-report.md
  excluded_device_fields:
    - hostname
    - device_uid
    - robot_number
    - wifi_credentials
    - fleet_pairing_credential
    - ssh_private_key
  note: >-
    D-164 product output. The common signed image remains device-neutral;
    per-card identity and credentials enter only through deploy/robot/pinky_pro/sd after write.

image_tool:
  name: rosy-ubuntu-image-builder
  repository: in-tree:deploy/robot/pinky_pro/image
  commit: null
  verified: false
  note: >-
    Pin this repository revision after the Ubuntu image builder is implemented
    and proven on the native ARM64 release host.

base_image:
  publisher: Canonical
  product: ubuntu-server
  variant: preinstalled-server-arm64+raspi
  url: https://cdimage.ubuntu.com/ubuntu/releases/24.04/release/ubuntu-24.04.5-preinstalled-server-arm64+raspi.img.xz
  sha256: b23371a5c8d02f612c26e7c18cacb81c5a48f968c7c66a2645391320aa94351e
  minimum_size_bytes: 1000000000
  checksum_url: https://cdimage.ubuntu.com/ubuntu/releases/24.04/release/SHA256SUMS
  checksum_signature_url: https://cdimage.ubuntu.com/ubuntu/releases/24.04/release/SHA256SUMS.gpg
  checksum_signing_key_fingerprint: 843938DF228D22F7B3742BC0D94AA3F0EFE21092
  checksum_keyring: /usr/share/keyrings/ubuntu-archive-keyring.gpg
  verified: false
  note: >-
    URL, SHA-256, signed checksum URLs, and Canonical image-signing key were
    pinned from Canonical's 24.04 release material on 2026-09-22. Keep verified
    false until the signed checksum and image are checked on the native ARM64
    release host.

os:
  family: ubuntu-server
  release: "24.04"
  codename: noble
  architecture: arm64
  variant: preinstalled-server-arm64+raspi
  suite: noble
  verified: false
  apt_sources:
    - deb http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
    - deb http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
    - deb http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse

runtime:
  model: native-systemd
  service_manager: systemd
  container_runtime_required: false

ros:
  distribution: jazzy
  installation: native-deb
  architecture: arm64
  apt_repository: https://packages.ros.org/ros2/ubuntu
  apt_source_version: 1.2.0
  apt_source_url: https://github.com/ros-infrastructure/ros-apt-source/releases/download/1.2.0/ros2-apt-source_1.2.0.noble_all.deb
  apt_source_sha256: 0804d9b13db770eb87019be414cd78378835228ad5fa801fc88758596dd8f7e5
  apt_key_fingerprint: embedded-in-sha256-pinned-ros2-apt-source-package
  verified: false

hardware_dependencies:
  wiringpi_version: "3.20"
  wiringpi_url: https://github.com/WiringPi/WiringPi/releases/download/v3.20/wiringpi_3.20_arm64.deb
  wiringpi_sha256: 85f5965d57adb895b97b3f8b04083613d00964f930cb86822459eae5a97dc804
  rpi_ws281x_commit: 1396df4f35a86de0f7e5eda91d94d4539eef1727
  rpi_ws281x_url: https://codeload.github.com/jgarff/rpi_ws281x/tar.gz/1396df4f35a86de0f7e5eda91d94d4539eef1727
  rpi_ws281x_sha256: 18896f9576848944a7f53834b4e329aaeb1961d2cadf7bf67aecf1f9df91aaa6
  rpi_ws281x_pi5_patch: patches/rpi_ws281x-pi5-rev1.1.patch
  rpi_ws281x_pi5_patch_sha256: 9a1318891e9f25605ace107f5247984f8b6a70230660628f8a80b8f599658574
  sllidar_ros2_commit: 34300099fadfc772965962dec837bf436706188f
  sllidar_ros2_url: https://codeload.github.com/Slamtec/sllidar_ros2/tar.gz/34300099fadfc772965962dec837bf436706188f
  sllidar_ros2_sha256: 6a57c289a235a37dce0b07ef6fdc3ee003e646140d3fdc982988e7bf652367a7
  verified: true
  note: >-
    Pinky Pro native ARM64 build inputs. WiringPi is installed both on the
    build host and in the target rootfs; rpi_ws281x is linked statically into
    lamp_control from the pinned Pi 5 branch snapshot, with the in-tree
    rpi_ws281x_pi5_patch (Pi 5 rev 1.1 board ids, D-247) applied first.
    The same archive's rp1_ws281x_pwm/ kernel module is built in the image
    chroot against the image kernel's headers (customize-rootfs.sh, D-247).
    sllidar_ros2 (RPLIDAR C1 driver, D-192) is built from source into the
    release payload at the commit the Docker io image used; the archive
    hash was checked 2026-09-24 by two independent downloads.

python_runtime:
  requirements: device-python-requirements.txt
  requirements_sha256: 4c320f54011a8843b749deb40694662a7499d11ce2758ac3bcffdd352cd2cd06
  # D-373: runtime records whose requirements are a strict subset of this file.
  # The image and the bench install write them to the card
  # (python-runtime-compatible.sha256) so a release built for one still
  # activates and rolls back here. Never list a runtime that pins a different
  # version of anything this file pins.
  compatible_predecessors: [2b003fd4f94d89e3735f6225323df731c45aae0d35132e781f7680676d20bf00]
  python_version: "3.12"
  install_prefix: /usr/local
  pydantic_major: 2
  verified: true
  note: >-
    D-189. CORE's pip runtime (pydantic 2, fastapi, starlette, uvicorn,
    websockets and their closure), hash-locked per wheel for cp312 aarch64
    and x86_64. rosdep's apt python3-pydantic 1.10 / python3-fastapi 0.101
    stay installed but are shadowed by /usr/local. Hashes were checked on
    2026-09-24 by a --require-hashes download for both platforms.
    D-192 added the rosy-io set (dynamixel-sdk 3.8.4, pyserial 3.5) to the
    same file, so native_release.py's runtime check covers it too.
    D-373 appended the learned-perception block (onnxruntime 1.30.0,
    flatbuffers 25.12.19, packaging 26.3, protobuf 7.36.2; numpy stays apt's
    1.26.4) as the file's last block; hashes were checked on 2026-09-30 by a
    --require-hashes download for both platforms. The sha is sha256 of the
    file's LF bytes; without that block it is the previous 2b003fd4...

camera_runtime:
  sources: camera-sources.lock.json
  sources_sha256: 7ebd9965f2600b5f4fc0a157926cf01299d5d0327d6192686a858b47cc025b0e
  python_requirements: camera-python-requirements.txt
  python_requirements_sha256: c18879d5c285fa4dc4cc9d7944a867598812b6c3c6f1d82fab5ba2a926eac8ae
  verified: true
  note: >-
    D-288. Official Raspberry Pi source archives and CPython 3.12 aarch64
    Python packages are independently SHA-256 pinned. This verifies source
    identity, not an ARM64 image build or device capture.

containers:
  role: development-and-ci-only
  excluded_from_product_artifact: true

rosy_packages:
  required:
    - interfaces
    - core
    - pinky_pro
    - bringup
    - description
    - navigation
    - control
    - omx_adapter
    - led
    - sensor_adc
    - lamp_control
    - emotion
    - imu_bno055
  install_root: /opt/rosy/releases
  offline_first_boot: true
  inventory_required: true
  ros2_pkg_prefix_required: true

accounts:
  core_user: rosy-core
  core_uid: 960
  core_gid: 960
  io_user: rosy-io
  io_uid: 961
  io_gid: 961
  # D-190: rosy-boot-display.service (LCD, buzzer, battery ADC read).
  display_user: rosy-display
  display_uid: 962
  display_gid: 962
  login_uid_must_differ: true

sources:
  rosy_revision: null

provenance:
  record_installed_packages: true
  record_apt_repository_metadata: true
  record_build_host: true
  record_rosy_package_inventory: true
