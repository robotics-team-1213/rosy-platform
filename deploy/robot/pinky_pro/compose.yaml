name: rosy-runtime

x-ros-environment: &ros-environment
  ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:?ROS_DOMAIN_ID 미설정 — install-pi.sh 를 ROSY_ROBOT_NUMBER 와 함께 실행하라 (ADR D-33)}"
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  CYCLONEDDS_URI: file:///etc/rosy/cyclonedds.xml
  ROS_LOG_DIR: /tmp/ros-logs
  ROSY_MOTION_PROFILE_FILE: /etc/rosy/motion_profiles.yaml
  ROSY_NAMESPACE: "${ROSY_NAMESPACE:?ROSY_NAMESPACE 미설정 — install-pi.sh 를 ROSY_ROBOT_NUMBER 와 함께 실행하라 (ADR D-33)}"
  ROSY_ROBOT_NUMBER: "${ROSY_ROBOT_NUMBER:-}"

x-runtime-defaults: &runtime-defaults
  network_mode: host
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=128m,mode=1777
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  rosy-core:
    <<: *runtime-defaults
    image: "${ROSY_CORE_IMAGE:-rosy-core:dev}"
    build:
      context: ../..
      dockerfile: deploy/robot/pinky_pro/Dockerfile
      target: core
      args:
        ROS_IMAGE: "${ROS_IMAGE:-ros:jazzy-ros-base}"
    user: "${ROSY_UID:-1000}:${ROSY_GID:-1000}"
    environment:
      <<: *ros-environment
      HOME: /var/lib/rosy
      ROSY_CONFIG: /etc/rosy/rosy.yaml
      ROSY_HOST_ROOT: "${ROSY_HOST_ROOT:-/host}"
      ROSY_RUNTIME_MODE: "${ROSY_RUNTIME_MODE:-core}"
      ROSY_NAVIGATION_BACKEND: "${ROSY_NAVIGATION_BACKEND:-localization}"
      ROSY_MAP_OUTPUT_DIR: /var/lib/rosy/maps
      ROSY_DATA_PATH: /var/lib/rosy
      ROSY_DATA_GENERATION: "${ROSY_DATA_GENERATION:-}"
    command:
      - ros2
      - run
      - core
      - core
      - --ros-args
      - -r
      - "__ns:=/${ROSY_NAMESPACE}"
    volumes:
      - "${ROSY_CONFIG_PATH:-/etc/rosy/rosy.yaml}:/etc/rosy/rosy.yaml:ro"
      - "./config/profile.${ROSY_RUNTIME_MODE:-core}.yaml:/etc/rosy/profile.yaml:ro"
      - "./config/${ROSY_CAPABILITIES_FILE:-capabilities.core.yaml}:/etc/rosy/capabilities.yaml:ro"
      - "./config/motion_profiles.yaml:/etc/rosy/motion_profiles.yaml:ro"
      - "${ROSY_DATA_PATH:-/var/lib/rosy}:/var/lib/rosy"
      - "/proc/uptime:/host/proc/uptime:ro"
      - "/proc/loadavg:/host/proc/loadavg:ro"
      - "/proc/stat:/host/proc/stat:ro"
      - "/proc/net/dev:/host/proc/net/dev:ro"
      - "/proc/meminfo:/host/proc/meminfo:ro"
      - "/sys/class/thermal:/host/sys/class/thermal:ro"
      - "/sys/devices/virtual/thermal:/host/sys/devices/virtual/thermal:ro"
      - "/etc/os-release:/host/etc/os-release:ro"
      - "/etc/hostname:/host/etc/hostname:ro"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  rosy-motor:
    <<: *runtime-defaults
    profiles:
      - motor
    image: "${ROSY_IO_IMAGE:-rosy-io:dev}"
    build:
      context: ../..
      dockerfile: deploy/robot/pinky_pro/Dockerfile
      target: io
      args:
        ROS_IMAGE: "${ROS_IMAGE:-ros:jazzy-ros-base}"
    user: "${ROSY_UID:-1000}:${ROSY_GID:-1000}"
    group_add:
      - "${ROSY_DIALOUT_GID:-20}"
    environment:
      <<: *ros-environment
      HOME: /var/lib/rosy
    volumes:
      - "./config/profile.${ROSY_RUNTIME_MODE:-core}.yaml:/etc/rosy/profile.yaml:ro"
      - "./config/motion_profiles.yaml:/etc/rosy/motion_profiles.yaml:ro"
    devices:
      - "${ROSY_MOTOR_DEVICE:-/dev/ttyAMA4}:/dev/rosy-motor"
    healthcheck:
      test:
        - CMD-SHELL
        - "ros2 node list 2>/dev/null | grep -Fxq '/${ROSY_NAMESPACE}/bringup'"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    command:
      - ros2
      - launch
      - bringup
      - bringup_robot.launch.py
      - "namespace:=${ROSY_NAMESPACE}"
      - "cmd_vel_timeout_s:=${ROSY_CMD_VEL_TIMEOUT_S:-0.5}"
      - "motor_device:=/dev/rosy-motor"
      - "motor_baudrate:=${ROSY_MOTOR_BAUDRATE:-1000000}"
      - "motor_ids:=${ROSY_MOTOR_IDS:-[1,2]}"
      - "max_linear_mps:=${ROSY_MAX_LINEAR_MPS:-0.20}"
      - "max_angular_rps:=${ROSY_MAX_ANGULAR_RPS:-0.80}"
      - "max_wheel_rpm:=${ROSY_MAX_WHEEL_RPM:-100.0}"
      - "motor_profile_acceleration:=${ROSY_MOTOR_PROFILE_ACCELERATION:-200}"
      - "enable_lidar:=false"
      - "enable_battery:=false"

  rosy-io:
    <<: *runtime-defaults
    profiles:
      - hardware
    image: "${ROSY_IO_IMAGE:-rosy-io:dev}"
    build:
      context: ../..
      dockerfile: deploy/robot/pinky_pro/Dockerfile
      target: io
      args:
        ROS_IMAGE: "${ROS_IMAGE:-ros:jazzy-ros-base}"
    user: "${ROSY_UID:-1000}:${ROSY_GID:-1000}"
    group_add:
      - "${ROSY_DIALOUT_GID:-20}"
      - "${ROSY_VIDEO_GID:-44}"
      - "${ROSY_I2C_GID:-998}"
    environment:
      <<: *ros-environment
      HOME: /var/lib/rosy
      ROSY_MAP: "${ROSY_MAP:-/var/lib/rosy/maps/site.yaml}"
      ROSY_NAVIGATION_BACKEND: "${ROSY_NAVIGATION_BACKEND:-localization}"
    volumes:
      - "${ROSY_DATA_PATH:-/var/lib/rosy}/maps:/var/lib/rosy/maps:${ROSY_MAPS_MOUNT_MODE:-ro}"
      - "${ROSY_DATA_PATH:-/var/lib/rosy}/commissioning:/var/lib/rosy/commissioning:rw"
      - "./config/profile.${ROSY_RUNTIME_MODE:-core}.yaml:/etc/rosy/profile.yaml:ro"
      - "./config/motion_profiles.yaml:/etc/rosy/motion_profiles.yaml:ro"
      - "${ROSY_LINE_FOLLOW_CONFIG_PATH:-./config/line_follow.yaml}:/etc/rosy/line_follow.yaml:ro"
    devices:
      - "${ROSY_MOTOR_DEVICE:-/dev/ttyAMA4}:/dev/rosy-motor"
      - "${ROSY_LIDAR_DEVICE:-/dev/ttyAMA0}:/dev/ttyAMA0"
      - "${ROSY_CAMERA_DEVICE:-/dev/video0}:/dev/video0"
      - "${ROSY_I2C_DEVICE:-/dev/i2c-1}:/dev/i2c-1"
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - "nodes=$$(ros2 node list 2>/dev/null); echo \"$$nodes\" | grep -Fxq '/${ROSY_NAMESPACE}/bringup' && echo \"$$nodes\" | grep -Fxq '/${ROSY_NAMESPACE}/lifecycle_manager_navigation' && if [ '${ROSY_NAVIGATION_BACKEND:-localization}' = slam ]; then echo \"$$nodes\" | grep -Fxq '/${ROSY_NAMESPACE}/slam_toolbox'; else echo \"$$nodes\" | grep -Fxq '/${ROSY_NAMESPACE}/amcl' && echo \"$$nodes\" | grep -Fxq '/${ROSY_NAMESPACE}/map_server'; fi"
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
    command:
      - ros2
      - launch
      - navigation
      - hardware.launch.py
      - "namespace:=${ROSY_NAMESPACE}"
      - "navigation_backend:=${ROSY_NAVIGATION_BACKEND:-localization}"
      - "cmd_vel_timeout_s:=${ROSY_CMD_VEL_TIMEOUT_S:-0.5}"
      - "motor_device:=/dev/rosy-motor"
      - "motor_baudrate:=${ROSY_MOTOR_BAUDRATE:-1000000}"
      - "motor_ids:=${ROSY_MOTOR_IDS:-[1,2]}"
      - "max_linear_mps:=${ROSY_MAX_LINEAR_MPS:-0.20}"
      - "max_angular_rps:=${ROSY_MAX_ANGULAR_RPS:-0.80}"
      - "max_wheel_rpm:=${ROSY_MAX_WHEEL_RPM:-100.0}"
      - "motor_profile_acceleration:=${ROSY_MOTOR_PROFILE_ACCELERATION:-200}"
      - "enable_lidar:=true"
      - "enable_battery:=false"
      - "enable_line_follow:=true"
      - "camera_device:=/dev/video0"
      - "ir_interface:=/dev/i2c-1"
      - "line_follow_config:=/etc/rosy/line_follow.yaml"
