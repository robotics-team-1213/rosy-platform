# Pinky Pro — first ROSY OS board catalog.
# Compose mounts capabilities.${ROSY_RUNTIME_MODE}.yaml and profile.${ROSY_RUNTIME_MODE}.yaml.
board: pinky_pro
host: raspberry-pi-5
identity:
  platform: rosy
  model_family: pinky
  device_name_prefix: rosy-pinky
  short_code_length: 4
slices:
  required: [core]
  available: [motor, io, nav, vision, omx, ai]
presets:
  core: [core]
  motor: [core, motor]
  hardware: [core, motor, io, nav]
modes:
  core:
    capabilities: capabilities.core.yaml
    profile: profile.core.yaml
    teleop: false
    sensors: []
    preset: core
  motor:
    capabilities: capabilities.motor.yaml
    profile: profile.motor.yaml
    teleop: true
    sensors: [encoder]
    preset: motor
  hardware:
    capabilities: capabilities.hardware.yaml
    profile: profile.hardware.yaml
    teleop: true
    sensors: [lidar, encoder]
    preset: hardware
aliases:
  pi5-lite: hardware
# D-84: Device hardware 프로필이 열리기 전까지 CORE/io 이미지에 넣지 않는 패키지.
hardware_packages:
  - led
  - sensor_adc
  - lamp_control
  - emotion
  - imu_bno055
# D-190 / D-181: host devices of the boot display, outside CORE and every
# runtime mode. rosy-boot-display.service is their only user (its DeviceAllow
# is exactly this set; test_device_surface_contract.py). They are not CORE
# capabilities: the API cannot drive them, so no capabilities.*.yaml
# advertises them (D-32). The emotion face stays bench-only (D-169).
boot_display:
  unit: rosy-boot-display.service
  lcd:
    driver: st7789
    spi: /dev/spidev0.0
    gpiochip: /dev/gpiochip4
    bcm_lines: {rst: 27, dc: 25, backlight: 18}
  buzzer:
    gpiochip: /dev/gpiochip4
    bcm_line: 22
    # Sibling boards' pin; unconfirmed on the Pro until heard on the device.
    enabled_by_default: false
  battery_adc:
    bus: /dev/i2c-1
    address: 0x08
    channel: 4
    access: read
