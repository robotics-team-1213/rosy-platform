# Pinky Pro — first ROSY OS board catalog.
# Compose mounts capabilities.${ROSY_RUNTIME_MODE}.yaml and profile.${ROSY_RUNTIME_MODE}.yaml.
board: pinky_pro
host: raspberry-pi-5
identity:
  platform: rosy
  model_family: pinky
  device_name_prefix: rosy-pinky
  short_code_length: 4
slices:
  required: [core]
  available: [motor, io, nav, vision, omx, ai]
presets:
  core: [core]
  motor: [core, motor]
  hardware: [core, motor, io, nav]
modes:
  core:
    capabilities: capabilities.core.yaml
    profile: profile.core.yaml
    teleop: false
    sensors: []
    preset: core
  motor:
    capabilities: capabilities.motor.yaml
    profile: profile.motor.yaml
    teleop: true
    sensors: [encoder]
    preset: motor
  hardware:
    capabilities: capabilities.hardware.yaml
    profile: profile.hardware.yaml
    teleop: true
    sensors: [lidar, encoder]
    preset: hardware
aliases:
  pi5-lite: hardware
# D-84: Device hardware 프로필이 열리기 전까지 CORE/io 이미지에 넣지 않는 패키지.
hardware_packages:
  - led
  - sensor_adc
  - lamp_control
  - emotion
  - imu_bno055
# D-190 / D-181: host devices of the boot display, outside CORE and every
# runtime mode. rosy-boot-display.service is their only user (its DeviceAllow
# is exactly this set; test_device_surface_contract.py). They are not CORE
# capabilities: the API cannot drive them, so no capabilities.*.yaml
# advertises them (D-32). The emotion face stays bench-only (D-169).
boot_display:
  unit: rosy-boot-display.service
  lcd:
    driver: st7789
    spi: /dev/spidev0.0
    # gpiochip4 is the RP1 header (pinctrl-rp1, 54 lines; D-190 S3 check 1).
    gpiochip: /dev/gpiochip4
    bcm_lines: {rst: 27, dc: 25, backlight: 18}
  buzzer:
    gpiochip: /dev/gpiochip4
    bcm_line: 4
    # Heard by a person on rosy_18 on 2026-09-26 (D-190 table, D-247); BCM 22,
    # the sibling boards' pin, is silent on the Pro. Enabling it by default is D-190's call.
    enabled_by_default: false
    # ROSY_BUZZER_PIN accepts only these (rosy-boot-display.py BUZZER_LINES).
    allowed_bcm_lines: [4, 5, 6, 16, 17, 20, 21, 22, 23, 24, 26]
  battery_adc:
    bus: /dev/i2c-1
    address: 0x08
    channel: 4
    # The true grant (D-190 security review): the node is rw for any address
    # on the bus; only the program limits itself to 0x08, and the D-192 flock
    # is advisory. The chip grant likewise covers all 54 RP1 lines.
    access: rw-any-address
    lock: advisory-flock
  # Every other header BCM line and its owner; buzzer lines must avoid them.
  header_bcm_owners:
    0: i2c0 (HAT EEPROM, bench IMU)
    1: i2c0 (HAT EEPROM, bench IMU)
    2: i2c1 SDA (ADC)
    3: i2c1 SCL (ADC)
    7: spi0 CE1
    8: spi0 CE0 (LCD)
    9: spi0 MISO
    10: spi0 MOSI (LCD)
    11: spi0 SCLK (LCD)
    12: uart4 TX (motor)
    13: uart4 RX (motor)
    14: uart0 TX (LiDAR)
    15: uart0 RX (LiDAR)
    18: LCD backlight
    19: WS2812 lamp (bench)
    25: LCD DC
    27: LCD RST
