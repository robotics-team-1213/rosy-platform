    rosy-cam-stream.service: {run: oneshot, channel: snapshot, template: deploy/site/rosy-cam-stream.service, source: ".local/share/rosy/cam-screen", doc: deploy/site/README.md}
    rosy-cam-stream.timer: {run: timer, channel: snapshot, template: deploy/site/rosy-cam-stream.timer, doc: deploy/site/README.md}
    rosy-omx-autoupdate.service: {run: oneshot, channel: updater, template: deploy/robot/omx/rosy-omx-autoupdate.service, doc: docs/adr/D-805-host-update-channels-and-site-freeze.md}
