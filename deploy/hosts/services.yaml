      doc: deploy/model_pc/README.md
    rosy-review-release-update.timer: {run: timer, channel: updater, template: deploy/model_pc/rosy-review-release-update.timer, doc: deploy/model_pc/README.md}
    rosy-review-v12.service: {operator_restart: true, run: active, channel: signed, source: "rosy-ml/review-v12-code/current", note: "rosy-review-release-update (D-871)", doc: docs/adr/D-871-auto-update-every-host-service-and-update-view.md}
    rosy-review-v13-eval.service: {operator_restart: true, run: active, channel: signed, source: "rosy-ml/review-v13-eval-code/current", note: "rosy-review-release-update (D-871)", doc: docs/adr/D-871-auto-update-every-host-service-and-update-view.md}
    rosy-review-v13.service: {operator_restart: true, run: active, channel: signed, source: "rosy-ml/review-v13-code/current", doc: docs/adr/D-561-model-review-ui-signed-code-follow.md}
    rosy-tensorboard.service: {operator_restart: true, run: active, channel: host, dropins: [retry.conf], doc: deploy/model_pc/README.md}
    rosy-test-storage.service: {run: oneshot, channel: copy, template: "rosy-ops:deploy/lab-host-storage/rosy-test-storage.service", copies: {rosy-test/maintenance/host_storage.py: "rosy-ops:tools/host_storage.py"}, doc: "rosy-ops:docs/lab-host-storage.md"}
    rosy-test-storage.timer: {run: timer, channel: copy, template: "rosy-ops:deploy/lab-host-storage/rosy-test-storage.timer", doc: "rosy-ops:docs/lab-host-storage.md"}
