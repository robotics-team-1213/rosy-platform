    rosy-omx-collection.service: {run: "off", channel: snapshot, template: deploy/robot/omx/rosy-omx-collection.service, doc: docs/plans/2026-10-17-omx-next-day-collection.md}
    rosy-omx-observation-bridge.service: {run: active, channel: snapshot, template: deploy/robot/omx/rosy-omx-observation-bridge.service, source: ".local/share/rosy/omx-observation/releases/*", dropins: [95-motor-health-d227b0c2c50a.conf], doc: deploy/robot/omx/README.md}
    rosy-omx-observer@.service: {run: "off", instances: [arm_a, arm_b], note: "2026-10-24: this PC holds the one-arm supply cell S; the two-arm boards are unplugged", channel: snapshot, template: deploy/robot/omx/rosy-omx-observer@.service, source: ".local/share/rosy/omx-observation/releases/*", dropins: [95-motor-health-d227b0c2c50a.conf], doc: deploy/robot/omx/README.md}
    rosy-site-config-reload.service: {run: "off", channel: retired, doc: deploy/site/README.md}
    rosy-site-fleet-mdns.service: {run: "off", channel: retired, doc: deploy/site/README.md}
    rosy-site-overhead-mdns.service: {run: "off", channel: retired, doc: deploy/site/README.md}
