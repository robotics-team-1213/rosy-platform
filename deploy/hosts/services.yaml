# D-852: the rosy/pinky user units each lab PC role runs and where each one's code comes from.
# tools/remote/update_status.py compares every lab PC against this file. Add, change or retire a unit
# on a lab PC in the same change that edits its entry here.
#
# run:      active (a service that stays up) | timer (an enabled, active timer) | oneshot (started by a
#           timer or by hand) | off (kept on disk, must be neither enabled nor active)
# channel:  autoupdate (CI-green main through an updater unit, D-805) | updater (the updater unit itself)
#           | signed (D-446 signed model-code release) | snapshot (a reviewed source snapshot installed
#           by hand; update together with its acceptance) | installer (a commit-pinned repo installer)
#           | copy (repo files copied onto the host) | host (no repository code) | external (code
#           outside this repository) | adhoc (a temporary copy that must move into a release) | retired
# source:   glob, relative to the user's home, that the unit's code path must match
# template: repo unit file the installed unit file must equal byte for byte (CR ignored)
# copies:   installed path (relative to home) -> repo path (or "<repo>:<path>" for another repository)
# dropins:  drop-in file names the unit may carry; any other drop-in is reported
# instances_from: workcell-arms reads the selected workcell from the host's existing bridge configuration
# known_drift: why the installed unit or copy may differ for now; reported as KNOWN, not a failure
# operator_restart: a person may restart it from Fleet (D-991); the same list is in fleet/host_control.py and the helper
# gpu:      idle-yield (D-958: lends the GPU to experiments only while its role is idle; deploy/hosts/gpu_tenants.py) | keep
schema: rosy.host-services/1
# images: Docker repositories a role may keep (role and placement: Harbor ADR 0021, D-960). update_status reports any
# other repository and more than three tags of one, so test and rollback builds do not pile up on a host again.
images:
  model: [harborlogi, ghcr.io/robotics-team-1213/harborlogi, nginx, ros, rosy-omx-g2, rosy-omx-pilot, rosy-omx-probe, rosy-omx-workstation]
  site: [rosy-site-fleet, rosy-site-postgres, rosy-site-proxy, rosy-site-vision]
roles:
  model:
    rosy-dataset-review-account.service: {operator_restart: true, run: active, channel: snapshot, source: "rosy-ml/legacy-review-account-code/releases/*", doc: docs/adr/D-809-legacy-learning-account-boundary.md}
    rosy-dataset-review.service: {operator_restart: true, run: active, channel: external, source: "dataset-review-937*", dropins: [90-account-loopback.conf], doc: docs/adr/D-809-legacy-learning-account-boundary.md}
    rosy-edge-review.service: {operator_restart: true, run: active, channel: signed, source: "rosy-ml/edge-capture/review-code/current", note: "the one Learning center; rosy-review-release-update (D-857)", doc: docs/adr/D-857-rosy-learning-product-definition.md}
    rosy-harbor-nightly.service: {run: oneshot, channel: external, note: "Harbor repo tools/integration/nightly_full_flow.sh copied into ~/rosy-jobs/harbor-nightly", doc: docs/adr/D-927-harbor-first-flow-demo-seams-and-automated-sim.md}
    rosy-harbor-nightly.timer: {run: timer, channel: external, note: "02:30 nightly", doc: docs/adr/D-927-harbor-first-flow-demo-seams-and-automated-sim.md}
    rosy-learning-center.service: {run: "off", channel: retired, note: "candidate retired 2026-10-31; synthetic-only data kept in ~/rosy-learning-candidate-retired-20261031", doc: docs/adr/D-857-rosy-learning-product-definition.md}
    rosy-learning-center-update.service: {run: "off", channel: retired, doc: docs/adr/D-857-rosy-learning-product-definition.md}
    rosy-learning-center-update.timer: {run: "off", channel: retired, doc: docs/adr/D-857-rosy-learning-product-definition.md}
    rosy-learning-redesign.service: {run: "off", channel: installer, note: "earlier Learning candidate (ac50d6330e)", doc: deploy/model_pc/README.md}
    rosy-learning-cycle-20261004.service: {run: "off", channel: retired, doc: deploy/model_pc/README.md}
    rosy-model-advertise.service: {run: "off", channel: retired, doc: deploy/site/README.md}
    rosy-model-code-update.service: {run: oneshot, channel: updater, doc: docs/adr/D-446-model-pc-code-auto-update.md}
