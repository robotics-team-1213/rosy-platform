    rosy-omx-camera-view.service: {run: active, channel: snapshot, template: deploy/robot/omx/rosy-omx-camera-view.service, source: ".local/share/rosy/omx-camera-pipeline/releases/*", doc: deploy/robot/omx/README.md}
