# Signed overlay for a control-unit neighbour on another PC (D-994). Add it after compose.control-unit.yaml.
# It publishes this unit's peer origin on one LAN address only, e.g. ROSY_CONTROL_UNIT_PEER_PUBLISH=192.168.1.93:8544:8544
# (host address:host port:the port in peer.Caddyfile). The remote side dials it through the peer `address`
# in its control-unit.yaml and still verifies this unit's peer certificate name; Bearer service auth is unchanged.
services:
  control-unit-peer:
    ports:
      - ${ROSY_CONTROL_UNIT_PEER_PUBLISH:?Set host_address:host_port:peer_port for the cross-host peer origin}
