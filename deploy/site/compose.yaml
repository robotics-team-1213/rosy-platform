# Host-side settings for site-firewall.py, read through `docker compose config` so the env
# file has one parser (Compose's). Not used by any container.
x-rosy-site:
  lan_iface: "${ROSY_SITE_LAN_IFACE:-}"
  allow_literal_bind: "${ROSY_SITE_ALLOW_LITERAL_BIND:-}"
  tls_host: "${ROSY_SITE_TLS_HOST:-}"

services:
  fleet:
    image: rosy-site-fleet:${ROSY_SITE_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/site/Dockerfile.fleet
    command:
      - --
      - python3
      - -m
      - fleet.cli
      - console
      - --robots
      - /run/rosy-config/robots.yaml
      - --site-config-optional
      - /run/rosy-config/fleet-site.yaml
      - --host
      - 0.0.0.0
      - --port
      - "${ROSY_FLEET_PORT:?set ROSY_FLEET_PORT}"
      - --web-common
      - /opt/rosy/web-common
      - --token-env
      - ROSY_SITE_REGISTRY_TOKEN
      - --discovery-token-env
      - ROSY_SITE_DISCOVERY_TOKEN
      - --vision-preview-secret-env
      - ROSY_VISION_PREVIEW_SECRET
      # Calibration-drift watch: Fleet reads Vision's D-375 map proposal server-side
      # (site CA via SSL_CERT_FILE, "vision" SAN on the site leaf) every 60 s.
      - --vision-url
      - https://vision:${ROSY_VISION_PORT:?set ROSY_VISION_PORT}
      - --lan-camera-proxy
      - --users-file
      - /run/rosy-config/site-users.yaml
      - --sightings-config
      - /run/rosy-config/site-cameras.yaml
      - --sightings-db
      - /var/lib/rosy/fleet.sqlite3
      - --events-db
      - /var/lib/rosy/fleet.sqlite3
      - --tasks-db
      - /var/lib/rosy/fleet.sqlite3
      - --robot-credential-key-file
      - /run/secrets/robot_credential_key
      - --tls-cert
      - /run/secrets/site_cert
      - --tls-key
      - /run/secrets/site_key
      # D-375 console map-fit overlay (display only); files baked in the image, read-only.
      - --site-lane-graph
      - /opt/rosy/maps/map_v2_fleet/lane_graph.yaml
      - --site-lane-paint
      - /opt/rosy/maps/map_v2_fleet/road_lines.stl
      # D-488: first active site map when the store has none (later edits live in the store).
      - --site-map-import
      - /opt/rosy/maps/map_v2_fleet/lane_graph.yaml
      # D-555: robots get the hub credential with this site name + CA (empty = hub link off).
      - --hub-link-hostname
      - "${ROSY_SITE_HUB_LINK_HOSTNAME:-}"
      - --hub-link-ca
      - "${ROSY_SITE_HUB_LINK_CA:-}"
      - --connection-mode
      - "${ROSY_FLEET_CONNECTION_MODE:-paired}"
    environment:
      ROSY_CREDENTIAL_PATHS: '{"ROSY_SITE_REGISTRY_TOKEN":"/run/secrets/registry_token","ROSY_FLEET_CEILING_NORTH_TOKEN":"/run/secrets/fleet_sighting_token","ROSY_SITE_DISCOVERY_TOKEN":"/run/secrets/discovery_token","ROSY_VISION_PREVIEW_SECRET":"/run/secrets/vision_preview_secret"}'
      SSL_CERT_FILE: /run/secrets/site_ca
      ROSY_ENROLLED_TLS_BINDINGS_FILE: "${ROSY_SITE_ENROLLED_TLS_BINDINGS_FILE:-}"
      ROSY_DEPLOYMENT: "${ROSY_DEPLOYMENT:-}"
    volumes:
      - "${ROSY_SITE_CONFIG_DIR:?set ROSY_SITE_CONFIG_DIR}:/run/rosy-config:ro"
      - sighting_data:/var/lib/rosy
      # D-524 Service Control key, targets, known_hosts: Fleet only, outside the config dir
      # that Vision also mounts. Docker creates it empty when absent; Fleet then answers 503.
      - /etc/rosy/fleet-host-control:/run/rosy-fleet-host-control:ro
      # NSS queries host Avahi; directory bind follows socket replacement after daemon restart.
      - type: bind
        source: /run/avahi-daemon
        target: /run/avahi-daemon
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - registry_token
      - fleet_sighting_token
      - discovery_token
      - vision_preview_secret
      - robot_credential_key
      - site_cert
      - site_key
      - site_ca
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('https://fleet:${ROSY_FLEET_PORT:?set ROSY_FLEET_PORT}/healthz', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks: [site_backend, robot_egress]

  vision:
    image: rosy-site-vision:${ROSY_SITE_IMAGE_TAG:-local}
    stop_signal: SIGINT
    build:
      context: ../..
      dockerfile: deploy/site/Dockerfile.vision
    command:
      - --
      - python3
      - -m
      - rosy_vision.cli
      - vision
      # D-457 marker priority and anonymous fallback, display-only.
      - --track
      # D-539: the operator-relearned empty-track background survives restarts.
      - --track-state
      - /var/lib/rosy-vision/track
      - --config
      - /run/rosy-config/site-cameras.yaml
      - --host
      - 0.0.0.0
      - --port
      - "${ROSY_VISION_PORT:?set ROSY_VISION_PORT}"
      - --tls-cert
      - /run/secrets/site_cert
      - --tls-key
      - /run/secrets/site_key
      # D-375 map-proposal (lane paint in map metres); baked in the image, read-only.
      - --map-paint
      - /opt/rosy/maps/map_v2_fleet/road_lines.stl
    environment:
      ROSY_CREDENTIAL_PATHS: '{"ROSY_PHONE_CEILING_NORTH":"/run/secrets/phone_ingress_token","ROSY_FLEET_CEILING_NORTH_TOKEN":"/run/secrets/fleet_sighting_token","ROSY_VISION_PREVIEW_SECRET":"/run/secrets/vision_preview_secret"}'
      SSL_CERT_FILE: /run/secrets/site_ca
    volumes:
      # Vision reads only its camera file. Never the whole config dir: Fleet roster, users and
      # CORE credentials live there (D-524 security review). Secrets sit outside it too.
      - type: bind
        source: "${ROSY_SITE_CONFIG_DIR:?set ROSY_SITE_CONFIG_DIR}/site-cameras.yaml"
        target: /run/rosy-config/site-cameras.yaml
        read_only: true
        bind:
          create_host_path: false
      - vision_state:/var/lib/rosy-vision
    secrets:
      - phone_ingress_token
      - fleet_sighting_token
      - vision_preview_secret
      - site_cert
      - site_key
      - site_ca
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /run:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('https://vision:${ROSY_VISION_PORT:?set ROSY_VISION_PORT}/healthz', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks: [site_backend]

  proxy:
    image: rosy-site-proxy:${ROSY_SITE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.proxy
    user: "10001:10001"
    ports:
      # 127.0.0.1 (default) or the 0.0.0.0 wildcard; LAN exposure is limited by interface in
      # mangle PREROUTING (site-firewall.py), so no LAN IP is ever written here.
      - "${ROSY_SITE_BIND_ADDRESS:-127.0.0.1}:${ROSY_SITE_HTTPS_PORT:?set ROSY_SITE_HTTPS_PORT}:${ROSY_SITE_HTTPS_PORT:?set ROSY_SITE_HTTPS_PORT}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    secrets:
      - site_cert
      - site_key
      - site_ca
    environment:
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data
      # Caddyfile addresses use these names with no default.
      ROSY_SITE_HTTPS_PORT: ${ROSY_SITE_HTTPS_PORT:?set ROSY_SITE_HTTPS_PORT}
      ROSY_FLEET_PORT: ${ROSY_FLEET_PORT:?set ROSY_FLEET_PORT}
      ROSY_VISION_PORT: ${ROSY_VISION_PORT:?set ROSY_VISION_PORT}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001
      - /config:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
      - /data:rw,noexec,nosuid,size=32m,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test: [CMD, caddy, validate, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      fleet:
        condition: service_healthy
      vision:
        condition: service_healthy
    networks:
      site_backend:
        aliases: [proxy]
      site_edge: {}

volumes:
  sighting_data:
  vision_state:

networks:
  site_backend:
    internal: true
  robot_egress:
  site_edge:

secrets:
  registry_token:
    file: ${ROSY_SITE_SECRETS_DIR:?set ROSY_SITE_SECRETS_DIR}/registry_token
  phone_ingress_token:
    file: ${ROSY_SITE_SECRETS_DIR:?set ROSY_SITE_SECRETS_DIR}/phone_ingress_token
  fleet_sighting_token:
    file: ${ROSY_SITE_SECRETS_DIR:?set ROSY_SITE_SECRETS_DIR}/fleet_sighting_token
  discovery_token:
    file: ${ROSY_SITE_SECRETS_DIR:?set ROSY_SITE_SECRETS_DIR}/discovery_token
  vision_preview_secret:
    file: ${ROSY_SITE_SECRETS_DIR:?set ROSY_SITE_SECRETS_DIR}/vision_preview_secret
  robot_credential_key:
    file: ${ROSY_SITE_SECRETS_DIR:?set ROSY_SITE_SECRETS_DIR}/robot_credential_key
  site_cert:
    file: ${ROSY_SITE_SECRETS_DIR:?set ROSY_SITE_SECRETS_DIR}/site.crt
  site_key:
    file: ${ROSY_SITE_SECRETS_DIR:?set ROSY_SITE_SECRETS_DIR}/site.key
  site_ca:
    file: ${ROSY_SITE_SECRETS_DIR:?set ROSY_SITE_SECRETS_DIR}/site-ca.crt
