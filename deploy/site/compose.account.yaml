# Optional Account HTTPS frontend on the existing proxy. The host firewall admits
# port443 only on lo/tailscale0; primary site discovery and ingress stay unchanged.
x-rosy-site:
  account_https: "1"

services:
  fleet:
    environment:
      ROSY_ACCOUNT_CONFIG: "${ROSY_ACCOUNT_CONFIG:?set ROSY_ACCOUNT_CONFIG}"
  proxy:
    ports:
      - "0.0.0.0:443:443"
    environment:
      ROSY_ACCOUNT_HTTPS_HOST: "${ROSY_ACCOUNT_HTTPS_HOST:?set ROSY_ACCOUNT_HTTPS_HOST}"
    volumes:
      - type: bind
        source: ./Caddyfile.account
        target: /etc/caddy/account/frontend.caddy
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - account_cert
      - account_key

secrets:
  account_cert:
    file: /etc/rosy/account-tls/account-frontend.crt
  account_key:
    file: /etc/rosy/account-tls/account-frontend.key
