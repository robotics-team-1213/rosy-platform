# Independent Account process and HTTPS frontend. The host firewall admits
# port443 only on lo/tailscale0; primary site discovery and ingress stay unchanged.
x-rosy-site:
  account_https: "1"

services:
  fleet:
    environment:
      ROSY_ACCOUNT_CONFIG: ""
      ROSY_FLEET_ACCOUNT_CLIENT_CONFIG: "${ROSY_FLEET_ACCOUNT_CLIENT_CONFIG:?set ROSY_FLEET_ACCOUNT_CLIENT_CONFIG}"
  account:
    image: rosy-site-fleet:${ROSY_SITE_IMAGE_TAG:-local}
    command:
      - --
      - python3
      - -m
      - rosy_account
      - --config
      - "${ROSY_ACCOUNT_CONFIG:?set ROSY_ACCOUNT_CONFIG}"
      - --db
      - /var/lib/rosy-account/account.sqlite3
      - --host
      - 0.0.0.0
      - --port
      - "8098"
      - --web-root
      - /opt/rosy/src/site/fleet/_source_roots/console
      - --web-common
      - /opt/rosy/web-common
      - --tls-cert
      - /run/secrets/site_cert
      - --tls-key
      - /run/secrets/site_key
    environment:
      PYTHONPATH: /opt/rosy/src/operations/account:/opt/rosy/src/contracts/foundation
      SSL_CERT_FILE: /run/secrets/site_ca
    volumes:
      - /etc/rosy/account:/run/rosy-account:ro
      - account_state:/var/lib/rosy-account
    secrets: [site_cert, site_key, site_ca]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: [CMD, python3, -m, rosy_account.healthcheck]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks: [site_backend]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
  proxy:
    labels:
      org.rosy.site-account-caddy-sha256: unbuilt
    networks:
      site_backend: {}
      site_edge:
        aliases:
          - "${ROSY_ACCOUNT_HTTPS_HOST:?set ROSY_ACCOUNT_HTTPS_HOST}"
    ports:
      - "0.0.0.0:443:443"
    environment:
      ROSY_ACCOUNT_HTTPS_HOST: "${ROSY_ACCOUNT_HTTPS_HOST:?set ROSY_ACCOUNT_HTTPS_HOST}"
    volumes:
      - type: bind
        source: ./Caddyfile.account
        target: /etc/caddy/account/frontend.caddy
        read_only: true
        bind:
          create_host_path: false
      # Keep atomic certificate replacement visible inside the running proxy.
      - type: bind
        source: /etc/rosy/account-tls
        target: /run/rosy-account-tls
        read_only: true
        bind:
          create_host_path: false

volumes:
  account_state:
