[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosy-monitoring"
version = "0.1.0"
description = "ROS-free ROSY system monitoring observations and scoped read configuration"
requires-python = ">=3.12"
dependencies = ["core_common==0.0.2", "pydantic>=2,<3", "PyYAML>=6,<7",
                "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rosy.monitoring*"]
namespaces = true
