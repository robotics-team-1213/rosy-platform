# Rosy Cell demo cell for the OMX-F Gazebo workcell (C3, D-402 simulation only).
# Robot base frame = link0 = Gazebo world origin (vendor spawn at 0,0,0; URDF world_fixed is identity).
# Table top is z = 0. Gazebo world: integrations/simulation/gazebo/worlds/omx_cell_workcell.sdf (same numbers).
#
# Reach (host sweep 2026-10-02, analytic top-down IK under deploy/robot/omx/sim/cell_profile.yaml,
# every heading and yaw 0/90 deg): TCP radius 0.058-0.269 m at z 0.005, 0.058-0.261 m at z 0.05,
# 0.058-0.232 m at z 0.12. Every taught point below lies at TCP radius <= 0.23 m.
schema: rosy_cell.cell/2
frame_rules: {min_span_m: 0.02, min_angle_deg: 10.0, max_tilt_deg: 5.0}
frames:
  base: {origin: [0, 0, 0], x_point: [0.1, 0, 0], plane_point: [0, 0.1, 0]}
  # 0.10 x 0.08 x 0.01 m pallet plates; origin = near-left corner of the top face.
  pallet_a: {origin: [0.13, 0.01, 0.01], x_point: [0.23, 0.01, 0.01], plane_point: [0.13, 0.09, 0.01]}
  pallet_b: {origin: [0.13, -0.09, 0.01], x_point: [0.23, -0.09, 0.01], plane_point: [0.13, -0.01, 0.01]}
stations:
  # Pose of the item's top face (TCP convention of rosy_cell Steps).
  # yaw pi/2 (C3b): the pick then runs at joint5 ~ 0. At yaw 0 it needs joint5 ~ pi/2, where
  # in Gazebo the fingers stop on the wrist at ~0.47 rad even when empty (2026-10-02).
  infeed: {frame: base, x: 0.0, y: 0.17, z: 0.03, yaw: 1.5707963267948966}
  # Sheet stack on a 28 mm stand: a sheet lying on the table (z 0.002) is below the profile's
  # TCP floor z 0.005 and was rejected OUTSIDE_WORKSPACE in the first sweep.
  sheets: {frame: base, x: 0.0, y: -0.17, z: 0.03, yaw: 0.0}
# Tool-down TCP home above the gap between the pallets.
home: {x: 0.12, y: 0.0, z: 0.12, yaw: 0.0}
# OmxKinematics.revision of middleware/apps/device/omx/adapter/config/omx_f_kinematics.yaml (= cell_profile.yaml).
kinematics_revision: 27cd572830f931b57eedec55081b77749f65dcd059d11e34199bdcb1bb6db04d
approach_clearance_m: 0.03
# Tool: OMX-F fingertips reach this far below the TCP (= deploy/robot/omx/sim/cell_profile.yaml
# gripper.fingertip_overhang_m, from the pinned URDF and finger mesh). carry_z and the
# grasp_depth check use it (C3b review minor 4).
fingertip_overhang_m: 0.00257
