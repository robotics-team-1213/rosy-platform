<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rosy Fleet — 로그인</title>
  <link rel="icon" type="image/svg+xml" href="/common/icons/console.svg">
  <link rel="stylesheet" href="/common/tokens.css">
  <script src="/common/theme.js"></script>
  <link rel="stylesheet" href="/common/components.css">
  <link rel="stylesheet" href="/console/assets/password-login.css">
  <script type="module" src="/common/ui.js"></script>
  <script type="module" src="/console/assets/login-page.js"></script>
</head>
<body class="fleet-account-page">
  <ui-shell grammar="procedure">
    <ui-topbar><ui-brand href="/console"><b>Rosy Fleet</b><small>관제 로그인</small></ui-brand></ui-topbar>
    <main class="fleet-login-main fleet-account-panel">
      <h1 id="login-heading" class="ui-page-heading">관제 로그인</h1>
      <p>ROSY 계정으로 로그인하세요.</p>
      <p id="login-context">로그인 후 원래 업무로 돌아갑니다.</p>
      <div id="password-login" class="password-login"></div>
      <ui-status id="login-availability" state="pending" role="status">로그인 설정을 확인하고 있습니다.</ui-status>
      <a id="login-back" class="ui-disclosure-row" href="/console">원래 업무로 돌아가기</a>
    </main>
  </ui-shell>
</body>
</html>
