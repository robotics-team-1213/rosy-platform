[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosy-media"
version = "0.1.0"
description = "ROSY WebRTC media session authority, separate from Fleet"
requires-python = ">=3.12"
dependencies = ["core_common>=0.0.2", "fastapi==0.141.1", "uvicorn==0.52.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rosy_media*"]
