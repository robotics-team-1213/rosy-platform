<!doctype html>
<html lang="ko" data-theme="dark" data-theme-pin="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rosy Games — 경기 보드</title>
  <link rel="stylesheet" href="/common/tokens.css">
  <link rel="stylesheet" href="/common/components.css">
  <link rel="stylesheet" href="/common/component-controls.css">
  <link rel="stylesheet" href="/common/readout-strip.css">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/common/ui.js"></script>
  <script type="module" src="/board.js"></script>
</head>
<body>
  <ui-shell grammar="focal">
  <a class="skip-link" href="#match-main">경기 필드로 건너뛰기</a>
  <noscript><ui-status state="error">이 화면은 브라우저 스크립트를 사용합니다. 스크립트를 허용한 뒤 다시 여세요. 비상 정지는 로봇 본체의 물리 스위치로 항상 사용할 수 있습니다.</ui-status></noscript>
  <ui-topbar role="banner">
    <ui-brand href="/" aria-label="Rosy Games 경기 보드 홈">
      <b><span class="board-wordmark">Games</span></b>
      <small>1v1 피치 · 노트북 게임 호스트</small>
    </ui-brand>
    <p id="phase">대기</p>
    <p id="connection">경기 데이터 대기 중</p>
    <a id="account-login" href="/api/account/login" hidden>Rosy Account 로그인</a>
    <a data-account-profile hidden></a>
    <ui-button id="account-logout" kind="quiet" type="button" hidden>로그아웃</ui-button>
    <ui-button id="halt" kind="irreversible" data-always-live type="button">두 로봇 정지</ui-button>
    <p class="halt-note">
      <span id="halt-hint" hidden>스페이스 키로도 두 로봇을 세웁니다</span>
      <span id="halt-denied" hidden>정지 요청은 운용 권한 계정만 받습니다</span>
      <span id="halt-unavailable">계정 확인 불가 · 정지는 계속 누를 수 있습니다</span>
      <span id="halt-status" role="status" aria-live="polite"></span>
    </p>
  </ui-topbar>
  <p id="score-evidence" hidden>마지막 수신 점수</p>
  <section class="score" aria-label="점수">
    <dl class="ui-readout" data-form="strip">
      <div>
        <dt id="home-name">홈</dt>
        <dd id="home-score">—</dd>
      </div>
      <div>
        <dt id="away-name">원정</dt>
        <dd id="away-score">—</dd>
      </div>
    </dl>
  </section>
  <p id="match-announcement" class="sr-only" role="status" aria-live="polite"></p>
  <main id="match-main" class="match-layout" aria-label="경기 필드와 관측" tabindex="-1">
    <h1 class="sr-only">Rosy Games — 경기 운영</h1>
    <div class="field-media ui-pane">
      <div class="pitch-wrap" id="pitch-wrap">
        <canvas id="pitch" width="720" height="480" aria-label="필드 미터 보드" aria-describedby="field-evidence"></canvas>
        <p id="field-evidence">경기장 정보 대기 중</p>
      </div>
    </div>
    <ui-section class="field-details" role="region" aria-label="필드 관측">
      <h2 class="ui-section-heading">필드 관측</h2>
      <p id="stair1">마커·공 관측 정보 대기 · 운용 승인 아님</p>
      <ui-tag id="lost" status="warn" hidden>유실</ui-tag>
      <details class="ui-disclosure"><summary>마커 ID 자세히</summary>
        <ul id="markers" class="chips" aria-label="보이는 마커"></ul>
        <img id="frame" alt="천장 프레임" hidden>
      </details>
    </ui-section>
  </main>
  </ui-shell>
</body>
</html>
