[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosy-app-gateway"
version = "0.1.2"
description = "ROSY site gateway application composition"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6", "rosy-palletizing==0.1.2", "rosy-execution==0.1.2"]

[project.scripts]
rosy-site-gateway = "rosy_gateway.compose:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rosy_gateway*"]
namespaces = true
