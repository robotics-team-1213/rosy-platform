[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rosy-account"
version = "0.1.0"
description = "Rosy human account authority"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "oauthlib==4.0.0", "joserfc", "cryptography", "PyYAML", "core_common>=0.0.2"]

[project.scripts]
rosy-account = "rosy_account.__main__:main"

[tool.setuptools]
packages = ["rosy_account"]
