schema: rosy.platform-parts.v1

# D-427 wave 0 item 5: colcon source roots, relative to the repo root. Every
# colcon, rosdep, payload and image consumer reads this one line through
# tools/harness/colcon_roots.py (stdlib-only, so keep it a one-line flow list).
# Checked by test/architecture/test_colcon_roots.py.
colcon_roots: [learning, operations, middleware, contracts, integrations, shared]

# D-427 ownership manifest after wave 5: every tracked source root maps to one
# D-427 part. `legacy` fields stay for one release to guard rebasing branches.
# Checked by test/architecture/test_platform_parts.py.
#
# Coverage: each tracked file resolves to its deepest matching entry, so a
# nested entry carves a subtree out of its parent. Exempt: files at the repo
# root and Markdown folder notes in directories no entry covers.
#
# `import_prefix` lists the Python top-level names a root installs, so an
# imported module can be traced back to its owner. Script folders that put
# themselves on sys.path have none.

parts: [middleware, operations, learning, contracts, integrations, shared_web, profiles, deploy, tools, test, docs]

# D-427 §2. Same-part imports are always allowed. Parts not listed here
# (profiles, deploy, tools, test, docs) are outside the import rules.
#
# D-429 §4 api rule, on top of the table: a root is an api root only when it sets
# `api: true` and every import_prefix ends in `.api`. An api root imports only
# contracts and other api roots. An integration imports contracts and the api roots
# of the parts whose `integrations:` list admits its kind.
import_rules:
  contracts:
    allow: []
  integrations:
    allow: [contracts]          # and its own entry only; another adapter is forbidden
  shared_web:
    allow: [contracts]
  middleware:
    allow: [contracts, shared_web]   # shared_web is for ui roots only (not enforced in Python)
    integrations: [robots, policies/lerobot_inference, simulation]
    forbidden_external: [lerobot, torch]   # training stack; devices ship onnxruntime only (D-356)
  operations:
    allow: [contracts, shared_web]
    integrations: [models, storage]
  learning:
    allow: [contracts]
    integrations: [models, policies/lerobot_training, simulation, storage]

# D-429 §1 five-concern view plus D-430 §1 `safety`. Every root carries one
# `concern:`. The view does not change import_rules above. `safety` is not only a
# view: D-430 §3 invariants (test/architecture/test_safety_separation.py) and the
# §5 `Safety-Review:` trailer check (tools/harness/safety_review.py) read it.
concerns: [learning, decision, control, safety, contracts, other]

roots:
