  - middleware/core/services/core_features/line_follow/clearance.py
  - middleware/core/api_web/core_api_web/api/v1/safety.py
  - contracts/foundation/core_common/robot_body.py
  - middleware/apps/device/omx/adapter/omx_adapter/command_owner.py
  - middleware/apps/device/omx/adapter/omx_adapter/local_stop.py
  - middleware/apps/device/omx/adapter/omx_adapter/action_api.py
  - middleware/apps/device/omx/adapter/omx_adapter/owner_recovery_api.py
