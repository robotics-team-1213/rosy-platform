# D-430 §1 drift anchors and §3 public entry points. `symbol` is the dotted module
# path plus the (possibly nested) definition; each must resolve to a safety file.
# `string` anchors are operation literals compared with `==` inside `in`.
# `public: true` marks what decision/learning code may import (D-430 §3); a class
# or function that holds a public anchor is importable as its owner.
# D-430 §4 approval record (validated on tracked YAML only, not on the runtime
# PUT or device overlays): a robot config whose safety.fleet_loss_policy is not
# STOP/HOLD carries safety.fleet_loss_policy_approval {robot, approver, evidence}.
