schema: rosy.sim2real-gaps.v1

# sim2real gap registry (D-480: M sim modelling, R real-drive
# replay, D device runtime support, infra run environment).
# `rosy_harness.py lint` checks every row; `generate` writes docs/reference/sim2real-gaps.md.
#   tier: list, first = where the gap is handled now, later = where it moves.
#   evidence: ADR id, repo path (optional :33 / :26-33 / :33,108), or
#             {path, branch} for a branch-only file (move it to a plain path when it lands).
#   status: OPEN | IN-PROGRESS | CLOSED | HOLD; CLOSED needs validated_by.
# A validation run (docs/validation/*) names the rows it covers and updates them in the same commit.

