# Module harness registry.
# Design: docs/plans/2026-09-15-module-harness-design.md (ADR D-61 Accepted).
# Regenerate after editing any progress.md / logs.md:
#   python tools/harness/rosy_harness.py generate

adr_log: docs/reference/ROSY ADR Log.md

# ADR gaps live in tools/harness/adr_gaps.txt (D-510).

status: STATUS.md

# sim2real gap registry (linted) and its generated table.
sim2real_gaps: tools/harness/sim2real_gaps.yaml
sim2real_table: docs/reference/sim2real-gaps.md
stale_after_commits: 5

# D-73: `tests` feeds generated index.md. `functional` is the module's own
# shipped-code surface. Shared compose/Nav2 slice files are contracts only.
modules:
  - name: core
    path: middleware/core/gateway
    tests: [middleware/core/gateway/test]
    functional_kind: pytest
    functional: [middleware/core/gateway/test]
  - name: deploy
    path: deploy
    tests: [test]
    functional_kind: host-contract
    functional: [test/test_robot_runtime.py]
  - name: control
    path: middleware/perception
    tests: [middleware/perception/test, test/test_control_absorption_package.py]
    functional_kind: pytest
    functional: [middleware/perception/test]
  - name: fleet
    path: operations/fleet
    tests: [operations/fleet/test]
    functional_kind: pytest
    functional: [operations/fleet/test]
  - name: games
    path: operations/apps/games
    tests: [operations/apps/games/test, test/test_rosy_games_surface.py]
    functional_kind: pytest
    functional: [operations/apps/games/test]
  - name: rosy_vision
    path: operations/vision
    tests: [operations/vision/test]
    functional_kind: pytest
    functional: [operations/vision/test]
  - name: rosy_cell
    path: operations/processes/cell
    tests: [operations/processes/cell/test]
    functional_kind: pytest
    functional: [operations/processes/cell/test]
  - name: palletizing
    path: operations/processes/palletizing
    tests: [test/test_platform_palletizing_compat.py, test/architecture/test_platform_dependency_boundaries.py]
    functional_kind: pytest
    functional: [test/test_platform_palletizing_compat.py]
  # D-374: Android JVM tests need a JDK/Gradle, so the host functional surface is the
  # registry/icon/role contract tests; `gradlew testDebugUnitTest` runs in android.yml.
  - name: cam
    path: operations/ui/cam
    tests: [test/architecture/test_app_roles.py, shared/web/test/test_surface_icons.py]
