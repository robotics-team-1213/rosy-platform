# D-73: `tests` feeds generated index.md. `functional` is the module's own
# shipped-code surface. Shared compose/Nav2 slice files are contracts only.
modules:
  - name: core
    path: middleware/core/gateway
    tests: [middleware/core/gateway/test]
    functional_kind: pytest
    functional: [middleware/core/gateway/test]
  - name: deploy
    path: deploy
    tests: [test]
    functional_kind: host-contract
    functional: [test/test_robot_runtime.py]
  - name: control
    path: middleware/perception
    tests: [middleware/perception/test, test/test_control_absorption_package.py]
    functional_kind: pytest
    functional: [middleware/perception/test]
  - name: fleet
    path: operations/fleet
    tests: [operations/fleet/test]
    functional_kind: pytest
    functional: [operations/fleet/test]
  - name: games
    path: operations/apps/games
    tests: [operations/apps/games/test, test/test_rosy_games_surface.py]
    functional_kind: pytest
    functional: [operations/apps/games/test]
  - name: rosy_vision
    path: operations/vision
    tests: [operations/vision/test]
    functional_kind: pytest
    functional: [operations/vision/test]
  - name: rosy_cell
    path: operations/processes/cell
    tests: [operations/processes/cell/test]
