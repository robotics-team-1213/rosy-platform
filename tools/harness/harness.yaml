# D-73: `tests` feeds generated index.md. `functional` is the module's own
# shipped-code surface. Shared compose/Nav2 slice files are contracts only.
modules:
  - name: core
    path: src/runtime/gateway
    tests: [src/runtime/gateway/test]
    functional_kind: pytest
    functional: [src/runtime/gateway/test]
  - name: deploy
    path: deploy
    tests: [test]
    functional_kind: host-contract
    functional: [test/test_robot_runtime.py]
  - name: control
    path: src/runtime/sensing
    tests: [src/runtime/sensing/test, test/test_control_absorption_package.py]
    functional_kind: pytest
    functional: [src/runtime/sensing/test]
