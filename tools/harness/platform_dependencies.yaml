schema: rosy.platform-dependencies.v1

# Existing Python components only. Add new paths in the same change that creates them.
components:
  - name: contracts
    path: contracts/foundation/core_common
    import_prefix: core_common
  - name: cell_process_compat
    path: operations/processes/cell/rosy_cell
    import_prefix: rosy_cell
  - name: palletizing_process
    path: operations/processes/palletizing/src/rosy/processes/palletizing
    import_prefix: rosy.processes.palletizing
  - name: fleet_site
    path: operations/fleet/fleet
    import_prefix: fleet
  - name: omx_device_adapter
    path: middleware/apps/device/omx/adapter/omx_adapter
    import_prefix: omx_adapter
  - name: world_api
    path: operations/world/src/rosy/world/api
    import_prefix: rosy.world.api
  - name: skill_contracts
    path: contracts/skill/src/rosy/contracts/skill
    import_prefix: rosy.contracts.skill
  - name: skill_api
    path: middleware/skills/api/src/rosy/skills/api
    import_prefix: rosy.skills.api
  - name: execution_api
    path: operations/execution/src/rosy/execution/api
    import_prefix: rosy.execution.api
  - name: omx_transfer_integration
    path: integrations/robots/omx/src/rosy/integrations/robots/omx
    import_prefix: rosy.integrations.robots.omx
  - name: gateway_app
    path: operations/apps/fleet/src/rosy_gateway
    import_prefix: rosy_gateway
  - name: agent_app
    path: middleware/apps/device/omx/agent/src/rosy_agent
    import_prefix: rosy_agent

# Static absolute imports and relative imports resolved from their package path.
boundaries:
  - importer_prefix: core_common
    forbidden_imports: [fleet, rosy_cell, omx_adapter, rclpy]
  - importer_prefix: rosy_cell
    forbidden_imports: [fleet, omx_adapter, rclpy]
  - importer_prefix: fleet
    forbidden_imports: [rosy_cell, omx_adapter, rclpy]
  - importer_prefix: omx_adapter
    forbidden_imports: [fleet, rosy_cell]
  - importer_prefix: rosy.execution.api
    forbidden_imports: [rosy.processes.palletizing]
  - importer_prefix: rosy.processes.palletizing
    forbidden_imports: [fleet, rosy_cell, omx_adapter, rclpy]
  - importer_prefix: rosy.integrations.robots.omx
    forbidden_imports: [fleet, rosy_cell, rclpy]
  - importer_prefix: rosy_agent
    forbidden_imports: [fleet, rosy_cell, rclpy]

# Contract canaries exercise forbidden edges even when one endpoint is not built yet.
future_boundary_canaries:
  - importer_prefix: rosy.execution.api
    forbidden_imports: [rosy.processes.palletizing]
  - importer_prefix: rosy.decision
    forbidden_imports: [omx_adapter, rosy.integrations.robots]
  - importer_prefix: rosy.skills.manipulation
    forbidden_imports: [rosy.execution]
