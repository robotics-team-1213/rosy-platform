schema: rosy.platform-dependencies.v1

# Existing Python components only. Add new paths in the same change that creates them.
components:
  - name: contracts
    path: src/contracts/foundation/core_common
    import_prefix: core_common
  - name: cell_process_compat
    path: src/site/cell/rosy_cell
    import_prefix: rosy_cell
  - name: fleet_site
    path: src/site/fleet/fleet
    import_prefix: fleet
  - name: omx_device_adapter
    path: src/products/omx/adapter/omx_adapter
    import_prefix: omx_adapter
  - name: world_api
    path: modules/world/src/rosy/world/api
    import_prefix: rosy.world.api
  - name: skill_api
    path: modules/skills/api/src/rosy/skills/api
    import_prefix: rosy.skills.api
  - name: execution_api
    path: modules/execution/src/rosy/execution/api
    import_prefix: rosy.execution.api

# Static absolute imports and relative imports resolved from their package path.
boundaries:
  - importer_prefix: core_common
    forbidden_imports: [fleet, rosy_cell, omx_adapter, rclpy]
  - importer_prefix: rosy_cell
    forbidden_imports: [fleet, omx_adapter, rclpy]
  - importer_prefix: fleet
    forbidden_imports: [rosy_cell, omx_adapter, rclpy]
  - importer_prefix: omx_adapter
    forbidden_imports: [fleet, rosy_cell]
  - importer_prefix: rosy.execution.api
    forbidden_imports: [rosy.processes.palletizing]

# Contract canaries exercise forbidden edges even when one endpoint is not built yet.
future_boundary_canaries:
  - importer_prefix: rosy.execution.api
    forbidden_imports: [rosy.processes.palletizing]
  - importer_prefix: rosy.decision
    forbidden_imports: [omx_adapter, rosy.integrations.robots]
  - importer_prefix: rosy.skills.manipulation
    forbidden_imports: [rosy.execution]
