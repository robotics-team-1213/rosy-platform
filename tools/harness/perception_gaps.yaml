# Perception blind-spot registry. Sibling of sim2real_gaps.yaml (D-480), not a
# row in it. `rosy_harness.py lint` checks every row; `generate` writes
# docs/reference/perception-gaps.md.
#   kind: miss (seen and wrong) or candidate (not adopted; HOLD or CLOSED only).
#   born: recording id YYYYMMDDThhmmssZ, device:YYYY-MM-DD, or an in-repo .md path.
#   evidence: ADR id, repo path (optional :33 / :26-33 / :33,108), or {path, branch}.
#   replay: a repo file, or unbuilt. CLOSED forbids unbuilt and requires validated_by.
#   status: OPEN | IN-PROGRESS | CLOSED | HOLD.
# A replay that moves the born recording's counts updates the row in that same commit.
# Do not close a row by flipping a robot flag or wiring an unwired candidate.

