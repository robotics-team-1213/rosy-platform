# D-356 intake: shadow-deployment eligibility only. Not the D-205 selection gate.
max_host_latency_ms_p50: 400      # dev-PC CPU; Pi numbers are measured on device
max_nan_frames: 0
min_visible_fraction: 0.30        # of replay frames with visible lane evidence
replay_sources: ["data/teleop/learning/*.mp4"]
max_frames_per_source: 200
# D-379 d3 fixed eval set (lane_seg only). eval_set: path under --root to an eval set
# version folder, e.g. data/perception/store/evalsets/<name>/<content_sha>; null = no eval.
# Thresholds stay null until a baseline model has been scored on that set.
eval_set: null
eval_max_frames: 400
min_eval_miou: null
max_eval_miou_drop: 0.01          # fail below the best earlier pass on the same set minus this
min_lane_marking_iou: null        # per lane_marking-role class; mIoU above leaves out background
# D-423: object_det overrides; no rule-based reference, so no visibility check.
object_det:
  max_host_latency_ms_p50: 400
  max_nan_frames: 0
  max_detections_per_frame_p95: 32  # a flood of boxes is a broken model or threshold
  # int8 models only: convert.py's max |int8 - fp32| / peak |fp32| on random probes
  # (not camera frames, so a coarse bound; missing on an int8 model fails).
  max_int8_vs_fp32_rel: 0.05
