# recipe/3 (D-781 §1) for the G1 SIM run (D-781 G1: 3-4 skus on one 0.20 x 0.15 m pallet).
# Four foam skus; every grasped width is inside the 20-40 mm the sim jaw was calibrated for
# (deploy/robot/omx/sim/cell_profile.yaml gripper.jaw). Used with the mixed_two_arm cell.yaml.
schema: rosy_cell.recipe/3
name: g1-mixed-4sku
mode: palletize
items:
  - {sku: foam_40x30x30, length: 0.040, width: 0.030, height: 0.030, mass_kg: 0.020, grasp_depth: 0.015,
     quantity: 4, orientation: yaw_only, max_load_on_top_kg: 0.10}
  - {sku: foam_40x20x20, length: 0.040, width: 0.020, height: 0.020, mass_kg: 0.012, grasp_depth: 0.010,
     quantity: 4, orientation: yaw_only, max_load_on_top_kg: 0.06}
  - {sku: foam_30x30x20, length: 0.030, width: 0.030, height: 0.020, mass_kg: 0.012, grasp_depth: 0.010,
     quantity: 2, orientation: yaw_only, max_load_on_top_kg: 0.06}
  - {sku: foam_30x20x20, length: 0.030, width: 0.020, height: 0.020, mass_kg: 0.010, grasp_depth: 0.010,
     quantity: 4, orientation: yaw_only, max_load_on_top_kg: 0.05}
pallets:
  - {id: A, frame: pallet_a, length: 0.20, width: 0.15, max_stack_height: 0.07, max_load_kg: 0.5}
pick_stations: [infeed_left, infeed_right]
gap: 0.008
stability: {rule: support_ratio_v1, max_height_to_base_ratio: 1.5}
planner: {candidates: extreme_points, yaw_deg: [0, 90], allow_push: false}
