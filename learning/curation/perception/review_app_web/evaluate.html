<!doctype html>
<html lang="ko" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rosy Learning — 평가·승격</title><link rel="stylesheet" href="/common/tokens.css"><script src="/common/theme.js"></script>
<link rel="stylesheet" href="/common/components.css"><link rel="stylesheet" href="/common/app-shell.css"><link rel="stylesheet" href="/app.css">
<script type="module" src="/evaluate.js"></script></head>
<body><a class="skip-link" href="#evaluate-main">평가·승격으로 이동</a>
<ui-shell grammar="procedure" class="ui-app-shell"><!-- review:header:start -->
<ui-topbar role="banner"><ui-brand href="/learning" aria-label="Rosy Learning"><b>Learning</b></ui-brand><span data-spacer></span><a class="workspace-link" data-action-icon="account" data-learning-account-entry href="/accounts" title="로그인·계정">로그인·계정</a>
<ui-button kind="quiet" data-theme-cycle="" data-icon-only="" type="button" aria-label="테마 변경" data-action-icon="theme-dark"></ui-button></ui-topbar>
<!-- review:header:end -->
<div class="ui-app-body" data-seats="rail"><div class="ui-rail"><nav class="ui-rail-nav workspace-tabs" aria-label="학습 화면"><!-- review:rail:start -->
<a class="ui-rail-item" data-action-icon="list" href="/learning" aria-label="홈">홈</a><a class="ui-rail-item" data-action-icon="folder" href="/catalog" aria-label="자료 등록">자료</a><a class="ui-rail-item" data-action-icon="pencil" href="/" aria-label="정답 달기">정답</a><a class="ui-rail-item" data-action-icon="robot" href="/learning/tasks" aria-label="학습 실행">학습</a><a class="ui-rail-item" data-action-icon="check" href="/learning/evaluate" aria-label="평가·승격" aria-current="page">평가·승격</a>
<!-- review:rail:end --></nav></div>
<div class="ui-app-main"><div class="ui-pathbar"><h1>평가·승격</h1></div>
<main id="evaluate-main" class="learning-main" tabindex="-1">
<ui-status id="evaluate-error" state="error" role="alert" hidden></ui-status>
<ui-actions><ui-button id="evaluate-refresh" kind="quiet" type="button" data-action-icon="refresh">다시 확인</ui-button></ui-actions>
<section class="learning-section" aria-labelledby="sources-title">
<h2 id="sources-title">지금 있는 평가 근거</h2><p id="evaluate-filter" class="quiet" role="status">평가 근거를 불러오는 중입니다.</p>
<p class="quiet">읽기 전용입니다. 지표와 모델 합의(임시 정답)는 측정값이며 무엇도 승인하지 않습니다. 승격 평가에는 사람이 확정한 정답만 씁니다(D-857).</p>
<div id="evaluate-sources" class="evaluate-sources" aria-live="polite"></div>
</section>
<section class="learning-section" aria-labelledby="promote-title">
<h2 id="promote-title">승격 요청</h2>
<p>승격 승인과 배포는 Fleet에서 승인권자가 합니다(D-793). Learning은 확정 정답 평가 근거를 모아 넘기는 데까지입니다.</p>
<p id="promote-status" role="status">승격 요청 후보를 확인하는 중입니다.</p>
<ul id="promote-candidates" class="evaluate-runs"></ul>
<label id="promote-pick" hidden>후보 <select id="promote-candidate" class="ui-field"></select></label>
<ui-button id="promote-request" kind="quiet" disabled reason="승격 요청 후보를 확인하는 중입니다.">승격 요청</ui-button>
<p id="promote-result" role="status" hidden></p>
<h3>보낸 승격 요청</h3><ul id="promote-requests" class="evaluate-runs"></ul>
</section>
</main></div></div></ui-shell></body></html>
