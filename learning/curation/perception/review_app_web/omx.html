<!doctype html>
<html lang="ko" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rosy 개발 — 모방학습</title><link rel="stylesheet" href="/common/tokens.css"><script src="/common/theme.js"></script>
<link rel="stylesheet" href="/common/components.css"><link rel="stylesheet" href="/common/app-shell.css"><link rel="stylesheet" href="/app.css">
<script type="module" src="/omx.js"></script></head>
<body><a class="skip-link" href="#omx-main">모방학습으로 이동</a>
<ui-shell grammar="procedure" class="ui-app-shell"><ui-topbar role="banner"><ui-brand href="/learning" aria-label="Rosy Learning"><b>Learning</b></ui-brand><span data-spacer></span>
<label class="theme-label">화면 <select id="theme" class="ui-field"><option value="dark">어둡게</option><option value="light">밝게</option></select></label></ui-topbar>
<div class="ui-app-body" data-seats="rail"><div class="ui-rail"><nav class="ui-rail-nav workspace-tabs" aria-label="학습 화면"><a class="ui-rail-item" data-action-icon="list" href="/learning" aria-label="작업 목록">목록</a><a class="ui-rail-item" data-action-icon="box" href="/" aria-label="객체 검수">객체</a><a class="ui-rail-item" data-action-icon="pixels" href="/pixels" aria-label="픽셀 검수">픽셀</a><a class="ui-rail-item" data-action-icon="folder" href="/catalog" aria-label="자료 등록">자료</a><a class="ui-rail-item" data-action-icon="image" href="/learning/camera" aria-label="카메라 맞춤">카메라</a><a class="ui-rail-item" data-action-icon="robot" href="/learning/omx" aria-label="모방학습" aria-current="page">모방</a></nav></div>
<div class="ui-app-main"><div class="ui-pathbar"><h1>모방학습</h1></div>
<main id="omx-main" class="learning-main" tabindex="-1">
<div class="workspace-heading"><div><h2>OMX 시연 세트</h2><p>원본 Episode를 확인하고 필요한 파지 구간을 표시·검수합니다.</p></div>
<ui-button id="refresh" data-action-icon="refresh" kind="quiet">다시 확인</ui-button></div>
<ui-status id="omx-status" state="pending" role="status">불러오는 중입니다.</ui-status>
<p class="quiet">작업 목록에서 OMX 준비 세트를 연결한 뒤 「파지 구간 검수」를 여세요. 저장한 구간은 선택 JSON으로 내려받아 모델 PC에서 내보내고 학습합니다. 원본과 구간의 결과는 별도로 유지합니다. 카메라 맞춤 판정은 참고 기록입니다.</p>
<div id="sets" aria-live="polite"></div>
</main></div></div></ui-shell></body></html>
