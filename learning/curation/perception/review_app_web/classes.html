<!doctype html>
<html lang="ko" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning · 클래스 관리</title>
<link rel="stylesheet" href="/common/tokens.css"><link rel="stylesheet" href="/common/components.css"><link rel="stylesheet" href="/common/app-shell.css"><script src="/common/theme.js"></script><script type="module" src="/classes.js"></script></head>
<body><main style="max-width:70rem;margin:auto;padding:var(--space-4)"><a id="back" href="/">검수로 돌아가기</a><h1>클래스 관리</h1><p id="workspace" role="status">작업공간을 확인하는 중…</p>
<p>클래스는 이 프로젝트의 현재 작업공간 전체에 적용됩니다. 선택한 자료 폴더를 포함한 모든 폴더가 같은 클래스셋을 사용합니다.</p>
<label>검수 종류 <select id="kind" class="ui-field"><option value="object">객체</option><option value="pixel">픽셀</option></select></label>
<p>기존 클래스는 표시 이름과 색상만 수정할 수 있습니다. 기존 번호·정본 이름·역할·의미는 유지됩니다. 새 클래스는 사용하지 않은 번호로 추가합니다.</p>
<p>클래스 추가나 픽셀 색상 변경 후에는 다른 탭의 미저장 작업도 최신 클래스와 검수 버전을 다시 불러와야 합니다. 제외·검수 대기 상태는 유지됩니다.</p>
<form id="form"><div id="rows"></div><button id="add" type="button">클래스 추가</button><p id="impact" role="status"></p>
<label><input id="confirm" type="checkbox">이 작업공간 전체의 변경 범위와 재검수 대상을 확인했습니다.</label><p><button id="apply" type="submit" disabled>클래스 개정 적용</button> <button id="reload" type="button">다시 불러오기</button></p></form>
<p id="result" role="status"></p><p id="error" role="alert"></p></main></body></html>
