# SIM cell model inventory: what the simulated cell is built from and how it differs from the real cell.
# Learning → SIM 실험 shows this file read-only; change it by commit (this file is the one source).
# Real-cell photos stay out of Git (public repository): register the file name here and put the file in
# cell-photos/ beside the private SIM operator configuration on the review host.
# Physics constants (servo gains, joint damping, container mass and friction) are candidates in cell_physics.yaml beside this file.
schema: rosy.cell-model-inventory/1
checked_at: '2026-11-03'
models:
  - id: gripper
    name: 그리퍼(OMX 팔레타이징 조 v2.1)
    cad: {file: omx_f_palletizing_description.zip, sha256: 672cd4813c439b826fd6f9b005d1e5fec5b74bea0a1a9c670e099335f6e47583}
    sim: none
    measured: 손가락 판 두께 약 1.1~2.0 mm, 길이 약 18 mm, 폭 40 mm, 패드 사이 29.977 mm @ 0.35 rad, TCP x 0.0740 m(원본 0.09193). 출처 URDF 메시 직접 측정
    differs: 양팔 시뮬레이션(omx_two_arm_world)은 v2.1 조, TCP 0.0740을 쓴다(2026-11-09 확인). 설치된 조가 이 STL과 같은지와 터치값 0.0885는 미해명(sim2real G-22)
  - id: ship_plate
    name: 배 모양 판(본선)
    cad: {file: null, sha256: null}
    sim: reflected
    measured: 팀 CAD(KAN-108, ship_plate.py). 실물 top 영상의 돌기 격자 36 mm 6×6과 fixture가 약 1 px로 겹친다(셀 실측 2026-11-03)
    differs: 시뮬레이션은 선미를 첫 돌기 줄 뒤 16 mm, 뱃머리를 x 198 mm에서 자른다(실물은 50.6 mm 뒤·뾰족한 뱃머리)
  - id: temp_plate
    name: 임시 칸 판(두 장)
    cad: {file: null, sha256: null}
    sim: reflected
    measured: 위 카메라 프레임에서 칸 패드·놓인 컨테이너를 판 윗면으로 되투영해 판마다 부채꼴 하나로 맞춤(omx_real2sim measure). 스냅샷 deploy/robot/omx/sim/cell_snapshots/. 2026-11-08 판 모양 단계 13.6°, 반지름 217 mm, 팔 축에서 약 146 mm
    differs: 설계(SCAD v11, 다리 v7에서 200 mm)와 모양·자리가 다르다. 판은 고정돼 있지 않아 옮길 때마다 다시 잰다. 시뮬은 스냅샷을 선택지 temp_lanes=snapshot으로 읽는다(sim2real G-17)
  - id: workbench
    name: 작업대
    cad: {file: 261026_World.STL, sha256: dd91457a4a8d17d7fbb4fbfdb12dff9c2ae98e92e74760231c9ec08aa377f3cc}
    sim: reflected
    measured: World STL에서 읽음
    differs: null
  - id: belt
    name: 벨트
    cad: {file: 261026_World.STL, sha256: dd91457a4a8d17d7fbb4fbfdb12dff9c2ae98e92e74760231c9ec08aa377f3cc}
    sim: reflected
    measured: 폭 약 100 mm(World STL). 벨트 끝 컨테이너 윗면이 작업대보다 25.8 mm 낮다(D435 깊이 6회 중앙값, arm_b 적층 설정 2026-11-03 05:32), 곧 벨트 면은 작업대 약 56 mm·판 윗면 약 64 mm 아래
    differs: 양팔 시뮬레이션은 자 측정값(작업대 아래 55 mm, CHOICES belt_height=ruler)을 쓴다(2026-11-09 확인). fixture의 벨트 면(실물보다 약 28 mm 높음)은 선택지 fixture로 남음
  - id: arm_base
    name: 팔 베이스(두 대)
    cad: {file: 261026_World.STL, sha256: dd91457a4a8d17d7fbb4fbfdb12dff9c2ae98e92e74760231c9ec08aa377f3cc}
    sim: reflected
    measured: 두 베이스 중심 사이 약 330 mm(World STL). 셀 실측 2026-11-03(surveyed) arm_b 관절 1 기준 (0.104, 0.153) m, yaw -94.3°(FK 맞춤 3.1 px), 받침 판 중심 arm_b (0.107, 0.164)·arm_a (0.116, -0.164)
    differs: 실물 받침이 fixture (0.08, ±0.165)보다 선미 쪽(+x)으로 24~36 mm, arm_b는 중심선 쪽으로 12 mm. fixture는 CAD 값 유지, 채택은 도달·충돌 비교 뒤(D-947 2)
  - id: container
    name: 컨테이너
    cad: {file: null, sha256: null}
    sim: reflected
    measured: 90×30×30 mm. 무게 1칸 7.2 g, 2칸 11.79 g, 3칸 16 g(사용자 측정 2026-11-01). 사람이 놓은 기준 배치 3열 2층, 틈 약 4~5 / 2~3 mm(옆 카메라 추정)
    differs: 시뮬레이션은 3칸 무게 16 g을 쓴다(omx_cell_sim, omx_two_arm_world, 2026-11-09 확인). 마찰은 손으로 정한 값 하나(sim2real G-25)
  - id: camera_ceiling
    name: 천장 카메라(Rosy Cam, Fleet ceiling_north)
    cad: {file: null, sha256: null}
    sim: stand_in
    measured: null
    differs: 가끔 프레임이 멈춘다(frame stale)
  - id: camera_top
    name: 위쪽 카메라(RealSense D435)
    cad: {file: null, sha256: null}
    sim: stand_in
    measured: 2026-11-03 640×480 컬러. 자세(fixture 좌표) (-0.041, 0.037, 0.662) m, 판 위 588 mm, 선미 쪽으로 13.1° 기움, f 615 px(D435 일반값) 돌기 25개 PnP 0.58 px
    differs: 양팔 시뮬레이션은 이 자세로 top 카메라를 둔다(omx_two_arm_world, 2026-11-09 확인). 측량 사이에는 임시판 칸 크기로만 확인한다(sim2real G-19)
  - id: camera_side
    name: 옆 카메라(Jieli)
    cad: {file: null, sha256: null}
    sim: stand_in
    measured: 640×480. 자세 (-0.51, 0.00, 0.15) m, 뱃머리 앞에서 수평으로 +x를 본다, f 약 950~1050 px(돌기 21개 PnP 2.8 px, 거리 ±5 cm)
    differs: mapped-side는 반대편(선미 쪽 x 0.8)에서 본다. 실물과 같은 시점이 없다
  - id: camera_wrist
    name: 손목 카메라 둘(Innomaker)
    cad: {file: null, sha256: null}
    sim: none
    measured: front가 Innomaker 1.3
    differs: arm_a 손목 서비스는 404
# Measured cell layout: the numbers tools read (ship_stack_sites, real-cell site planning). The map may change a little;
# re-measure and bump `revision`, keep the old one in git. Heights: work table top = 0, mm. Positions: fixture frame, m.
layout:
  revision: ship-cell-2026-11-03
  heights_mm:
    arm_b_base_plate: {value: 12, source: ruler, measured: '2026-11-03'}
    ship_plate_top: {value: 8, source: ruler, measured: '2026-11-03'}
    stud_top: {value: 11, source: ruler, measured: '2026-11-03'}
    leveling_spot_table: {value: 0, source: assumed, note: 'table top; the 170 entered was the plate-centre-to-bow distance'}
    belt_end_surface: {value: -55, source: ruler, measured: '2026-11-03', check: 'D435 depth put it about -56'}
    container: {value: 30, source: ruler, measured: '2026-11-03'}
  plate_centre_to_bow_mm: {value: [170, 220], source: user estimate, note: 'bow narrows to a point over this stretch; CAD 198-244'}
  arm_bases_m:
    arm_a: {xy: [0.116, -0.164], yaw_deg: 90.0, source: 'top frame, base plate centre (no FK)'}
    arm_b: {xy: [0.104, 0.153], yaw_deg: -94.3, source: 'FK of live joint states, 3.1 px'}
  cameras:
    top: {eye: [-0.0411, 0.0374, 0.6652], focus: [0.0722, 0.0401, 0.1783], up: [0.974, 0.0071, 0.2266], f_px: 615, residual_px: 0.58}
    side: {eye: [-0.5078, 0.0019, 0.1471], focus: [-0.0082, -0.0166, 0.1445], up: [0.0061, 0.0257, 0.9997], f_px: 950, residual_px: 2.8}
