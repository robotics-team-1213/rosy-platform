# D-204 — CORE base screens; each panel declares one job, role, and asset.
version: 1
surfaces:
  console: {title: 운용, min_role: viewer, grammar: spatial, slots: [banner, sense, observe, act]}
  setup: {title: 작업 준비, min_role: operator, grammar: procedure, slots: [main]}
  device: {title: 설치·정비, min_role: administrator, grammar: procedure, slots: [main]}
panels:
  - id: console.overview
    title: 로봇 상태
    surface: console
    slot: sense
    order: 10
    module: panels/console/overview.js
    css: [panels/surface-panels.css]
  - id: setup.waypoints
    title: 웨이포인트 준비
    surface: setup
    slot: main
    order: 10
    min_role: operator
    module: panels/setup/waypoints.js
    css: [panels/surface-panels.css]
  - id: system.events
    title: 최근 이벤트
    surface: device
    slot: main
    order: 90
    module: panels/system/events.js
    css: [panels/system/events.css]
  - id: host.hardware
    title: 보드 장치 상태
    surface: device
    slot: main
    order: 80
    min_role: administrator
    module: panels/host/hardware.js
    css: [panels/host/hardware.css]
  - id: system.diagnostics
    title: 진단 상태
    surface: device
    slot: main
    order: 100
    module: panels/system/diagnostics.js
    css: [panels/surface-panels.css]
