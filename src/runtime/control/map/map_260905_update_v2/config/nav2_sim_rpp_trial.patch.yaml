# OPTIONAL SIMULATION TRIAL. NOT AN APPROVED ROBOT CONFIGURATION.
# Apply only after reviewing stopping distance and collision lookahead horizon.
# Jazzy parameter name: desired_linear_vel, NOT the newer max_linear_vel.
# Velocity caps preserve any lower existing limits.
# Collision detection, prediction time, inflation and watchdogs are not disabled.
# cost_scaling_dist is derived as min(existing, actual local inflation_radius).
# inflation_cost_scaling_factor is synchronized to actual local cost_scaling_factor.
controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.10
      use_velocity_scaled_lookahead_dist: true
      lookahead_dist: 0.20
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.30
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.40
      min_approach_linear_velocity: 0.03
      regulated_linear_scaling_min_speed: 0.03
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_gain: 1.0
velocity_smoother:
  ros__parameters:
    max_velocity: [0.10, 0.0, 0.50]
    min_velocity: [-0.10, 0.0, -0.50]
