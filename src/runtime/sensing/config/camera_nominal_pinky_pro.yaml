# D-353 §3: NOMINAL camera geometry for the Pinky Pro OV5647 front camera.
# Estimated from 4981 real teleop frames (2026-09-19 track, 320x240, 8 fps):
# fx from 54 crosswalk frames (RMS 1.08 px), horizon row from 1707 lane
# vanishing points (median 80.3, robust sd 2.6 px), height from crosswalk
# pitch / wall height / lane spacing (63.7-69.4 mm). Principal point assumed
# centred. This is NOT a validated homography profile: line_observer_node
# uses it only with camera_ground_source NOMINAL + allow_nominal_ground, and
# CORE accepts NOMINAL-ground lane evidence only under a driver hold (D-349).
# One tape-measure reading of the lens height should replace height_m.
width: 320
height: 240
fx: 281.6
cx: 160.0
cy: 120.0
pitch_rad: 0.1396          # 8.0 deg down; horizon row = cy - fx*tan(pitch) = 80.3
height_m: 0.067
x_offset_m: 0.034          # lens ahead of base_link (sim URDF prior, not measured)
max_range_m: 0.6
