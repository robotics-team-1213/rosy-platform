# Pinky Pro CORE config layer (D-196 robot package). core_common.config.load_config
# merges this file over rosy_default.yaml and under the robot's local overlay
# (~/.rosy/rosy.yaml or ROSY_CONFIG) whenever robot.model / ROSY_ROBOT is pinky_pro,
# so every Pinky Pro CORE gets it from the payload, not from a hand-edited overlay.
# Only robot facts belong here; operator tuning stays in the overlay.

line_follow:
  # D-344 §11 (numbered D-349 in the 2026-09-29 pilot log) front obstacle stop
  # (+-20 deg, stop 0.20 m, resume 0.28 m): the sector is centred on this scan
  # angle. rplidar_link is yaw pi on base_link (URDF), so scan 0 is the robot's
  # rear and forward is 180. URDF nominal (D-397: geometry.yaml lidar.forward_deg,
  # drift-tested): an operator-accepted lidar_mount record in the calibration
  # store (D-47 addendum 2026-10-01, src/runtime/gateway/core/lidar_mount.py)
  # refines it at CORE start once accepted (motion and camera measure ~181-182
  # deg); a line_follow.lidar_forward_deg in the operator's local overlay wins
  # over both. The plausibility window (150-210 deg, or +-15 deg of this value)
  # is centred on 180.
  lidar_forward_deg: 180.0

safety:
  # SAF-002 teleop watchdog (default 500 ms). D-311 G4 requires a command-loss stop
  # within 0.65 s; Pinky Pro needs ~0.1-0.2 s after the watchdog fires to bring the
  # wheels to rest, so 500 ms measured 0.61-0.72 s on 9dfk (2026-10-01). 300 ms keeps
  # two missed 10 Hz commands of slack and lands the stop near 0.45 s.
  teleop_timeout_ms: 300
