# ROS-native Pinky Pro adapter parameters.
# Launch arguments may override these values for a measured commissioning
# profile. The adapter validates them before the Dynamixel SDK opens the UART.
bringup:
  ros__parameters:
    # URDF nominal (D-396 geometry.yaml), refined per robot by an accepted wheel_odometry calibration record (D-47 addendum store).
    wheel_radius: 0.028
    wheel_separation: 0.0971
    cmd_vel_timeout_s: 0.5
    frame_prefix: ""
    motor_device: /dev/ttyAMA4
    motor_baudrate: 1000000
    motor_ids: [1, 2]
    max_linear_mps: 0.20
    max_angular_rps: 0.80
    max_wheel_rpm: 100.0
    motor_profile_acceleration: 200
