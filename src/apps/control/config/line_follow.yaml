/**/ir_adc_node:
  ros__parameters:
    interface: /dev/i2c-1
    address: 8
    rate_hz: 20.0

/**/line_observer_node:
  ros__parameters:
    # Fail closed until each robot's black/white surfaces have been measured.
    ir_calibration_enabled: false
    ir_black: [0.0, 0.0, 0.0]
    ir_white: [0.0, 0.0, 0.0]
    ir_min_span: 100.0
    ir_min_white: 0.55
    ir_min_contrast: 0.15

    # White-line segmentation in the lower camera band.
    camera_bright_threshold: 180
    camera_roi_top_fraction: 0.40
    camera_washed_fraction: 0.40
    camera_min_pixels: 80
    require_camera_controls_stable: true
    # 'line' = single bright line (centroid); 'lane' = centre between two
    # boundary lines, which needs a metric ground plane and fails closed
    # without one.
    camera_lane_mode: line
    lane_half_width_m: 0.0925
    camera_roi_bottom_fraction: 1.0
    camera_ground_source: PINKY
    allow_simulation_ground: false
    # Gazebo-only declared projection. Zero geometry keeps it fail-closed in
    # every physical/default launch; the lane simulation overrides it.
    gazebo_camera_height_m: 0.0
    gazebo_camera_pitch_rad: 0.0
    gazebo_camera_hfov_rad: 0.0
    gazebo_camera_max_range_m: 0.6
    # Lane mode corner turning needs odometry and is off unless a launch
    # opts in with the camera's measured offset ahead of base_link.
    lane_corner_turning: false
    camera_x_offset_m: 0.0

/**/road_observer_node:
  ros__parameters:
    map_id: map_260905_update_v2
    scene_revision: road-scene-v1
    width: 320
    height: 240
    rotate_deg: 180
    camera_profile_revision: camera-profile-v1
    camera_ground_mode: homography
    allow_simulation_ground: false
    bright_threshold: 180
    lane_roi_top_fraction: 0.30
    horizontal_min_fraction: 0.40
    horizontal_padding_px: 2
    crosswalk_min_bars: 3
    crosswalk_max_gap_px: 20
    signal_roi_bottom_fraction: 0.35
    signal_min_pixels: 50
    # Scene contexts tune perception parameters only (D-162). Off until a
    # launch opts in; profile values stay neutral until DEVICE evidence.
    scene_context_enabled: false
    scene_context_enter_frames: 3
    scene_context_exit_frames: 8
    scene_context_min_confidence: 0.5
    # Observation-only dashboard preview. This never feeds the detector or
    # command path and is capped to protect DDS/API bandwidth.
    dashboard_preview_fps: 2.0
    dashboard_preview_max_width: 640
    dashboard_preview_jpeg_quality: 72
    dashboard_preview_max_bytes: 512000
    dashboard_source: PINKY
    require_camera_controls_stable: true
    # Metric range remains unavailable until an independently validated
    # profile is explicitly enabled for the current session.
    camera_homography_path: ''
    camera_homography_enabled: false
    camera_homography_allow_uniform_resize: false
    camera_homography_max_fit_rmse_cm: 0.8
    camera_homography_max_validation_rmse_cm: 1.0
    camera_homography_max_validation_error_cm: 2.0
    camera_homography_min_validation_points: 8
    camera_homography_min_validation_frames: 2
    camera_homography_min_validation_span_cm: 10.0
    camera_homography_max_range_m: 0.6
    # Gazebo-only declared projection. Zero geometry keeps it fail-closed in
    # every physical/default launch; the semantic simulation overrides it.
    gazebo_camera_height_m: 0.0
    gazebo_camera_pitch_rad: 0.0
    gazebo_camera_hfov_rad: 0.0
    gazebo_camera_max_range_m: 0.6
