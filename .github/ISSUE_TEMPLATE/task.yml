name: 작업 제안과 담당 범위
description: 기능·문서·개선 작업의 담당 경로와 완료 조건을 정합니다.
body:
  - type: markdown
    attributes:
      value: |
        기존 이슈와 PR에 같은 작업이 있는지 먼저 확인해 주세요.
        공개 이슈입니다. 실제 장치 주소·계정·토큰·비공개 자료를 적지 마세요.
  - type: input
    id: jira
    attributes:
      label: Jira 이슈 키
      description: 같은 작업의 Jira 이슈가 있으면 키만 적습니다(예 KAN-27). 사이트 주소는 적지 않습니다. 없으면 비워 둡니다.
      placeholder: KAN-27
  - type: textarea
    id: outcome
    attributes:
      label: 문제와 원하는 결과
      description: 누가 어떤 상황에서 무엇을 할 수 있어야 하나요?
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: 담당자와 수정 경로
      description: 담당 GitHub 아이디, 수정할 경로, 함께 고치는 작업을 적어 주세요. 미정이면 미정이라고 적습니다.
      placeholder: |
        담당: @아이디
        수정 경로:
        겹치는 이슈 / 선행 PR: 없음
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건과 검증 방법
      description: 끝났다고 판단할 동작·문서 결과와 확인 방법을 적어 주세요.
      placeholder: |
        - [ ] 기대 결과:
        - [ ] 확인할 시험 또는 문서 검토:
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 관련 계약과 참고 자료
      description: 관련 ADR·SRS·API reference·이슈·PR 링크. 없으면 비워 둡니다.
