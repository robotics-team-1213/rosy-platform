name: 버그 보고
description: 재현 순서와 실행 버전을 남겨 문제를 함께 확인합니다.
body:
  - type: markdown
    attributes:
      value: |
        같은 문제가 이미 보고되었는지 먼저 확인해 주세요.
        공개 이슈입니다. 로그·화면의 실제 주소·계정·토큰을 지워 주세요.
        재현을 위해 실물 로봇을 움직여야 한다면 먼저 장비 사용 승인을 받습니다.
  - type: input
    id: revision
    attributes:
      label: 실행 버전
      description: git rev-parse HEAD 결과 또는 설치된 release id. 알 수 없으면 미확인이라고 적습니다.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경과 영향 범위
      description: OS·Python·ROS 버전, 개인 PC / CI / 시뮬 / 장치 중 실행 위치, 영향을 받은 기능.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 순서
      description: 필요한 설정과 순서를 적어 주세요. 아직 재현되지 않으면 관측 상황과 빈도를 적습니다.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 기대 결과와 실제 결과
      placeholder: |
        기대:
        실제:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 로그와 근거
      description: 비공개 값을 지운 로그·스크린샷·실패한 CI 링크. 관련 이슈와 우회 방법도 적을 수 있습니다.
