name: Publish verified ROSY release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Existing draft release tag (YYYY.MM.DD-NNN)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rosy-release-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      KEY_ID: ${{ vars.ROSY_RELEASE_KEY_ID }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate operator inputs
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{3}', os.environ['RELEASE_ID'])
          assert re.fullmatch(r'[a-z0-9][a-z0-9-]{2,63}', os.environ['KEY_ID'])
          PY
          test -f "deploy/robot/pinky_pro/release/public-keys/$KEY_ID.pem"
          sudo apt-get update -qq
          sudo apt-get install -y openssl zstd
      - name: Download externally signed draft asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_ID" --json isDraft --jq .isDraft)" = true
          gh release download "$RELEASE_ID" --pattern "rosy-release-$RELEASE_ID.tar.zst" --dir received
      - name: Verify signature, payload and tag revision
        run: |
          python3 deploy/robot/pinky_pro/release/publication.py verify-publication \
            "received/rosy-release-$RELEASE_ID.tar.zst" \
            --release-id "$RELEASE_ID" \
            --git-revision "$(git rev-parse --verify "refs/tags/$RELEASE_ID^{commit}")" \
            --public-key "deploy/robot/pinky_pro/release/public-keys/$KEY_ID.pem"
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_ID" --draft=false --latest
