name: ubuntu-26.04 rehearsal

# D-134: ubuntu-latest 는 2026-10-19 ~ 11-19 에 26.04 로 이동한다. 게이팅 잡은
# 24.04 로 고정하고, 이 리허설이 매주 같은 절차를 26.04 에서 먼저 통과시킨다 —
# 녹색이 연속되면 게이팅 러너를 26.04 로 전환한다. 적색은 이주 전에 발견하는
# 것이 목적이므로 리허설은 게이팅이 아니다 (continue-on-error).

# D-135 로 게이팅 러너가 이미 26.04 라서 주간 예약은 ci.yml 주간 FULL 과 같은 일을 했다
# (2026-11-08 예약 제거). 다음 러너 이주 리허설이 필요하면 runs_on 을 바꿔 수동 실행한다.
on:
  workflow_dispatch:

jobs:
  rehearsal:
    # 별도 워크플로이므로 적색이어도 push/merge 를 막지 않는다 — 리허설의 적색은
    # 24.04 의존 제거 목록이다.
    uses: ./.github/workflows/ci.yml
    with:
      runs_on: ubuntu-26.04
