name: Build CI image
run-name: CI image ${{ github.sha }}

# User 11-20 (GitHub landing migration): the apt and pip installs every ci.yml job repeated (~70 s each, and the
# 11-19 archive.ubuntu.com outage) are baked once. Follows build-payload-builder.yml: the job token pushes to GHCR,
# the digest is printed, and ci.yml pins that digest. After a build, put the printed digest into ci.yml (both
# `image:` lines); test/test_ci_image.py refuses a tag or a missing digest.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/ci-image/**
      - deploy/robot/pinky_pro/image/device-python-requirements.txt
      - deploy/robot/pinky_pro/image/receiver-crypto-requirements.txt
      - deploy/robot/omx/requirements-cell.lock
      - deploy/site/requirements-vision.txt
      - learning/curation/pinky/requirements-raw.txt
      - .github/workflows/build-ci-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: rosy-ci-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ci-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (pinned commit)
        with:
          persist-credentials: false

      - name: Build and push image (OCI zstd)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/rosy-ci:${GITHUB_SHA}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --name rosy-ci-zstd --driver docker-container --use
          docker buildx build -f .github/ci-image/Dockerfile \
            --cache-from "type=registry,ref=ghcr.io/${owner}/rosy-ci:buildcache" \
            --cache-to "type=registry,ref=ghcr.io/${owner}/rosy-ci:buildcache,mode=max,oci-mediatypes=true,compression=zstd" \
            --output "type=registry,name=${image},oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true" \
            --metadata-file /tmp/build-meta.json .
          digest="$(python3 -c 'import json; print(json.load(open("/tmp/build-meta.json"))["containerimage.digest"])')"
          echo "ci image: ghcr.io/${owner}/rosy-ci@${digest}" | tee -a "$GITHUB_STEP_SUMMARY"
