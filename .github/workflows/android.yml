name: android

# Rosy Cam ceiling camera phone app (operations/ui/cam, D-377). JVM unit tests only;
# no emulator, no signing. Runs when the app tree changes, or the shared
# inputs its tests read: discovery TXT vectors and the D-370 icon SVGs.
on:
  push:
    branches: [main]
    paths:
      - "operations/ui/cam/**"
      - ".github/workflows/android.yml"
      - "test/fixtures/protocol/**"
      - "shared/web/icons/**"
  pull_request:
    paths:
      - "operations/ui/cam/**"
      - ".github/workflows/android.yml"
      - "test/fixtures/protocol/**"
      - "shared/web/icons/**"

jobs:
  android-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operations/ui/cam
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # gradlew is committed without the executable bit.
      - name: Unit tests
        run: bash ./gradlew testDebugUnitTest --no-daemon
