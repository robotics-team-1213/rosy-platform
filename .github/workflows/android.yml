name: android

# Overhead camera phone app (src/site/overhead/android). JVM unit tests only;
# no emulator, no signing. Runs only when the overhead tree changes.
on:
  push:
    branches: [main]
    paths:
      - "src/site/overhead/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "src/site/overhead/**"
      - ".github/workflows/android.yml"

jobs:
  android-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/site/overhead/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # gradlew is committed without the executable bit.
      - name: Unit tests
        run: bash ./gradlew testDebugUnitTest --no-daemon
