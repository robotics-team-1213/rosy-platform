name: Refresh Generated Docs

# D-1061 records bot: on every main push (and twice a day) number API fragments, fold log shards,
# add missing ADR Log rows and regenerate index/STATUS in ONE PR from a bot/records-* branch.
# One run at a time (concurrency group), so numbers never collide.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rosy-refresh-generated-docs
  cancel-in-progress: false

jobs:
  consolidate:
    name: Consolidate record shards and regenerate index/status
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # D-1061: a GitHub App installation token or fine-grained token (contents, pull requests: write).
      # PRs opened with it run every pull_request workflow (ci-result, review-gate). GITHUB_TOKEN PRs
      # start none, so without a token the bot only reports what is pending and pushes nothing.
      # The rosy-records-bot App (variable RECORDS_BOT_CLIENT_ID, secret RECORDS_BOT_PRIVATE_KEY) mints a
      # one-hour token for this repository only; a static RECORDS_BOT_TOKEN secret still works as a fallback.
      RECORDS_BOT_TOKEN: ${{ secrets.RECORDS_BOT_TOKEN }}
    steps:
      - name: Mint records bot App token
        id: app
        if: vars.RECORDS_BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0 (pinned commit)
        with:
          client-id: ${{ vars.RECORDS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RECORDS_BOT_PRIVATE_KEY }}

      - name: Use the App token
        if: steps.app.outputs.token != ''
        run: echo "RECORDS_BOT_TOKEN=${{ steps.app.outputs.token }}" >> "$GITHUB_ENV"

      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (pinned commit)
        with:
          fetch-depth: 0
          token: ${{ env.RECORDS_BOT_TOKEN || github.token }}

      - name: Consolidate shard logs and regenerate index/STATUS
        run: |
          python3 -c "import yaml" 2>/dev/null || pip3 install --break-system-packages --quiet pyyaml
          python3 tools/new_record.py consolidate

      - name: Report pending records (no RECORDS_BOT_TOKEN)
        if: env.RECORDS_BOT_TOKEN == ''
        run: |
          {
            echo "## Records bot: check mode (secret RECORDS_BOT_TOKEN not set, nothing pushed)"
            echo
            if [ -z "$(git status --porcelain)" ]; then echo "Nothing pending."; else
              echo "Pending changes a manual records PR would carry (docs/reference/api-changes/README.md):"
              echo; echo '```'; git status --short; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update consolidation PR
        if: env.RECORDS_BOT_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.RECORDS_BOT_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No shard consolidation or generated record changes."
            exit 0
          fi
          pr="$(gh pr list --head bot/records-refresh --state open --json number --jq '.[0].number')"
          if [ "$EVENT_NAME" = "push" ] && [ -n "$pr" ]; then
            in_queue="$(gh pr view "$pr" --json isInMergeQueue --jq '.isInMergeQueue // false' 2>/dev/null || echo false)"
            active="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=bot/records-refresh&per_page=10" --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting")] | length' 2>/dev/null || echo 0)"
            if [ "$in_queue" = "true" ] || [ "${active:-0}" -gt 0 ]; then
              echo "Skipping push-triggered refresh: PR #$pr is in merge queue ($in_queue) or has $active active CI run(s)."
              exit 0
            fi
          fi
          git config user.name "rosy-records-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c bot/records-refresh
          git add -A
          git commit -m "chore(records): number API fragments, fold log shards, refresh generated docs (D-1061)"
          git push -f origin bot/records-refresh
          head="$(git rev-parse HEAD)"
          body="Records bot (D-1061): numbered API fragments into the reference header, sections, history and CONTRACT; folded log shards; added ADR Log rows; refreshed index/STATUS."$'\n\n'"Overlap-Review: self (scheduled generated records consolidation)"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body "$body"
          else
            gh pr create --base main --head bot/records-refresh \
              --title "chore(records): number API fragments and refresh generated records (D-1061)" \
              --body "$body"
            pr="$(gh pr list --head bot/records-refresh --state open --json number --jq '.[0].number')"
          fi
          # the token is not GITHUB_TOKEN, so pull_request CI and review-gate run; queue as tools/pr_land.py does
          gh pr merge "$pr" --auto --merge --match-head-commit "$head"

      # Strict: stale index.md or an ADR without its Log row is an error here (warnings on PR and queue runs).
      - name: Lint the consolidated records (strict)
        env:
          ROSY_RECORDS_STRICT: "1"
        run: python3 tools/harness/rosy_harness.py lint
