name: Build unsigned site candidate

# D-437: the site candidate (Fleet, Vision, proxy; linux/amd64) is built on a
# GitHub-hosted runner and published as an UNSIGNED prerelease. The operator
# signs release.json on the offline signing station (sign_candidate.py
# --manifest-only, D-301) and attaches release.json.sig. No secret except
# GITHUB_TOKEN is used; signing keys never reach GitHub.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, branch or tag to build (empty = the dispatched commit)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: rosy-site-candidate-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  build-unsigned-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
    env:
      SYFT_VERSION: 1.52.0
      SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
      CANDIDATE_ROOT: /mnt/rosy-site-candidate
      UPLOAD_DIR: /mnt/rosy-site-upload
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify clean amd64 source and record commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(docker info --format '{{.Architecture}}')" = x86_64
          test -z "$(git status --porcelain --untracked-files=all)"
          commit="$(git rev-parse HEAD)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          echo "tag=site-${commit:0:12}" >>"$GITHUB_OUTPUT"

      - name: Free runner disk and prepare work directories
        shell: bash
        run: |
          set -euo pipefail
          # Ephemeral runner: drop preinstalled toolchains the build never uses.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p "$CANDIDATE_ROOT" "$UPLOAD_DIR"
          sudo chown "$(id -u):$(id -g)" "$CANDIDATE_ROOT" "$UPLOAD_DIR"
          df -h / /mnt

      - name: Check Docker Buildx keeps images in the local store
        shell: bash
        run: |
          set -euo pipefail
          # build_candidate.py runs `docker build`, then inspects and saves the
          # local image. The runner's default buildx builder uses the docker
          # driver, so built images land in the local store without --load.
          docker buildx version
          docker buildx inspect | grep -Eq '^Driver:[[:space:]]+docker$'

      - name: Install pinned syft
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/syft.tar.gz"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output "$archive" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$SYFT_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" syft
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/bin/syft" version

      - name: Build unsigned candidate
        shell: bash
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          python3 deploy/site/build_candidate.py \
            --output-dir "$CANDIDATE_ROOT/$COMMIT" \
            --sbom-tool syft
          test ! -e "$CANDIDATE_ROOT/$COMMIT/release.json.sig"

      - name: Package candidate into release-sized parts
        shell: bash
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          # The images are already in images.tar; free their layers first.
          docker system prune --all --force
          cp "$CANDIDATE_ROOT/$COMMIT/release.json" "$UPLOAD_DIR/release.json"
          # GitHub release assets are limited to 2 GiB per file, so the tar is
          # always split (part00, part01, ...). The site host reassembles the
          # parts, and verify_candidate.py still checks images.tar's hash.
          tar -cf - -C "$CANDIDATE_ROOT" "$COMMIT" \
            | split --bytes=1900M --numeric-suffixes=0 --suffix-length=2 - \
              "$UPLOAD_DIR/rosy-site-candidate-$COMMIT.tar.part"
          rm -rf "${CANDIDATE_ROOT:?}/$COMMIT"
          (
            cd "$UPLOAD_DIR"
            sha256sum release.json rosy-site-candidate-"$COMMIT".tar.part* >SHA256SUMS
            cat SHA256SUMS
          )

      - name: Upload unsigned candidate for the release job
        uses: actions/upload-artifact@v4
        with:
          name: rosy-site-candidate-unsigned-${{ steps.source.outputs.commit }}
          path: /mnt/rosy-site-upload/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-unsigned-prerelease:
    needs: build-unsigned-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      COMMIT: ${{ needs.build-unsigned-candidate.outputs.commit }}
      TAG: ${{ needs.build-unsigned-candidate.outputs.tag }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rosy-site-candidate-unsigned-${{ needs.build-unsigned-candidate.outputs.commit }}
          path: candidate-assets

      - name: Re-check asset checksums
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TAG" == "site-${COMMIT:0:12}" ]]
          cd candidate-assets
          sha256sum --check --strict SHA256SUMS
          test ! -e release.json.sig

      - name: Create unsigned prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="UNSIGNED until release.json.sig is attached.

          Site candidate (Fleet, Vision, proxy; linux/amd64) built from commit ${COMMIT} by ${RUN_URL}.
          Sign release.json on the offline signing station with sign_candidate.py --manifest-only,
          upload release.json.sig to this release, then fetch and verify on the site host before
          docker image load (deploy/site/README.md, CI-built candidates (D-437))."
          gh release create "$TAG" \
            --prerelease \
            --target "$COMMIT" \
            --title "Site candidate ${TAG} (unsigned)" \
            --notes "$notes" \
            candidate-assets/*
