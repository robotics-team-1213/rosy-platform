name: Build Pinky Pro native payload
run-name: Pinky payload ${{ inputs.release_id }}

# D-225 Decision 2.1: payload-only build for updating an already-flashed robot
# without a card rewrite. Same native ROS/rosdep/lock/hardware-deps steps as
# build-pinky-image.yml, but no image: build-native-payload.sh builds install/,
# build_payload_release.py assembles the unsigned release. Signing stays
# offline (sign_image_release.py); this job never sees a private key.
# D-553 addendum 3: the job runs in the payload-builder image (pinned by
# digest), which already holds the ROS snapshot prerequisites and rosdep apt
# packages; build-native-payload.sh still runs rosdep against the same pins.

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Release ID (YYYY.MM.DD-NNN)
        required: true
        type: string
      builder_image:
        description: Payload builder image pinned by digest (build-payload-builder.yml)
        required: true
        type: string
        default: ghcr.io/robotics-team-1213/rosy-payload-builder@sha256:01aa35089dd1a392d41b04678f5dd0bbea569d727162d121ead9ad61097d6762

permissions:
  contents: read
  packages: read

concurrency:
  group: rosy-native-payload-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-unsigned-payload:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    container:
      image: ${{ inputs.builder_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      BUILDER_IMAGE: ${{ inputs.builder_image }}
      RELEASE_ID: ${{ inputs.release_id }}
      PAYLOAD_WORK: /tmp/rosy-payload-work
      DIST_ROOT: /tmp/rosy-payload-dist
      RESOLVED_LOCK: /tmp/rosy-inputs.resolved.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify native clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          [[ "$BUILDER_IMAGE" =~ ^ghcr\.io/robotics-team-1213/rosy-payload-builder@sha256:[0-9a-f]{64}$ ]]
          test -z "$(git status --porcelain)"
          [[ "$RELEASE_ID" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{3}$ ]]
          df -h /

      - name: Prepare the payload builder container
        shell: bash
        run: |
          set -euo pipefail
          # D-553 addendum 3: ROS prerequisites and rosdep apt packages come preinstalled
          # (build-payload-builder.yml, install-ros-build-prereqs.sh: same D-482 pins).
          echo "builder image: $BUILDER_IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"
          test -f /opt/ros/jazzy/setup.bash
          test -f /etc/apt/sources.list.d/ros2-snapshots.sources
          if grep -rqs 'packages\.ros\.org' /etc/apt/sources.list /etc/apt/sources.list.d/; then exit 1; fi
          # The job's HOME is /github/home; rosdep's cache was written for root at image build.
          if [[ "$HOME" != /root ]]; then mkdir -p "$HOME" && ln -sfn /root/.ros "$HOME/.ros"; fi
          # Lists were dropped from the image; anything rosdep or the hardware deps still
          # need comes from the same pinned sources.
          apt-get update -qq

      - name: Resolve and verify run-specific lock
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/robot/pinky_pro/image/resolve-build-lock.py \
            --input deploy/robot/pinky_pro/image/inputs.lock.yaml \
            --output "$RESOLVED_LOCK" \
            --revision "$GITHUB_SHA"
          deploy/robot/pinky_pro/image/verify-inputs.sh "$RESOLVED_LOCK"

      - name: Install checksum-pinned Pinky Pro hardware build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo deploy/robot/pinky_pro/image/install-pinky-hardware-deps.sh --lock "$RESOLVED_LOCK"

      - name: Build native payload tree
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo deploy/robot/pinky_pro/image/build-native-payload.sh \
              --workspace "$GITHUB_WORKSPACE" \
              --release-root "$PAYLOAD_WORK/root" \
              --source-revision "$GITHUB_SHA" \
              --release-id "$RELEASE_ID" \
              --lock "$RESOLVED_LOCK" \
            | tee /tmp/rosy-native-payload-build.log
          sudo chown -R "$(id -u):$(id -g)" "$PAYLOAD_WORK"
          df -h /

      - name: Assemble unsigned payload release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIST_ROOT"
          # D-553 addendum 3: the branch this commit was dispatched from, signed with
          # the payload (manifest + SHA256SUMS). Only main reaches the D-412 channel.
          [[ "$GITHUB_REF" =~ ^refs/heads/[A-Za-z0-9._/-]+$ ]]
          printf '%s\n' "${GITHUB_REF#refs/heads/}" > "$PAYLOAD_WORK/root/source-ref.txt"
          python3 deploy/robot/pinky_pro/release/build_payload_release.py build \
            --payload-root "$PAYLOAD_WORK/root" \
            --release-id "$RELEASE_ID" \
            --out "$DIST_ROOT/$RELEASE_ID"
          # Keeps the Linux exec bits the artifact zip drops; the offline
          # re-pack after signing reads them back with --modes-from.
          python3 deploy/robot/pinky_pro/release/build_payload_release.py pack \
            --release-dir "$DIST_ROOT/$RELEASE_ID" \
            --out "$DIST_ROOT/$RELEASE_ID.unsigned.tar.gz" \
            --allow-unsigned

      - name: Verify unsigned handoff shape
        shell: bash
        run: |
          set -euo pipefail
          release="$DIST_ROOT/$RELEASE_ID"
          test -f "$release/manifest.json"
          test -f "$release/SHA256SUMS"
          test ! -e "$release/SHA256SUMS.sig"
          test ! -e "$release/image-overlay"
          (cd "$release" && sha256sum --check --strict --quiet SHA256SUMS)
          test -f "$DIST_ROOT/$RELEASE_ID.unsigned.tar.gz"

      - name: Upload unsigned payload handoff
        uses: actions/upload-artifact@v4
        with:
          name: rosy-native-payload-unsigned-${{ inputs.release_id }}-${{ github.sha }}
          path: /tmp/rosy-payload-dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
