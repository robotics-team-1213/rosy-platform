name: Build OMX LeRobot client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build tools
        run: python -m pip install setuptools==80.9.0 wheel==0.45.1
      - name: Build client wheels
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/omx-client"
          mkdir -p "$stage"
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$stage" \
            contracts/skill middleware/skills/api middleware/skills/manipulation integrations/robots/omx
          echo "$GITHUB_SHA" > "$stage/source-sha.txt"
          cd "$stage"
          sha256sum *.whl source-sha.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rosy-omx-client-${{ github.sha }}
          path: ${{ runner.temp }}/omx-client/
          if-no-files-found: error
          retention-days: 14
