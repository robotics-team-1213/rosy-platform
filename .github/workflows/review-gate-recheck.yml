name: review-gate-recheck

# A PR's review-gate only runs on its own events. When main moves or another PR changes, overlap can
# appear for a PR that already passed, so re-run the latest review-gate of every other open PR.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-gate-recheck-${{ github.event.pull_request.number || 'push' }}
  cancel-in-progress: true

permissions:
  actions: write
  pull-requests: read

jobs:
  recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          IGNORE_USERS: ${{ vars.REVIEW_GATE_IGNORE || 'codex' }}
        run: |
          export LC_ALL=C
          is_ignored() {
            local u="$1" t="$2"
            [ -n "$u" ] || return 0
            [ "$t" = "Bot" ] && return 0
            case "$u" in *"[bot]") return 0 ;; esac
            [ -n "$IGNORE_USERS" ] || return 1
            printf '%s\n' "$IGNORE_USERS" | tr ', ' '\n' | sed '/^$/d' | grep -Fqx "$u"
          }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$PR_DRAFT" = "true" ] || is_ignored "$PR_AUTHOR" "$PR_AUTHOR_TYPE"; then
              echo "skip recheck for draft/bot/ignored PR #${CURRENT:-?} ($PR_AUTHOR)"
              exit 0
            fi
            trig_files=$(mktemp)
            other_files=$(mktemp)
            trap 'rm -f "$trig_files" "$other_files"' EXIT
            gh api --paginate "repos/$REPO/pulls/$CURRENT/files?per_page=100" --jq '.[].filename' | sort -u > "$trig_files"
            if [ ! -s "$trig_files" ]; then
              echo "PR #$CURRENT changes no files; skip recheck"
              exit 0
            fi
            while IFS=$'\t' read -r pr draft sha author author_type; do
              [ -n "$pr" ] || continue
              if [ "$pr" = "$CURRENT" ] || [ "$draft" = "true" ] || [ "$author" = "$PR_AUTHOR" ] || is_ignored "$author" "$author_type"; then
                continue
              fi
              if ! gh api --paginate "repos/$REPO/pulls/$pr/files?per_page=100" --jq '.[].filename' | sort -u > "$other_files"; then
                echo "#$pr: failed to fetch files; skip"
                continue
              fi
              if [ -z "$(comm -12 "$trig_files" "$other_files")" ]; then
                echo "#$pr: no file overlap with #$CURRENT"
                continue
              fi
              IFS=$'\t' read -r run status _ < <(gh api "repos/$REPO/actions/workflows/review-gate.yml/runs?head_sha=$sha&per_page=1" \
                --jq '(.workflow_runs[0] // {}) | "\(.id // "")\t\(.status // "")\t\(.conclusion // "")"') || true
              if [ -z "$run" ]; then echo "#$pr: no review-gate run (branch predates the gate)"; continue; fi
              if [ "$status" = "in_progress" ] || [ "$status" = "queued" ] || [ "$status" = "waiting" ]; then
                echo "#$pr: review-gate run $run is $status; skip"
                continue
              fi
              gh api -X POST "repos/$REPO/actions/runs/$run/rerun" >/dev/null 2>&1 \
                && echo "#$pr: re-ran review-gate run $run (overlap with #$CURRENT)" \
                || echo "#$pr: run $run not re-run (in progress?)"
            done < <(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
              --jq '.[] | "\(.number)\t\(.draft)\t\(.head.sha)\t\(.user.login)\t\(.user.type)"')
          else
            while IFS=$'\t' read -r pr draft sha; do
              [ -n "$pr" ] || continue
              if [ "$draft" = "true" ]; then
                continue
              fi
              IFS=$'\t' read -r run status conclusion < <(gh api "repos/$REPO/actions/workflows/review-gate.yml/runs?head_sha=$sha&per_page=1" \
                --jq '(.workflow_runs[0] // {}) | "\(.id // "")\t\(.status // "")\t\(.conclusion // "")"') || true
              if [ -z "$run" ]; then echo "#$pr: no review-gate run (branch predates the gate)"; continue; fi
              if [ "$status" != "completed" ] || [ "$conclusion" != "failure" ]; then
                echo "#$pr: review-gate run $run is $status/$conclusion; skip"
                continue
              fi
              gh api -X POST "repos/$REPO/actions/runs/$run/rerun" >/dev/null 2>&1 \
                && echo "#$pr: re-ran failed review-gate run $run after main push" \
                || echo "#$pr: run $run not re-run"
            done < <(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
              --jq '.[] | "\(.number)\t\(.draft)\t\(.head.sha)"')
          fi
