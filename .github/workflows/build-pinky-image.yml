name: Build Pinky Pro flashable image

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Release ID (YYYY.MM.DD-NNN)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rosy-pinky-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-unsigned-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      DIST_ROOT: /tmp/rosy-image-dist
      IMAGE_CACHE: /tmp/rosy-image-cache
      IMAGE_WORK: /tmp/rosy-image-work
      RESOLVED_LOCK: /tmp/rosy-inputs.resolved.yaml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (pinned commit)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify native clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test -z "$(git status --porcelain)"
          [[ "$RELEASE_ID" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{3}$ ]]
          df -h /

      - name: Install native image and ROS build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bmap-tools build-essential cloud-guest-utils cmake curl gpg python3-yaml xz-utils \
            fdisk dosfstools rsync e2fsprogs
          ros_source=/tmp/ros2-apt-source.deb
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output "$ros_source" \
            https://github.com/ros-infrastructure/ros-apt-source/releases/download/1.2.0/ros2-apt-source_1.2.0.noble_all.deb
          ros_apt_source_sha256='0804d9b13db770eb87019be414cd78378835228ad5fa801fc88758596dd8f7e5'
          printf '%s  %s\n' "$ros_apt_source_sha256" "$ros_source" \
            | sha256sum --check --strict
          sudo dpkg -i "$ros_source"
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-colcon-common-extensions python3-rosdep \
            python3-pip python3-setuptools python3-wheel \
            ros-jazzy-ros-base ros-dev-tools
          if [[ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]]; then
            sudo rosdep init
          fi
          sudo rosdep update --rosdistro jazzy

      - name: Resolve and verify run-specific lock
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/robot/pinky_pro/image/resolve-build-lock.py \
            --input deploy/robot/pinky_pro/image/inputs.lock.yaml \
            --output "$RESOLVED_LOCK" \
            --revision "$GITHUB_SHA"
          deploy/robot/pinky_pro/image/verify-inputs.sh "$RESOLVED_LOCK"

      - name: Install checksum-pinned Pinky Pro hardware build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo deploy/robot/pinky_pro/image/install-pinky-hardware-deps.sh --lock "$RESOLVED_LOCK"

      - name: Build unsigned flashable image
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo chown -R root:root -- "$GITHUB_WORKSPACE"
          sudo env \
            GITHUB_ACTIONS=true \
            ROSY_IMAGE_CACHE="$IMAGE_CACHE" \
            ROSY_IMAGE_WORK_ROOT="$IMAGE_WORK" \
            deploy/robot/pinky_pro/image/build-image.sh \
              --release-id "$RELEASE_ID" \
              --dist "$DIST_ROOT" \
              --workspace "$GITHUB_WORKSPACE" \
              --cache-dir "$IMAGE_CACHE" \
              --lock "$RESOLVED_LOCK" \
            | tee /tmp/pinky-image-build.log
          sudo chown -R "$USER:$USER" "$DIST_ROOT/$RELEASE_ID"
          df -h /

      - name: Verify unsigned handoff shape
        shell: bash
        run: |
          set -euo pipefail
          release="$DIST_ROOT/$RELEASE_ID"
          test -f "$release/rosy-os-pinky-pro-$RELEASE_ID-arm64.img.xz"
          test -f "$release/manifest.json"
          test -f "$release/SHA256SUMS"
          test -f "$release/rosy-os-pinky-pro-$RELEASE_ID-arm64.capacity.json"
          test -f "$release/os-bundle-inputs/inputs.json"
          test -f "$release/os-bundle-inputs/rootfs.ext4.xz"
          test -f "$release/os-bundle-inputs/boot.vfat.xz"
          test ! -e "$release/SHA256SUMS.sig"
          python3 - "$release" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          folder = Path(sys.argv[1])
          manifest = json.loads((folder / "manifest.json").read_text())
          assert manifest["schema_version"] == 2
          capacity = json.loads(next(folder.glob("*.capacity.json")).read_text())
          assert capacity["raw_size_bytes"] == manifest["layout"]["raw_size_bytes"]
          assert set(capacity["roots"]) == {"a", "b"}
          for root in capacity["roots"].values():
              assert root["available_bytes"] >= root["reserve_required_bytes"]
          inputs = json.loads((folder / "os-bundle-inputs/inputs.json").read_bytes())
          manifest_revision = json.loads((folder / "build-provenance.json").read_bytes())["source_revision"]
          assert inputs["source_revision"] == manifest_revision
          assert inputs["release_id"] == manifest["release_id"]
          assert inputs["layout"] == manifest["layout"]
          assert inputs["boot_abi"] == 2 and inputs["state_schema"] == {"read_min": 1, "read_max": 1, "write": 1}
          assert set(inputs["images"]) == {"rootfs.ext4", "boot.vfat"}
          factory = folder / "factory-release" / inputs["release_id"] / "SHA256SUMS"
          assert inputs["native_factory"] == {"release_id": inputs["release_id"],
              "checksums_sha256": hashlib.sha256(factory.read_bytes()).hexdigest()}
          PY
          xz --test "$release/rosy-os-pinky-pro-$RELEASE_ID-arm64.img.xz"
          xz --test "$release/os-bundle-inputs/rootfs.ext4.xz" "$release/os-bundle-inputs/boot.vfat.xz"
          (cd "$release" && sha256sum --check SHA256SUMS)

      - name: Upload unsigned image handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (pinned commit)
        with:
          name: rosy-pinky-image-unsigned-${{ inputs.release_id }}-${{ github.sha }}
          path: /tmp/rosy-image-dist/${{ inputs.release_id }}/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
