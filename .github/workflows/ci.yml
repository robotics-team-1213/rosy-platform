name: ci

on:
  push:
    branches: [main]
  pull_request:
  # D-762 stage 1: a merge queue group runs against its base.
  # The `concurrency:` block below cancels only stale `pull_request` runs on new push;
  # `merge_group`, `push`, `schedule`, `workflow_dispatch`, and `workflow_call` each key on `github.run_id`
  # with `cancel-in-progress: false` so a queue or main push run is never cancelled.
  merge_group:
  # D-436: PR 은 affected 티어, main push·주간·수동 실행은 풀 티어를 GitHub 러너에서
  # 병렬 matrix 로 돈다. 로컬 PC 는 affected 티어와 pre-push 패스트 게이트만 돈다.
  # 2026-11-08: 매일 밤 FULL 은 land.py FULL·land_nightly 가 이미 증명한 main 을 다시 돌아
  # 주 1회로 줄였다. 남은 몫은 러너·이미지 변화 감지다.
  schedule:
    - cron: "0 18 * * 0"   # 월 03:00 KST weekly full run
  workflow_dispatch:
  # ubuntu-26.04-rehearsal.yml 이 같은 절차를 다른 러너에서 재실행한다 (D-134).
  workflow_call:
    inputs:
      runs_on:
        type: string
        default: ubuntu-24.04

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # D-436: 시험 범위와 병렬 matrix 를 정한다. pull_request 는 변경 범위(affected) 티어 —
  # 선택기가 공용 기반·CI/시험 설정·미분류 파일 때문에 FULL 로 올리면 풀 matrix 다.
  # main push·merge_group·schedule·workflow_dispatch·workflow_call(PR 이 아닌 호출)은 항상 풀이다.
  # D-430 Safety-Review 도 여기서 한 번만 돈다(전체 이력이 필요한 유일한 선행 검사).
  scope:
    # D-135 전환 (2026-09-20): ubuntu-26.04 리허설 연속 녹색 후 게이팅 러너를
    # 26.04 로 올렸다 — ubuntu-latest 의 강제 이동(10-19~11-19)보다 먼저 검증된
    # 전환이다. 되돌림은 이 기본값을 24.04 로 바꾸면 된다.
    runs-on: ${{ inputs.runs_on || 'ubuntu-26.04' }}
    container:
      image: ghcr.io/robotics-team-1213/rosy-ci@sha256:59245c63b56db2a87722baf0b6696853f55d3f9c85dfc4688a53a946032a0685
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    # A lost runner otherwise holds the run for the 6 h default (run 38588670328 sat 45 min in an
    # install step). Measured scope: ~35 s. A publish PR's per-commit size rule walks its whole range
    # (#210: 3,145 commits, cancelled at 10 min on 2026-10-26), so the cap leaves room for that.
    timeout-minutes: 60
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      # 전체 이력: 모듈 logs.md 의 append-only 검사가 PR base / push 이전 커밋과 비교한다.
      # 얕은 clone 이면 HEAD 만 비교되어 이미 커밋된 기록의 수정을 잡지 못한다 (D-61).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (pinned commit)
        with:
          fetch-depth: 0

      - name: Fix git safe directory (container)
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: CI image readiness (selector tools)
        run: python3 -c 'import yaml' && git --version

      # D-430 §5: a commit that touches a safety-tagged path (platform_parts.yaml
      # `concern: safety` roots, `safety_modules`, `safety_anchors`) needs a
      # `Safety-Review:` trailer. Only the event's own range is checked: the PR's
      # commits, a merge group's base_sha..head (D-762), or a push's before..after (the
      # tip alone for a new branch or a force push). Scheduled/called runs skip it, so one
      # old commit cannot keep CI red. Relies on the full-history checkout above (fetch-depth: 0).
      - name: Safety-Review trailer (D-430)
        if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          SAFETY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: python3 tools/harness/safety_review.py "$SAFETY_BASE" HEAD

      # D-766 2: each commit of the same range passes the size rule on its own (bisect stays green).
      # A new branch or force push (zero or unreachable base) checks the tip alone.
      - name: Size rule per commit (D-766)
        if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          SIZE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -z "$SIZE_BASE" ] || [ "$SIZE_BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$SIZE_BASE^{commit}" 2>/dev/null; then
            echo "::error::missing or unreachable SIZE_BASE ($SIZE_BASE); refusing silent HEAD^ narrowing"
            exit 1
          fi
          python3 tools/harness/size_range.py "$SIZE_BASE" HEAD

      - name: Test scope (D-436)
        id: scope
        shell: bash
        env:
          QUEUE_DELTA: ${{ vars.ROSY_QUEUE_DELTA }}  # D-1059 switch: unset keeps the whole queue selection
          ROSY_BROWSER_CI: ${{ github.event_name == 'pull_request' && '1' || '' }}  # D-1066: browser evidence rides the pull_request run only
          PUSH_SAME: ${{ vars.ROSY_PUSH_SAME }}  # D-1064 switch: unset keeps the whole push selection
          GH_TOKEN: ${{ github.token }}
          SCOPE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'push' && github.event.before || '' }}
        run: |
          set -eo pipefail
          case "${{ github.event_name }}" in
            pull_request|merge_group)
              if [ -z "$SCOPE_BASE" ] || [ "$SCOPE_BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$SCOPE_BASE^{commit}" 2>/dev/null; then
                echo "::error::missing or unreachable SCOPE_BASE ($SCOPE_BASE) for ${{ github.event_name }}; refusing silent narrowing"
                exit 1
              fi
              if [ "${{ github.event_name }}" = merge_group ] && [ "$QUEUE_DELTA" = 1 ]; then
                # D-1059: the guard set alone when this tree is the one the pull request's green run passed.
                ROSY_QUEUE_TESTED="$(python3 tools/harness/affected_queue.py)" && export ROSY_QUEUE_TESTED
              fi
              out="$(python3 tools/harness/rosy_harness.py affected --base "$SCOPE_BASE" --ci-matrix)"
              ;;
            push)
              if [ -z "$SCOPE_BASE" ] || [ "$SCOPE_BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$SCOPE_BASE^{commit}" 2>/dev/null; then
                echo "::warning::missing or unreachable push base ($SCOPE_BASE); escalating to --full"
                out="$(python3 tools/harness/rosy_harness.py affected --base HEAD --full --ci-matrix)"
              else
                if [ "$PUSH_SAME" = 1 ]; then
                  # D-1064: the guard set alone when the merge queue run passed this very commit for this very range.
                  ROSY_QUEUE_TESTED="$(python3 tools/harness/affected_queue.py --pushed "$SCOPE_BASE")" && export ROSY_QUEUE_TESTED
                fi
                out="$(python3 tools/harness/rosy_harness.py affected --base "$SCOPE_BASE" --ci-matrix)"
              fi
              ;;
            *)
              echo "full tier: event ${{ github.event_name }} (scheduled/manual health sweep)"
              out="$(python3 tools/harness/rosy_harness.py affected --base HEAD --full --ci-matrix)"
              ;;
          esac
          echo "mode=$(python3 -c 'import json, sys; print(json.loads(sys.argv[1])["mode"])' "$out")" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 -c 'import json, sys; print(json.dumps(json.loads(sys.argv[1])["matrix"]))' "$out")" >> "$GITHUB_OUTPUT"

      - name: Build ROS-free platform API wheels once
        run: |
          wheelhouse=/tmp/rosy-platform-wheelhouse
          mkdir -p "$wheelhouse"
          pip3 wheel --no-deps --no-build-isolation \
            --wheel-dir "$wheelhouse" \
            contracts/foundation contracts/skill contracts/motion contracts/learning operations/account operations/world operations/monitoring operations/notifications middleware/skills/api middleware/skills/manipulation operations/site_execution middleware/robot_execution/local operations/processes/palletizing integrations/robots/omx middleware/devices/omx/agent applications/fleet/gateway

      - name: Upload ROS-free platform API wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (pinned commit)
        with:
          name: rosy-wheelhouse
          path: /tmp/rosy-platform-wheelhouse/*.whl
          retention-days: 1

  # D-436 병렬 실행: matrix 항목 하나가 러너 하나다(tools/harness/affected_tests.py 의
  # CI_FULL_MATRIX + 루트 test/ 3 분할, 또는 affected 호출마다 하나, 그리고 build-smoke).
  # 셋업(컨테이너·apt·pip ≈ 70 초, colcon ≈ 20 초)은 항목마다 반복되지만, 직렬 실행의
  # 시험 시간(≈ 8.5 분, 루트 test/ 만 4.5 분)보다 훨씬 짧다. colcon 빌드는 오버레이가
  # 필요한 항목(ros: overlay)과 build-smoke 만 한다.
  test:
    needs: scope
    name: test (${{ matrix.name }})
    runs-on: ${{ inputs.runs_on || 'ubuntu-26.04' }}
    container:
      image: ghcr.io/robotics-team-1213/rosy-ci@sha256:59245c63b56db2a87722baf0b6696853f55d3f9c85dfc4688a53a946032a0685
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    # Longest entry on 2026-10-16: fleet-2of4, 751 s. A timeout is a failure, so ci-result fails.
    timeout-minutes: 25
    continue-on-error: ${{ !matrix.gating }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      # 전체 이력: 모듈 logs.md 의 append-only 검사가 PR base / push 이전 커밋과 비교한다.
      # 얕은 clone 이면 HEAD 만 비교되어 이미 커밋된 기록의 수정을 잡지 못한다 (D-61).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (pinned commit)
        with:
          fetch-depth: 0

      - name: Fix git safe directory (container)
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      # The image (.github/ci-image/Dockerfile, build-ci-image.yml) carries the apt packages, the hash-locked
      # device runtime, test tools, account OAuth, receiver crypto and Chromium. These asserts keep the old
      # install steps' readiness checks, so a stale or wrong image fails here instead of deep in a suite.
      - name: CI image readiness
        shell: bash
        run: |
          set -eo pipefail
          command -v colcon openssl rauc zstd >/dev/null
          test "$(dpkg-query -W -f='${Version}' rauc)" = 1.11.3-2
          test -f "$ROSY_TEST_RAUC_DEB"
          dpkg -s nodejs python3-opencv python3-pil ros-jazzy-xacro ros-jazzy-nav2-msgs >/dev/null
          python3 -c 'import flake8, httpx, yaml, jsonschema, ext4, playwright, oauthlib, joserfc; assert httpx.__version__ == "0.28.1"'
          python3 -c 'from importlib.metadata import version as v; assert v("playwright") == "1.64.1", v("playwright"); assert v("oauthlib") == "4.0.0" and v("joserfc") == "1.7.5"'
          python3 -c 'import pydantic; assert pydantic.VERSION.startswith("2."), pydantic.VERSION'
          python3 -c 'import cryptography; from cryptography.x509.verification import PolicyBuilder, Store; assert cryptography.__version__ == "50.0.0"'
          ! test -e /opt/ros/jazzy/share/slam_toolbox  # the boot smoke needs slam_toolbox absent
          test -f /opt/rosy-ci/runtime-constraints.txt

      - name: Install OMX cell vision runtime
        if: contains(toJSON(matrix.invocations), 'test/test_omx_cell')
        run: |
          # The cell runs deploy/robot/omx/requirements-cell.lock (OpenCV 4.12, NumPy 2.2); the container's apt
          # python3-opencv is 4.6, where cell geometry tests failed on PR #247 (11-19) on a version the cell never runs.
          # The image holds the lock's numpy and opencv-python-headless pins; assert they match the lock in this checkout.
          grep -E '^(numpy|opencv-python-headless)==' deploy/robot/omx/requirements-cell.lock > /tmp/rosy-omx-cell-vision.txt
          PYTHONPATH=/opt/rosy-ci/omx-cell-vision python3 -c 'from importlib.metadata import version as v; [v(n) == ver or (_ for _ in ()).throw(AssertionError((n, v(n), ver))) for n, ver in (l.split()[0].split("==") for l in open("/tmp/rosy-omx-cell-vision.txt"))]'
          echo "PYTHONPATH=/opt/rosy-ci/omx-cell-vision${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Install site Vision verification runtime
        if: contains(toJSON(matrix.invocations), 'operations/overhead/test')
        run: |
          # Test calibration against the deployed Vision runtime, retaining ROS apt packages.
          if [ -d /opt/rosy-ci/site-vision-tools ]; then
            echo "PYTHONPATH=/opt/rosy-ci/site-vision-tools${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          else
            pip3 install --no-cache-dir --break-system-packages \
              --target /tmp/rosy-site-vision-tools -r deploy/site/requirements-vision.txt
            echo "PYTHONPATH=/tmp/rosy-site-vision-tools${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          fi

      - name: Fleet browser readiness (Chromium and CJK fonts from the image)
        if: contains(toJSON(matrix.invocations), 'operations/fleet/test') || contains(toJSON(matrix.invocations), 'applications/fleet/test') || contains(toJSON(matrix.invocations), 'test_account_pipeline.py') || contains(toJSON(matrix.invocations), 'test_monitoring_browser.py') || contains(toJSON(matrix.invocations), 'ROSY_RUN_BROWSER_TESTS=1')
        run: |
          # The console is Korean: without fonts-noto-cjk, headless Chromium renders Hangul through
          # Playwright's wide Unifont fallback and 320px layout-fit assertions see overflow.
          fc-list | grep -qi 'noto.*cjk'
          python3 -c 'from playwright.sync_api import sync_playwright as p; pw = p().start(); pw.chromium.launch().close(); pw.stop()'

      - name: Install Pinky raw verification tools
        if: contains(toJSON(matrix.invocations), 'learning/curation/pinky') || contains(toJSON(matrix.invocations), 'learning/training/pinky')
        run: |
          # Real CDR/MCAP and video tests must run, not skip behind missing host tools.
          # Keep NumPy 2/OpenCV in this job's tool directory; Debian's NumPy has
          # no pip RECORD and must remain available to the ROS base image.
          if [ -d /opt/rosy-ci/pinky-raw-tools ]; then
            echo "PYTHONPATH=/opt/rosy-ci/pinky-raw-tools${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          else
            pip3 install --no-cache-dir --break-system-packages -c /opt/rosy-ci/runtime-constraints.txt \
              --target /tmp/rosy-pinky-raw-tools -r learning/curation/pinky/requirements-raw.txt
            echo "PYTHONPATH=/tmp/rosy-pinky-raw-tools${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          fi

      - name: Cache Pinky CPU torch wheel
        if: contains(toJSON(matrix.invocations), 'learning/training/pinky')
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 (pinned commit)
        with:
          path: /tmp/pip-cache-pinky
          key: ${{ runner.os }}-pinky-torch-2.7.1

      - name: Install Pinky CPU model comparison tools
        if: contains(toJSON(matrix.invocations), 'learning/training/pinky')
        run: |
          pip3 install --cache-dir /tmp/pip-cache-pinky --break-system-packages --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          python3 -c "import numpy as np, torch, cv2; a=np.zeros((2,2,3),dtype=np.uint8); assert torch.from_numpy(a).numpy().shape==a.shape; assert cv2.resize(a,(4,4)).shape==(4,4,3); print(np.__version__,torch.__version__,cv2.__version__)"

      - name: Cache OMX ACT CPU verification tools
        if: matrix.name == 'omx-act-cpu'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 (pinned commit)
        with:
          path: /tmp/rosy-omx-act-cpu
          key: ${{ runner.os }}-omx-act-cpu-${{ hashFiles('deploy/robot/omx/requirements-lerobot-export.txt') }}

      - name: Install OMX ACT CPU verification tools
        if: matrix.name == 'omx-act-cpu'
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          # Separate matrix runner/tool path: the Pinky comparison keeps its own torch pin.
          if [ ! -d /tmp/rosy-omx-act-cpu/torch ]; then
            pip3 install --no-cache-dir --break-system-packages --target /tmp/rosy-omx-act-cpu \
              --extra-index-url https://download.pytorch.org/whl/cpu \
              -r deploy/robot/omx/requirements-lerobot-export.txt
          fi
          PYTHONPATH="/tmp/rosy-omx-act-cpu${PYTHONPATH:+:$PYTHONPATH}" python3 - <<'PY'
          import json
          from importlib.metadata import version
          from pathlib import Path
          import torch
          import torchvision
          from lerobot.policies.act.modeling_act import ACTPolicy

          pins = dict(line.strip().split('==', 1) for line in
                      Path('deploy/robot/omx/requirements-lerobot-export.txt').read_text().splitlines()
                      if line.strip() and not line.lstrip().startswith('#'))
          actual = {name: version(name) for name in pins}
          assert actual == pins, (actual, pins)
          assert torch.version.cuda is None
          print(json.dumps(actual, sort_keys=True))
          PY
          echo "PYTHONPATH=/tmp/rosy-omx-act-cpu${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          echo "ROSY_ACT_CPU_REQUIRED=1" >> "$GITHUB_ENV"
          echo "HF_HUB_OFFLINE=1" >> "$GITHUB_ENV"
          echo "TRANSFORMERS_OFFLINE=1" >> "$GITHUB_ENV"
          echo "OMP_NUM_THREADS=2" >> "$GITHUB_ENV"
          echo "OPENBLAS_NUM_THREADS=2" >> "$GITHUB_ENV"
          echo "MKL_NUM_THREADS=2" >> "$GITHUB_ENV"

      - name: Download ROS-free platform API wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (pinned commit)
        with:
          name: rosy-wheelhouse
          path: /tmp/rosy-platform-wheelhouse

      - name: Build and install ROS-free platform API wheels
        run: |
          wheelhouse=/tmp/rosy-platform-wheelhouse
          mkdir -p "$wheelhouse"
          if ! ls "$wheelhouse"/*.whl >/dev/null 2>&1; then
            pip3 wheel --no-deps --no-build-isolation \
              --wheel-dir "$wheelhouse" \
              contracts/foundation contracts/skill contracts/motion contracts/learning operations/account operations/world operations/monitoring operations/notifications middleware/skills/api middleware/skills/manipulation operations/site_execution middleware/robot_execution/local operations/processes/palletizing integrations/robots/omx middleware/devices/omx/agent applications/fleet/gateway
          fi
          pip3 install --break-system-packages --no-cache-dir --no-index \
            --find-links "$wheelhouse" \
            core_common==0.0.3 rosy-contracts-skill==0.1.1 rosy-contracts-motion==0.1.0 rosy-contracts-learning==0.1.16 rosy-account==0.1.0 rosy-world==0.1.1 rosy-monitoring==0.1.0 rosy-notifications==0.1.0 rosy-skill-api==0.1.0 rosy-skill-manipulation==0.1.0 rosy-execution==0.1.2 rosy-execution-local==0.1.7 rosy-palletizing==0.1.2 rosy-integration-robot-omx==0.1.2 rosy-app-agent==0.1.3 rosy-app-gateway==0.1.2

      - name: Build (colcon)
        if: matrix.kind == 'smoke' || (matrix.ros == 'overlay' && matrix.colcon != false)
        run: |
          # 러너 셸은 컨테이너 엔트리포인트를 우회하므로 ROS 환경을 직접 얹는다 —
          # 아니면 CMake가 ament_cmake를 찾지 못해 빌드 자체가 시작되지 않는다.
          . /opt/ros/jazzy/setup.sh
          # 러너에는 Gazebo/ros_gz가 없다 — gz_sim은 aarch64처럼 CI에서도 제외한다.
          # gz_sim 테스트 스텝은 ros_gz_sim share 부재 시 스스로 skip 한다.
          # Source-structure tests must still see this package after the build.
          GZ_IGNORE=integrations/simulation/gazebo/COLCON_IGNORE
          if [ ! -e "$GZ_IGNORE" ]; then
            trap 'rm -f "$GZ_IGNORE"' EXIT
            touch "$GZ_IGNORE"
          fi
          # D-427: colcon runs from the repo root over the manifest's colcon_roots;
          # build/install/log land at the repo root, never inside a source root.
          COLCON_ROOTS="$(python3 tools/harness/colcon_roots.py)"
          colcon --log-base log build --symlink-install --base-paths $COLCON_ROOTS \
            --build-base build --install-base install \
            --event-handlers console_direct+

      - name: Lint (flake8)
        if: matrix.kind == 'smoke'
        run: |
          flake8 middleware/core/gateway/core contracts/foundation/core_common middleware/core/events/core_events middleware/core/services/core_features middleware/drive/behaviors middleware/core/api/core_api_web operations/fleet/fleet operations/fleet/test integrations/simulation/gazebo/launch integrations/simulation/gazebo/scripts integrations/simulation/gazebo/test --count --max-line-length=120 --show-source --statistics || true

      # 항목의 pytest 호출을 차례로 돈다. 기본 이름이 겹치는 스위트는 이미 다른 호출로
      # 나뉘어 있다(gateway·sensing 의 test_battery.py). ros: none 은 ROS 환경 없이(호스트와
      # 같은 조건), base 는 /opt/ros 만, overlay 는 colcon install 까지 얹는다 — 루트 test/
      # 배포·릴리스 계약과 gz_sim 은 overlay 다. 5 = 수집 0건은 경로가 하나일 때만 실패가 아니다.
      - name: Test (matrix suite, D-436)
        if: matrix.kind == 'pytest'
        shell: bash
        env:
          # module harness: logs.md 는 이 base 이후로 앞부분이 보존되어야 한다 (비면 origin/main merge-base).
          HARNESS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          ROSY_ROS: ${{ matrix.ros }}
          ROSY_INVOCATIONS: ${{ toJSON(matrix.invocations) }}
        run: |
          # ROS setup.sh 는 미정의 변수를 참조하므로 -u 를 쓰지 않는다.
          set -eo pipefail
          case "$ROSY_ROS" in
            overlay) . /opt/ros/jazzy/setup.sh; [ -f install/setup.sh ] && . install/setup.sh || true ;;
            base) . /opt/ros/jazzy/setup.sh ;;
          esac
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          # Enable Fleet backend/app and the explicit account SSO journey; leave other CORE browsers opt-in.
          account_browser = "test/integration/core_fleet/test_account_pipeline.py"
          native_ros = {
              "middleware/devices/omx/adapter/test/test_omx_ros_runtime.py": "113",
              "middleware/devices/omx/adapter/test/test_omx_fleet_ros_actionserver.py": "114",
          }
          runs = []
          sys.path.insert(0, "tools/harness")
          from affected_exclusive import dedicated, split_environment
          from affected_pack import is_serial, serial_prefixes
          from affected_repo import Repo
          serial = serial_prefixes(Repo(Path("."), [], [], [], []))
          has_xdist = importlib.util.find_spec("xdist") is not None
          for paths in json.loads(os.environ["ROSY_INVOCATIONS"]):
              paths, job_environment = split_environment(paths)
              flags = [p for p in paths if p.startswith("-")]
              targets = [p for p in paths if not p.startswith("-")]
              # Timing-sensitive ROS fixtures need the same fresh-process environment as
              # test_omx_native_ros_runtime.py. Keep their tests in full AND affected runs.
              isolated = [p for p in targets if p.split("::", 1)[0] in native_ros]
              targets = [p for p in targets if p not in isolated]
              for target in native_ros:
                  if any(target.startswith(p.rstrip("/") + "/") for p in targets):
                      flags.append("--ignore=" + target)
                      isolated.append(target)
              browser = [p for p in targets if p.startswith(("operations/fleet/test", "applications/fleet/test")) or p in (account_browser, "test/test_monitoring_browser.py")]
              rest = [p for p in targets if p not in browser]
              if rest:
                  runs.append(([*rest, *flags], job_environment))
              if browser:
                  # STRICT (vacuous-run check) judges the whole run, so only for whole browser FILES; a directory,
                  # mixed list or "::" node id selects part of a file or holds legitimate skips.
                  strict = {"ROSY_BROWSER_STRICT": "1"} if all("::" not in p and p.endswith("_browser.py") for p in browser) else {}
                  runs.append(([*browser, *flags], {**job_environment, "ROSY_RUN_BROWSER_TESTS": "1", **strict}))
              for target in isolated:
                  runs.append(([target], {
                      "ROSY_OMX_NATIVE_REQUIRED": "1", "PYTEST_DISABLE_PLUGIN_AUTOLOAD": "1",
                      "ROS_DOMAIN_ID": native_ros[target.split("::", 1)[0]],
                      "ROS_AUTOMATIC_DISCOVERY_RANGE": "LOCALHOST", "ROS_STATIC_PEERS": "",
                      "RMW_IMPLEMENTATION": "rmw_fastrtps_cpp",
                  }))
          # D-762 stage 1: when every failure is listed in test/flaky_quarantine.txt, those ids
          # rerun once here; all passing makes the invocation green (FLAKY). Unlisted: no rerun.
          sys.path.append("test")
          import known_failures
          quarantine = known_failures.load_known(known_failures.QUARANTINE.read_text(encoding="utf-8"))
          known_list = (known_failures.load_known(known_failures.LIST.read_text(encoding="utf-8"))
                        if getattr(known_failures, "LIST", None) is not None and known_failures.LIST.is_file() else {})
          act_cpu_required = os.environ.get("ROSY_ACT_CPU_REQUIRED") == "1"
          status = 0
          for paths, extra in runs:
              if not paths:
                  continue
              print("::group::pytest " + " ".join(paths), flush=True)
              child_env = {**os.environ, **extra}
              native_required = extra.get("ROSY_OMX_NATIVE_REQUIRED") == "1"
              if native_required:
                  for key in ("CYCLONEDDS_URI", "FASTDDS_DEFAULT_PROFILES_FILE",
                              "FASTRTPS_DEFAULT_PROFILES_FILE", "ROS_DISCOVERY_SERVER"):
                      child_env.pop(key, None)
                  print(f"isolated native ROS: domain={child_env['ROS_DOMAIN_ID']} "
                        f"RMW={child_env['RMW_IMPLEMENTATION']} discovery=LOCALHOST plugins=explicit", flush=True)
              targets = [p for p in paths if not p.startswith("-")]
              use_xdist = (has_xdist and not extra.get("ROSY_RUN_BROWSER_TESTS") and not native_required
                           and not act_cpu_required and not dedicated(paths)
                           and not any("::" in p or is_serial(p, serial) for p in targets))
              xdist_args = ["-n", "auto"] if use_xdist else []
              proc = subprocess.Popen([sys.executable, "-m", "pytest", *paths, *xdist_args, "-v",
                                       "--continue-on-collection-errors", *known_failures.NO_ROS_LAUNCH_PLUGINS],
                                      env=child_env, stdout=subprocess.PIPE,
                                      stderr=subprocess.STDOUT, text=True, errors="replace")
              out = []
              for line in proc.stdout:
                  sys.stdout.write(line)
                  out.append(line)
              code = proc.wait()
              failed = known_failures.failed_ids("".join(out))
              ids = [] if dedicated(paths) else known_failures.rerun_ids("".join(out), quarantine)
              rerun_out = ""
              if known_failures.should_rerun(code, failed, ids):
                  print(f"rerunning quarantined failures once: {' '.join(ids)}", flush=True)
                  rerun = subprocess.run([sys.executable, "-m", "pytest", *ids, "-q", "-rA", "-p", "no:cacheprovider",
                                          *known_failures.NO_ROS_LAUNCH_PLUGINS],
                                         env=child_env, stdout=subprocess.PIPE,
                                         stderr=subprocess.STDOUT, text=True, errors="replace")
                  print(rerun.stdout, flush=True)
                  if known_failures.rerun_passed(code, failed, ids, rerun.returncode, rerun.stdout):
                      print(f"::warning::FLAKY (passed on rerun, D-762): {' '.join(ids)}", flush=True)
                      code = 0
                      rerun_out = rerun.stdout
              print("::endgroup::", flush=True)
              full_out = "".join(out)
              first_out = full_out.split(known_failures.RERUN_MARKER, 1)[0]
              target_paths = [p for p in paths if not p.startswith("-")]
              req_ids = [p for p in target_paths if "::" in p]
              known_id = lambda nid: any(
                  k == nid or k.startswith((nid + "[", nid + "::")) or known_failures._matches(nid, k)
                  for k in known_list
              )
              checked_req = [nid for nid in req_ids if not known_id(nid)]
              has_summary = bool(re.search(r"\bin [0-9.]+s\b", first_out) or "no tests ran" in first_out)
              if first_out.strip() and checked_req:
                  missing_req = [
                      nid for nid in checked_req
                      if not re.search(rf"(?m)^{re.escape(nid)}(?:\[[^\r\n]*\]|::\S+)?\s+PASSED\b", first_out)
                      and not re.search(rf"(?m)^PASSED\s+{re.escape(nid)}(?:\[[^\r\n]*\]|::\S+)?\b", full_out)
                  ]
                  if missing_req:
                      print(f"::error::required node id(s) did not pass (skipped/missing): {' '.join(missing_req)}", flush=True)
                      status = 1
              _, seen_known, _ = known_failures.compare(first_out, known_list)
              all_req_known = bool(req_ids) and not checked_req and bool(seen_known)
              if has_summary and not all_req_known and (len(target_paths) > 1 or bool(req_ids)
                                  or any(not p.endswith(".py") for p in target_paths)):
                  if not re.search(r"\b[1-9]\d* passed\b", full_out):
                      print(f"::error::pytest {' '.join(paths)} passed 0 items (all skipped or empty)", flush=True)
                      status = 1
              if (native_required or act_cpu_required) and (code == 5 or re.search(r"\b\d+ skipped\b", full_out)):
                  kind = "ACT CPU" if act_cpu_required else "ROS"
                  print(f"::error::native {kind} fixture must execute without skips: {' '.join(paths)}", flush=True)
                  status = 1
              # D-1066: a STRICT browser run is no evidence unless something passed and nothing skipped.
              if extra.get("ROSY_BROWSER_STRICT") == "1":
                  from affected_browser import vacuous
                  reason = vacuous(first_out + rerun_out)  # a rerun that passed is part of the verdict
                  if reason:
                      print(f"::error::browser evidence did not run for real: {' '.join(paths)}: {reason}", flush=True)
                      status = 1
              # 경로가 여럿인데 0건 수집이면 세션 전체가 건너뛰어진 것이다(10-11부터 루트 test/ 가 그랬다).
              if known_failures.collected_nothing(full_out, paths):
                  print(f"::error::pytest {' '.join(paths)} collected 0 items", flush=True)
                  status = 1
              elif code not in (0, 5):
                  print(f"::error::pytest {' '.join(paths)} exited {code}", flush=True)
                  status = 1
          sys.exit(status)
          PY

      # 호스트 테스트는 ros_bridge 를 임포트하지 않으므로, 모듈 최상단의 ROS
      # 임포트가 노드 생성자를 죽이는 결함을 잡지 못한다. 이 러너에는
      # slam_toolbox 가 없어 그 조건이 그대로 재현된다.
      - name: Smoke (node boots without optional ROS packages)
        if: matrix.kind == 'smoke'
        shell: bash
        run: |
          # ROS setup.sh 는 미정의 변수를 참조하므로 -u 를 쓰지 않는다.
          set -eo pipefail
          . /opt/ros/jazzy/setup.sh
          . install/setup.sh
          export HOME=/tmp ROS_LOG_DIR=/tmp/ros-logs
          timeout 60 ros2 run core core > /tmp/boot.log 2>&1 &
          node_pid=$!
          for _ in $(seq 1 60); do
            grep -q 'core up' /tmp/boot.log && break
            kill -0 "$node_pid" 2>/dev/null || break
            sleep 1
          done
          kill "$node_pid" 2>/dev/null || true
          cat /tmp/boot.log
          if ! grep -q 'core up' /tmp/boot.log; then
            echo '::error::core did not reach startup'
            exit 1
          fi
          # 러너가 slam_toolbox 를 갖게 되면 이 검사는 의도한 조건을 더 이상
          # 재현하지 못한다. 조용히 통과하지 말고 드러내야 한다.
          if ! grep -q 'slam_toolbox unavailable' /tmp/boot.log; then
            echo '::error::precondition lost: runner now has slam_toolbox'
            exit 1
          fi

      # save_map 의 두 수정(std_msgs/String, RESULT_SUCCESS=0)은 실패하면 예외가
      # 아니라 SIGABRT 다. 호스트 테스트로는 잡히지 않으므로 실제 타입으로 검사한다.
      # 전체 설치(Qt/assimp 의존성)는 무겁다 — deb 만 받아 풀면 바인딩이 임포트된다.
      - name: Guard (SaveMap request type and result codes)
        if: matrix.kind == 'smoke'
        shell: bash
        run: |
          set -eo pipefail
          . /opt/ros/jazzy/setup.sh
          # The image carries the slam_toolbox deb (not installed: the boot smoke needs it absent).
          dpkg -x /opt/rosy-ci/debs/ros-jazzy-slam-toolbox_*.deb /
          python3 - <<'PY'
          from slam_toolbox.srv import SaveMap
          from std_msgs.msg import String
          from rclpy.serialization import serialize_message

          fields = SaveMap.Request.get_fields_and_field_types()
          assert fields['name'] == 'std_msgs/String', fields
          assert SaveMap.Response.RESULT_SUCCESS == 0, 'success code changed'

          # ros_bridge.save_map 이 만드는 형태 그대로. 원시 str 이었다면 여기서
          # convert_from_py assertion 으로 프로세스가 죽는다.
          request = SaveMap.Request()
          request.name = String(data='ci-map')
          assert serialize_message(request)
          print('SaveMap guard OK')
          PY

  # D-436: one stable check name for branch protection. The matrix job names change
  # with the selection (test (affected-3), test (root-test-2of3)), so protection points
  # here. Fails unless scope and every gating matrix entry succeeded; a cancelled or
  # skipped job is a failure. Non-gating entries (continue-on-error) do not fail it.
  ci-result:
    name: ci-result
    needs: [scope, test]
    if: always()
    runs-on: ${{ inputs.runs_on || 'ubuntu-26.04' }}
    timeout-minutes: 5
    steps:
      # merge_group.head_sha is the queue's synthetic merge commit, not the PR head; extract pr-N from gh-readonly-queue head_ref to read the PR head SHA.
      # shortcut: checks only the PR named in head_ref (the group's last PR); a batched group's earlier PRs are not checked, upgrade by listing the queue entries if drain batching matters
      - name: Cutover drain gate (merge_group)
        if: github.event_name == 'merge_group' && vars.ROSY_CUTOVER_PHASE == 'drain'
        env:
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          ALLOW_SHAS: ${{ vars.ROSY_CUTOVER_ALLOW }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request

          allow = set(os.environ.get("ALLOW_SHAS", "").split())
          head_ref = os.environ.get("HEAD_REF", "")
          head_sha = os.environ.get("HEAD_SHA", "")
          match = re.search(r"(?:^|/)pr-(\d+)(?:-|$)", head_ref)
          pr_sha = ""
          if match:
              url = f"https://api.github.com/repos/{os.environ['REPO']}/pulls/{match.group(1)}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
              })
              with urllib.request.urlopen(req, timeout=15) as resp:
                  pr_sha = json.loads(resp.read().decode("utf-8"))["head"]["sha"]
          candidate = pr_sha or head_sha
          if not candidate or candidate not in allow:
              print(f"::error::ROSY_CUTOVER_PHASE=drain: PR head {candidate or '<unknown>'} (ref={head_ref}) is not in ROSY_CUTOVER_ALLOW")
              sys.exit(1)
          print(f"cutover drain gate OK: {candidate} allowed")
          PY
      # D-1059: the merge commit this green pull_request run tested. A merge queue run reads it back
      # (tools/harness/affected_queue.py) and repeats the guard set alone when its tree is the same.
      # It stands before the verdict (tests pin that as the last step), so its own condition keeps a red run silent.
      - name: Tested commit notice (D-1059)
        if: github.event_name == 'pull_request' && needs.scope.result == 'success' && needs.test.result == 'success'
        run: echo "::notice title=rosy-tested-commit::${{ github.sha }}"

      - name: All gating jobs passed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "scope=$SCOPE_RESULT test=$TEST_RESULT"
          test "$SCOPE_RESULT" = success && test "$TEST_RESULT" = success
