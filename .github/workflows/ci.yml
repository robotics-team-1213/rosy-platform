name: ci

on:
  push:
    branches: [main]
  pull_request:
  # D-436: PR 은 affected 티어, main push·야간·수동 실행은 풀 티어를 GitHub 러너에서
  # 병렬 matrix 로 돈다. 로컬 PC 는 affected 티어와 pre-push 패스트 게이트만 돈다.
  schedule:
    - cron: "0 18 * * *"   # 03:00 KST nightly full run
  workflow_dispatch:
  # ubuntu-26.04-rehearsal.yml 이 같은 절차를 다른 러너에서 재실행한다 (D-134).
  workflow_call:
    inputs:
      runs_on:
        type: string
        default: ubuntu-24.04

jobs:
  # D-436: 시험 범위와 병렬 matrix 를 정한다. pull_request 는 변경 범위(affected) 티어 —
  # 선택기가 공용 기반·CI/시험 설정·미분류 파일 때문에 FULL 로 올리면 풀 matrix 다.
  # main push·schedule·workflow_dispatch·workflow_call(PR 이 아닌 호출)은 항상 풀이다.
  # D-430 Safety-Review 도 여기서 한 번만 돈다(전체 이력이 필요한 유일한 선행 검사).
  scope:
    # D-135 전환 (2026-09-20): ubuntu-26.04 리허설 연속 녹색 후 게이팅 러너를
    # 26.04 로 올렸다 — ubuntu-latest 의 강제 이동(10-19~11-19)보다 먼저 검증된
    # 전환이다. 되돌림은 이 기본값을 24.04 로 바꾸면 된다.
    runs-on: ${{ inputs.runs_on || 'ubuntu-26.04' }}
    container: ros:jazzy-ros-base
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      # 전체 이력: 모듈 logs.md 의 append-only 검사가 PR base / push 이전 커밋과 비교한다.
      # 얕은 clone 이면 HEAD 만 비교되어 이미 커밋된 기록의 수정을 잡지 못한다 (D-61).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix git safe directory (container)
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install selector tools
        run: |
          apt-get update -qq
          apt-get install -y -qq python3-yaml

      # D-430 §5: a commit that touches a safety-tagged path (platform_parts.yaml
      # `concern: safety` roots, `safety_modules`, `safety_anchors`) needs a
      # `Safety-Review:` trailer. Only the event's own range is checked: the PR's
      # commits, or a push's before..after (the tip alone for a new branch or a
      # force push). Scheduled/called runs skip it, so one old commit cannot keep CI
      # red. Relies on the full-history checkout above (fetch-depth: 0).
      - name: Safety-Review trailer (D-430)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          SAFETY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/harness/safety_review.py "$SAFETY_BASE" HEAD

      - name: Test scope (D-436)
        id: scope
        shell: bash
        env:
          SCOPE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$SCOPE_BASE" ]; then
            python3 tools/harness/rosy_harness.py affected --base "$SCOPE_BASE" --print
            out="$(python3 tools/harness/rosy_harness.py affected --base "$SCOPE_BASE" --ci-matrix)"
          else
            echo "full tier: event ${{ github.event_name }} (D-436 4)"
            out="$(python3 tools/harness/rosy_harness.py affected --base HEAD --full --ci-matrix)"
          fi
          echo "mode=$(python3 -c 'import json, sys; print(json.loads(sys.argv[1])["mode"])' "$out")" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 -c 'import json, sys; print(json.dumps(json.loads(sys.argv[1])["matrix"]))' "$out")" >> "$GITHUB_OUTPUT"

  # D-436 병렬 실행: matrix 항목 하나가 러너 하나다(tools/harness/affected_tests.py 의
  # CI_FULL_MATRIX + 루트 test/ 3 분할, 또는 affected 호출마다 하나, 그리고 build-smoke).
  # 셋업(컨테이너·apt·pip ≈ 70 초, colcon ≈ 20 초)은 항목마다 반복되지만, 직렬 실행의
  # 시험 시간(≈ 8.5 분, 루트 test/ 만 4.5 분)보다 훨씬 짧다. colcon 빌드는 오버레이가
  # 필요한 항목(ros: overlay)과 build-smoke 만 한다.
  test:
    needs: scope
    name: test (${{ matrix.name }})
    runs-on: ${{ inputs.runs_on || 'ubuntu-26.04' }}
    container: ros:jazzy-ros-base
    continue-on-error: ${{ !matrix.gating }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      # 전체 이력: 모듈 logs.md 의 append-only 검사가 PR base / push 이전 커밋과 비교한다.
      # 얕은 clone 이면 HEAD 만 비교되어 이미 커밋된 기록의 수정을 잡지 못한다 (D-61).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix git safe directory (container)
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install colcon & tools
        run: |
          apt-get update -qq
          # openssl: the release signing contract requires OpenSSL 3 raw Ed25519.
          # Installed explicitly so a slimmer base image cannot silently remove it.
          # python3-opencv: the lane live viewer (integrations/simulation/gazebo/scripts/lane_live_view.py)
          # imports cv2 at module top; without the package the gz_sim step dies at
          # collection and masks every later gate (main red since 650fad89, 2026-09-24).
          apt-get install -y -qq nodejs python3-colcon-common-extensions python3-pip python3-wheel openssl zstd python3-opencv python3-pil ros-jazzy-xacro ros-jazzy-realtime-tools ros-jazzy-rmw-cyclonedds-cpp ros-jazzy-nav2-msgs
          # --break-system-packages: ros:jazzy-ros-base 는 Ubuntu 24.04 / Python 3.12 라
          # 시스템 환경이 PEP 668 로 표시되어 있다. 이 플래그가 없어 run 34474895940 이
          # externally-managed-environment 로 40 초만에 죽었고, 그 아래 colcon build 부터
          # 부팅 스모크까지 모든 ROS 검증이 한 번도 실행되지 않았다. venv 는 답이 아니다 —
          # --system-site-packages 없이는 rclpy 를 잃고, 그러면 이 워크플로가 검증하려는
          # 대상 자체가 사라진다. 컨테이너는 job 마다 버려지므로 시스템에 직접 깐다.
          # D-189: CORE 런타임(pydantic 2·fastapi·starlette·uvicorn·websockets 와 그 폐포)은
          # 이미지가 싣는 해시 고정 집합 그대로 깐다. 최신을 깔면 호스트 시험은 장치가 돌리지
          # 않는 버전을 검증한다 — 2026.09.23-005 가 CI 녹색인 채 pydantic 1.10 으로 죽었다.
          pip3 install --no-cache-dir --break-system-packages --ignore-installed \
            --require-hashes --no-deps --only-binary=:all: -r deploy/robot/pinky_pro/image/device-python-requirements.txt
          # 시험 도구는 그 뒤에, 고정 집합을 제약으로 깐다 — anyio·h11·idna·typing-extensions 가
          # 두 벌 깔리지 않는다. 해시가 있는 파일을 제약으로 주면 pip 이 해시 모드로 바뀌므로
          # name==version 줄만 뽑는다.
          grep -o '^[A-Za-z0-9._-]*==[^ ]*' deploy/robot/pinky_pro/image/device-python-requirements.txt > /tmp/rosy-runtime-constraints.txt
          pip3 install --no-cache-dir --break-system-packages -c /tmp/rosy-runtime-constraints.txt \
            flake8 httpx pyyaml jsonschema ext4

      - name: Install Pinky raw verification tools
        if: contains(toJSON(matrix.invocations), 'learning/curation/pinky') || contains(toJSON(matrix.invocations), 'learning/training/pinky')
        run: |
          # Real CDR/MCAP and video tests must run, not skip behind missing host tools.
          pip3 install --no-cache-dir --break-system-packages -c /tmp/rosy-runtime-constraints.txt \
            -r learning/curation/pinky/requirements-raw.txt

      - name: Install Pinky CPU model comparison tools
        if: contains(toJSON(matrix.invocations), 'learning/training/pinky')
        run: |
          pip3 install --no-cache-dir --break-system-packages --index-url https://download.pytorch.org/whl/cpu torch==2.7.1

      - name: Build and install ROS-free platform API wheels
        run: |
          # Build actual wheels outside src/ and install before colcon/pytest. This catches
          # missing package metadata and namespace-wheel ownership instead of adding modules
          # to PYTHONPATH or treating them as ament packages.
          # 2026-10-02 정정: --break-system-packages 는 install 계열에만 있는 옵션이다
          # (pip wheel 은 환경에 설치하지 않으므로 PEP 668 우회가 필요 없다). wheel 줄에서
          # 떼지 않으면 "no such option" 으로 40 초 만에 죽는다(실행 36967673107).
          wheelhouse=/tmp/rosy-platform-wheelhouse
          mkdir -p "$wheelhouse"
          pip3 wheel --no-deps --no-build-isolation \
            --wheel-dir "$wheelhouse" \
            contracts/skill contracts/motion contracts/learning operations/world middleware/skills/api middleware/skills/manipulation operations/execution middleware/execution/local operations/processes/palletizing integrations/robots/omx middleware/apps/device/omx/agent operations/apps/fleet
          pip3 install --break-system-packages --no-cache-dir --no-index \
            --find-links "$wheelhouse" \
            rosy-contracts-skill==0.1.0 rosy-contracts-motion==0.1.0 rosy-contracts-learning==0.1.6 rosy-world==0.1.0 rosy-skill-api==0.1.0 rosy-skill-manipulation==0.1.0 rosy-execution==0.1.0 rosy-execution-local==0.1.4 rosy-palletizing==0.1.0 rosy-integration-robot-omx==0.1.0 rosy-app-agent==0.1.0 rosy-app-gateway==0.1.0

      - name: Build (colcon)
        if: matrix.kind == 'smoke' || matrix.ros == 'overlay'
        run: |
          # 러너 셸은 컨테이너 엔트리포인트를 우회하므로 ROS 환경을 직접 얹는다 —
          # 아니면 CMake가 ament_cmake를 찾지 못해 빌드 자체가 시작되지 않는다.
          . /opt/ros/jazzy/setup.sh
          # 러너에는 Gazebo/ros_gz가 없다 — gz_sim은 aarch64처럼 CI에서도 제외한다.
          # gz_sim 테스트 스텝은 ros_gz_sim share 부재 시 스스로 skip 한다.
          # Source-structure tests must still see this package after the build.
          GZ_IGNORE=integrations/simulation/gazebo/COLCON_IGNORE
          if [ ! -e "$GZ_IGNORE" ]; then
            trap 'rm -f "$GZ_IGNORE"' EXIT
            touch "$GZ_IGNORE"
          fi
          # D-427: colcon runs from the repo root over the manifest's colcon_roots;
          # build/install/log land at the repo root, never inside a source root.
          COLCON_ROOTS="$(python3 tools/harness/colcon_roots.py)"
          colcon --log-base log build --symlink-install --base-paths $COLCON_ROOTS \
            --build-base build --install-base install \
            --event-handlers console_direct+

      - name: Lint (flake8)
        if: matrix.kind == 'smoke'
        run: |
          flake8 middleware/core/gateway/core contracts/foundation/core_common middleware/core/events/core_events middleware/core/services/core_features middleware/core/api_web/core_api_web operations/fleet/fleet operations/fleet/test integrations/simulation/gazebo/launch integrations/simulation/gazebo/scripts integrations/simulation/gazebo/test --count --max-line-length=120 --show-source --statistics || true

      # 항목의 pytest 호출을 차례로 돈다. 기본 이름이 겹치는 스위트는 이미 다른 호출로
      # 나뉘어 있다(gateway·sensing 의 test_battery.py). ros: none 은 ROS 환경 없이(호스트와
      # 같은 조건), base 는 /opt/ros 만, overlay 는 colcon install 까지 얹는다 — 루트 test/
      # 배포·릴리스 계약과 gz_sim 은 overlay 다. 5 = 수집 0건은 실패가 아니다.
      - name: Test (matrix suite, D-436)
        if: matrix.kind == 'pytest'
        shell: bash
        env:
          # module harness: logs.md 는 이 base 이후로 앞부분이 보존되어야 한다 (비면 origin/main merge-base).
          HARNESS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          ROSY_ROS: ${{ matrix.ros }}
          ROSY_INVOCATIONS: ${{ toJSON(matrix.invocations) }}
        run: |
          # ROS setup.sh 는 미정의 변수를 참조하므로 -u 를 쓰지 않는다.
          set -eo pipefail
          case "$ROSY_ROS" in
            overlay) . /opt/ros/jazzy/setup.sh; . install/setup.sh ;;
            base) . /opt/ros/jazzy/setup.sh ;;
          esac
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          status = 0
          for paths in json.loads(os.environ["ROSY_INVOCATIONS"]):
              print("::group::pytest " + " ".join(paths), flush=True)
              code = subprocess.run([sys.executable, "-m", "pytest", *paths, "-v",
                                     "--continue-on-collection-errors"]).returncode
              print("::endgroup::", flush=True)
              if code not in (0, 5):
                  print(f"::error::pytest {' '.join(paths)} exited {code}", flush=True)
                  status = 1
          sys.exit(status)
          PY

      # 호스트 테스트는 ros_bridge 를 임포트하지 않으므로, 모듈 최상단의 ROS
      # 임포트가 노드 생성자를 죽이는 결함을 잡지 못한다. 이 러너에는
      # slam_toolbox 가 없어 그 조건이 그대로 재현된다.
      - name: Smoke (node boots without optional ROS packages)
        if: matrix.kind == 'smoke'
        shell: bash
        run: |
          # ROS setup.sh 는 미정의 변수를 참조하므로 -u 를 쓰지 않는다.
          set -eo pipefail
          . /opt/ros/jazzy/setup.sh
          . install/setup.sh
          export HOME=/tmp ROS_LOG_DIR=/tmp/ros-logs
          timeout 60 ros2 run core core > /tmp/boot.log 2>&1 &
          node_pid=$!
          for _ in $(seq 1 60); do
            grep -q 'core up' /tmp/boot.log && break
            kill -0 "$node_pid" 2>/dev/null || break
            sleep 1
          done
          kill "$node_pid" 2>/dev/null || true
          cat /tmp/boot.log
          if ! grep -q 'core up' /tmp/boot.log; then
            echo '::error::core did not reach startup'
            exit 1
          fi
          # 러너가 slam_toolbox 를 갖게 되면 이 검사는 의도한 조건을 더 이상
          # 재현하지 못한다. 조용히 통과하지 말고 드러내야 한다.
          if ! grep -q 'slam_toolbox unavailable' /tmp/boot.log; then
            echo '::error::precondition lost: runner now has slam_toolbox'
            exit 1
          fi

      # save_map 의 두 수정(std_msgs/String, RESULT_SUCCESS=0)은 실패하면 예외가
      # 아니라 SIGABRT 다. 호스트 테스트로는 잡히지 않으므로 실제 타입으로 검사한다.
      # 전체 설치(Qt/assimp 의존성)는 무겁다 — deb 만 받아 풀면 바인딩이 임포트된다.
      - name: Guard (SaveMap request type and result codes)
        if: matrix.kind == 'smoke'
        shell: bash
        run: |
          set -eo pipefail
          . /opt/ros/jazzy/setup.sh
          cd /tmp
          apt-get update -qq
          apt-get download ros-jazzy-slam-toolbox
          dpkg -x ros-jazzy-slam-toolbox_*.deb /
          python3 - <<'PY'
          from slam_toolbox.srv import SaveMap
          from std_msgs.msg import String
          from rclpy.serialization import serialize_message

          fields = SaveMap.Request.get_fields_and_field_types()
          assert fields['name'] == 'std_msgs/String', fields
          assert SaveMap.Response.RESULT_SUCCESS == 0, 'success code changed'

          # ros_bridge.save_map 이 만드는 형태 그대로. 원시 str 이었다면 여기서
          # convert_from_py assertion 으로 프로세스가 죽는다.
          request = SaveMap.Request()
          request.name = String(data='ci-map')
          assert serialize_message(request)
          print('SaveMap guard OK')
          PY

  # D-436: one stable check name for branch protection. The matrix job names change
  # with the selection (test (affected-3), test (root-test-2of3)), so protection points
  # here. Fails unless scope and every gating matrix entry succeeded; a cancelled or
  # skipped job is a failure. Non-gating entries (continue-on-error) do not fail it.
  ci-result:
    name: ci-result
    needs: [scope, test]
    if: always()
    runs-on: ${{ inputs.runs_on || 'ubuntu-26.04' }}
    steps:
      - name: All gating jobs passed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "scope=$SCOPE_RESULT test=$TEST_RESULT"
          test "$SCOPE_RESULT" = success && test "$TEST_RESULT" = success
