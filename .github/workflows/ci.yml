name: ci

on:
  push:
    branches: [main]
  pull_request:
  # ubuntu-26.04-rehearsal.yml 이 같은 절차를 다른 러너에서 재실행한다 (D-134).
  workflow_call:
    inputs:
      runs_on:
        type: string
        default: ubuntu-24.04

jobs:
  build:
    # D-135 전환 (2026-09-20): ubuntu-26.04 리허설 연속 녹색 후 게이팅 러너를
    # 26.04 로 올렸다 — ubuntu-latest 의 강제 이동(10-19~11-19)보다 먼저 검증된
    # 전환이다. 되돌림은 이 기본값을 24.04 로 바꾸면 된다.
    runs-on: ${{ inputs.runs_on || 'ubuntu-26.04' }}
    container: ros:jazzy-ros-base
    steps:
      # 전체 이력: 모듈 logs.md 의 append-only 검사가 PR base / push 이전 커밋과 비교한다.
      # 얕은 clone 이면 HEAD 만 비교되어 이미 커밋된 기록의 수정을 잡지 못한다 (D-61).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix git safe directory (container)
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install colcon & tools
        run: |
          apt-get update -qq
          # openssl: the release signing contract requires OpenSSL 3 raw Ed25519.
          # Installed explicitly so a slimmer base image cannot silently remove it.
          apt-get install -y -qq nodejs python3-colcon-common-extensions python3-pip openssl zstd ros-jazzy-xacro ros-jazzy-realtime-tools ros-jazzy-rmw-cyclonedds-cpp ros-jazzy-nav2-msgs
          # --break-system-packages: ros:jazzy-ros-base 는 Ubuntu 24.04 / Python 3.12 라
          # 시스템 환경이 PEP 668 로 표시되어 있다. 이 플래그가 없어 run 34474895940 이
          # externally-managed-environment 로 40 초만에 죽었고, 그 아래 colcon build 부터
          # 부팅 스모크까지 모든 ROS 검증이 한 번도 실행되지 않았다. venv 는 답이 아니다 —
          # --system-site-packages 없이는 rclpy 를 잃고, 그러면 이 워크플로가 검증하려는
          # 대상 자체가 사라진다. 컨테이너는 job 마다 버려지므로 시스템에 직접 깐다.
          # D-189: CORE 런타임(pydantic 2·fastapi·starlette·uvicorn·websockets 와 그 폐포)은
          # 이미지가 싣는 해시 고정 집합 그대로 깐다. 최신을 깔면 호스트 시험은 장치가 돌리지
          # 않는 버전을 검증한다 — 2026.09.23-005 가 CI 녹색인 채 pydantic 1.10 으로 죽었다.
          pip3 install --no-cache-dir --break-system-packages --ignore-installed \
            --require-hashes --no-deps --only-binary=:all: -r deploy/image/device-python-requirements.txt
          # 시험 도구는 그 뒤에, 고정 집합을 제약으로 깐다 — anyio·h11·idna·typing-extensions 가
          # 두 벌 깔리지 않는다. 해시가 있는 파일을 제약으로 주면 pip 이 해시 모드로 바뀌므로
          # name==version 줄만 뽑는다.
          grep -o '^[A-Za-z0-9._-]*==[^ ]*' deploy/image/device-python-requirements.txt > /tmp/rosy-runtime-constraints.txt
          pip3 install --no-cache-dir --break-system-packages -c /tmp/rosy-runtime-constraints.txt \
            flake8 httpx pyyaml jsonschema ext4

      - name: Build (colcon)
        run: |
          # 러너 셸은 컨테이너 엔트리포인트를 우회하므로 ROS 환경을 직접 얹는다 —
          # 아니면 CMake가 ament_cmake를 찾지 못해 빌드 자체가 시작되지 않는다.
          . /opt/ros/jazzy/setup.sh
          # 러너에는 Gazebo/ros_gz가 없다 — gz_sim은 aarch64처럼 CI에서도 제외한다.
          # gz_sim 테스트 스텝은 ros_gz_sim share 부재 시 스스로 skip 한다.
          touch src/sim/gz_sim/COLCON_IGNORE
          cd src
          colcon build --symlink-install --event-handlers console_direct+

      - name: Lint (flake8)
        run: |
          cd src
          flake8 core/core/core core/core_common/core_common core/core_events/core_events core/core_features/core_features core/core_api_web/core_api_web site/fleet/fleet site/fleet/test sim/gz_sim/launch sim/gz_sim/scripts sim/gz_sim/test --count --max-line-length=120 --show-source --statistics || true

      - name: Test (core domain suites, protocol schemas P1-19)
        run: |
          cd src
          python3 -m pytest core/core/test core/core_events/test core/core_features/test core/web_common/test -v

      # fleet 은 ROS 를 import 하지 않는다. conftest 가 src/core/core_common 과
      # src/core/core_features 를 sys.path 에 얹으므로 colcon 오버레이 없이도
      # 돈다 — Windows 개발 환경과 같은 조건이다.
      - name: Test (fleet formation, relay, session)
        run: python3 -m pytest src/site/fleet/test/ -v

      # 멀티 인스턴스 런치는 로봇마다 포트·HOME·설정을 갈라야 한다. 그 계약은 런치
      # 파일을 실제로 실행해야 검증되므로 ROS 오버레이가 필요하다. ros_gz_sim share 가
      # 없는 러너에서는 테스트가 스스로 skip 한다 — 조용히 통과하는 것이 아니라
      # skip 으로 드러난다.
      - name: Test (gz_sim multi-instance launch)
        shell: bash
        run: |
          # ROS setup.sh 는 미정의 변수를 참조하므로 -u 를 쓰지 않는다.
          set -eo pipefail
          . /opt/ros/jazzy/setup.sh
          . src/install/setup.sh
          python3 -m pytest src/sim/gz_sim/test -v

      # D-192: 패키지 안의 하드웨어 안전 시험은 지금까지 CI 에서 한 번도 돌지 않았다
      # (이 워크플로는 src/core/core·fleet·gz_sim·루트 test/ 만 실행한다). 무동작 모드
      # (토크 꺼짐·cmd_vel 미구독), ADC 버스 잠금, 배터리 곡선 고정을 게이트로 올린다.
      # ament 린트(flake8/pep257/copyright)는 기존 파일들이 이미 적색이라 여기서 빼고,
      # 다른 패키지 시험(control·games·emotion·led)의 기존 적색은 D-191 후속 과제다.
      - name: Test (hardware safety - no-motion, ADC lock, battery curve)
        shell: bash
        run: |
          set -eo pipefail
          . /opt/ros/jazzy/setup.sh
          python3 -m pytest src/hardware/bringup/test src/hardware/sensor_adc/test             src/apps/control/test/test_ir_adc_lock.py             --ignore=src/hardware/bringup/test/test_flake8.py             --ignore=src/hardware/bringup/test/test_pep257.py             --ignore=src/hardware/bringup/test/test_copyright.py -v

      # 루트 test/ 는 배포·릴리스 계약을 담고 있으면서도 지금까지 CI 에서 한 번도
      # 실행되지 않았다. 위 스텝이 src/core/core/test 만 돌기 때문이다. 그래서
      # compose 권한 경계와 Wi-Fi 배포 계약이 검증 없이 지나갔다.
      # ROS 오버레이는 필요 없다 — test_motor_control.py 가 직접 sys.path 를 잡는다.
      # 2026-09-21: 구조적 적색 3건(D-136·D-137 인덱스 행 + D-137 T2 저널 필드)이
      # 수습돼 더 이상 deselect 하지 않고 게이팅한다.
      - name: Test (deployment and release contracts)
        env:
          # module harness: logs.md 는 이 base 이후로 앞부분이 보존되어야 한다 (비면 origin/main merge-base).
          HARNESS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          . /opt/ros/jazzy/setup.sh
          . src/install/setup.sh
          python3 -m pytest test/ -v

      # 호스트 테스트는 ros_bridge 를 임포트하지 않으므로, 모듈 최상단의 ROS
      # 임포트가 노드 생성자를 죽이는 결함을 잡지 못한다. 이 러너에는
      # slam_toolbox 가 없어 그 조건이 그대로 재현된다.
      - name: Smoke (node boots without optional ROS packages)
        shell: bash
        run: |
          # ROS setup.sh 는 미정의 변수를 참조하므로 -u 를 쓰지 않는다.
          set -eo pipefail
          . /opt/ros/jazzy/setup.sh
          . src/install/setup.sh
          export HOME=/tmp ROS_LOG_DIR=/tmp/ros-logs
          timeout 60 ros2 run core core > /tmp/boot.log 2>&1 &
          node_pid=$!
          for _ in $(seq 1 60); do
            grep -q 'core up' /tmp/boot.log && break
            kill -0 "$node_pid" 2>/dev/null || break
            sleep 1
          done
          kill "$node_pid" 2>/dev/null || true
          cat /tmp/boot.log
          if ! grep -q 'core up' /tmp/boot.log; then
            echo '::error::core did not reach startup'
            exit 1
          fi
          # 러너가 slam_toolbox 를 갖게 되면 이 검사는 의도한 조건을 더 이상
          # 재현하지 못한다. 조용히 통과하지 말고 드러내야 한다.
          if ! grep -q 'slam_toolbox unavailable' /tmp/boot.log; then
            echo '::error::precondition lost: runner now has slam_toolbox'
            exit 1
          fi

      # save_map 의 두 수정(std_msgs/String, RESULT_SUCCESS=0)은 실패하면 예외가
      # 아니라 SIGABRT 다. 호스트 테스트로는 잡히지 않으므로 실제 타입으로 검사한다.
      # 전체 설치(Qt/assimp 의존성)는 무겁다 — deb 만 받아 풀면 바인딩이 임포트된다.
      - name: Guard (SaveMap request type and result codes)
        shell: bash
        run: |
          set -eo pipefail
          . /opt/ros/jazzy/setup.sh
          cd /tmp
          apt-get update -qq
          apt-get download ros-jazzy-slam-toolbox
          dpkg -x ros-jazzy-slam-toolbox_*.deb /
          python3 - <<'PY'
          from slam_toolbox.srv import SaveMap
          from std_msgs.msg import String
          from rclpy.serialization import serialize_message

          fields = SaveMap.Request.get_fields_and_field_types()
          assert fields['name'] == 'std_msgs/String', fields
          assert SaveMap.Response.RESULT_SUCCESS == 0, 'success code changed'

          # ros_bridge.save_map 이 만드는 형태 그대로. 원시 str 이었다면 여기서
          # convert_from_py assertion 으로 프로세스가 죽는다.
          request = SaveMap.Request()
          request.name = String(data='ci-map')
          assert serialize_message(request)
          print('SaveMap guard OK')
          PY
