# 공용 UI 패턴 목록 (D3, 계획 2026-11-13-ui-shared-patterns.md). 한 줄 = 한 패턴.
# 같은 필요가 두 화면에 나오면 화면별 해결 대신 여기 부품을 쓴다. DESIGN.md 「공용 패턴 C1–C25」(C13 아이콘·툴팁은 부품이 아니라 규칙이라 행 없음)이 규칙의 정본,
# 이 파일은 패턴 -> 부품 -> 게이트를 잇는다. 읽는 시험: shared/web/test/test_patterns_registry.py.
# status: built = module이 name을 export하고 gate 시험 파일이 있다(시험이 확인). planned = 아직 없다.
# product_hook: 그 제품 시험 본문과 adopter 화면 폴더(가장 가까운 html 있는 상위 폴더 아래 js·html) 양쪽에 나오는 선택자·id. 관계없는 시험이 product_test를 채우지 못하게 묶는다.
# built 행은 product_test(제품 화면에서 그 부품의 동작을 거는 시험, 갤러리 아님)와 adopters(그 부품을 import하고 호출하는 제품 파일, 갤러리 제외)가 있어야 한다. 예전: adopters(그 부품을 import하는 제품 파일, 갤러리 제외)가 비어 있으면 안 된다. debt는 아직 옮기지 못한 파일과 이유(이행 부채)다.
# 알려진 한계: 이 정적 게이트는 죽은 코드(`if (false)` 호출)와 사소한 제품 시험으로 속일 수 있다. 진짜 해법은 변이 시험(부품 export를 빈 것으로
# 바꿨을 때 product_test가 실패해야 한다)이며 아직 없다. 백로그.
# forbid: 그 module과 adopters 소스(주석 제외)에 나오면 안 되는 문자열. 안전 경계(감독 경로 우회 호출 금지)를 채택 화면까지 막는다.
# 부품을 만든 슬라이스가 자기 행을 built로 바꾼다. planned 행의 gate는 만들 시험의 설명이다.
