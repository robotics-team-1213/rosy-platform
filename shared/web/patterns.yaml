# 11-18 UI 패널 게이트 ③(test_patterns_registry.py test_helpers_are_defined_once_and_direct_writes_only_go_down).
# helpers: 정본 하나를 둔 작은 도우미. module 밖에서 name·aliases를 function·const·let으로 다시 정의한 곳의 수 상한.
# direct: 정본(owners) 밖 Fleet·shared/web 제품 JS가 직접 쓴 줄 수 상한(주석 제외, 문자열 포함).
# duplicate_bodies: 본문(문자열 비움·공백 제거) 35자 이상이 두 파일 이상에 같은 함수 묶음 수 상한.
# 모든 ceiling은 수가 늘면 실패, 줄면 같은 변경에서 내린다.
helpers:
  - {name: node, module: shared/web/control-dom.js, aliases: [nodeWithText], ceiling: 1}
  - {name: setOff, module: shared/web/cause-line.js, aliases: [setOffBy, guard, gate, blockWith, setReason], ceiling: 0}
  - {name: iconSvg, module: shared/web/ui.js, aliases: [iconNode], ceiling: 0}
direct:
  - {what: reason 속성 직접 쓰기, pattern: '(?:set|remove)Attribute\(\s*["'']reason["'']', owners: [shared/web/ui.js, shared/web/cause-line.js], ceiling: 6}
  - {what: 운영자 역할 직접 비교, pattern: 'role\s*[!=]==?\s*["'']operator["'']', owners: [applications/fleet/web/shared/authorization.js], ceiling: 0}
  - {what: 권한 문구 직접 쓰기, pattern: '운영자 권한이 필요합니다', owners: [applications/fleet/web/shared/authorization.js], ceiling: 0}
  - {what: "'초 전' 손 포맷", pattern: '초 전', owners: [shared/web/core_ui_logic.js, shared/web/component-gallery.js], ceiling: 0}
duplicate_bodies: {ceiling: 0}
