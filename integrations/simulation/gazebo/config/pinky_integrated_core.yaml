runtime:
  mode: simulation

network:
  api_host: 127.0.0.1
  api_port: 8080

# Perception is recorded during map/navigation acceptance, but it must not
# arbitrate Nav2 commands in this sequential bench. Traffic-policy enforcement
# has its own closed-loop acceptance and would stop when the route leaves the
# small painted scene.
traffic_policy:
  mode: DISABLED
  map_id: map_260905_update_v2
  scene_revision: road-scene-v1
  policy_revision: traffic-policy-v1
  simulation_signal_control: false

vision:
  preview_max_bytes: 512000
  preview_stale_after_s: 2.0
  preview_min_pull_interval_s: 0.4

