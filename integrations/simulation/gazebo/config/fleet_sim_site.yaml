# Fleet site config (--site-config) for a Fleet that drives Gazebo SIM robots WITHOUT a
# front camera (gz_multi: start_camera:=false). Camera SIM launches use
# fleet_sim_camera_site.yaml instead.
fleet:
  trip:
    # D-601 B: no camera, so CORE's /api/v1/vision/front/status never reports a live
    # front preview and every lane plan would be refused 422 TRIP_LANE_CAMERA_UNAVAILABLE.
    lane_camera_check: false
