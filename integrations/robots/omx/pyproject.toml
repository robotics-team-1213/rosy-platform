[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosy-integration-robot-omx"
version = "0.1.1"
description = "OMX LeRobot robot, CORE arm client and preflight entry points"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rosy-omx-record = "lerobot_robot_rosy_omx:record"
rosy-omx-preflight = "rosy.integrations.robots.omx.deployment:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rosy.integrations.robots.omx*", "lerobot_robot_rosy_omx*"]
namespaces = true
