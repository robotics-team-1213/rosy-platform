# core 기본 설정 (CFG-001) — 로컬 오버라이드: ~/.rosy/rosy.yaml
robot:
  id: rosy_01
  name: Rosy 01
  model: pinky_pro            # D-196 robots/<model> 패키지 — ROSY_ROBOT 가 덮는다
  frame_prefix: ""            # namespace 런치 시 rosy_01/ 로 주입 (§6.1)

network:
  api_host: 0.0.0.0
  api_port: 8080

state:
  rate_hz: 10                 # CORE-001 스냅샷/푸시 주기
  evidence:                   # 채널별 stale 초. 코드 기본은 protocol.evidence
    pose: 2.0
    velocity: 0.5
    battery: 5.0
    navigation: 2.0
    safety: 0.2
    docking: 2.0

runtime:
  mode: core                      # ROSY_RUNTIME_MODE overrides on the robot
  navigation_backend: localization # ROSY_NAVIGATION_BACKEND; slam requires hardware
  presets:                        # board.yaml presets와 같아야 한다
    core: [core]
    motor: [core, motor]
    hardware: [core, motor, io, nav]

adapters:
  manifests: []                   # host default; device overlay may list YAML paths

control:
  sensor_adapter:
    # mode: "off"                 # D-400: unset = off (no policy, CORE passes commands through).
    #                             # shadow = judge and record, never change cmd_vel; enforce = limit/stop.
    #                             # Set it (quoted) in the robot overlay. Not set here so an older overlay
    #                             # with `enabled:` still merges (mode and enabled together are rejected).
    # Use exactly one of mode / enabled across all layers (default, robot core.yaml, local overlay).
    stale_hold_s: 2.0             # reserved: consumed by enforce HOLD in D-400 plan 3; no effect yet
    required: [lidar, imu, ir]
    max_age: 0.5                   # policy evidence lease, seconds
    parameters: {}                 # validated ROS SafetyNode overrides
    calibration:
      required: false              # enable only after Device generation/readback is GO
      path: ""                     # /var/lib/rosy/data-working/<generation>/calibration/...
      data_root: /var/lib/rosy
      active_generation: ""        # supplied by the mounted Device runtime
      context: {}                   # exact robot/model/geometry/sensor/generation identity

auth:                         # SEC-101 / D-193 7: 장치 기본값에는 로그인이 없다 (fail closed)
  tokens: []                  # 개발·시뮬 토큰은 rosy_dev_auth.yaml (ROSY_DEV_AUTH=1 일 때만)
  pairing:                    # D-193: 로그인 코드로 받는 브라우저 토큰의 수명 (시간). 만료 없는 값은 없다
    token_lifetime_hours:
      viewer: 168
      operator: 168
      administrator: 24

safety:
  teleop_timeout_ms: 500          # SAF-002
  battery_warning_percent: 20     # SAF-005
  battery_critical_percent: 10    # SAF-005
  battery_critical_policy: RETURN_HOME
  battery_deep_percent: 5         # SAF-005 하위 신설 — 모터 정지 후 셧다운 (D-27)
  battery_deep_dwell_s: 60        # DEEP을 이만큼 유지해야 셧다운이 무장된다 (s)
  battery_shutdown_grace_s: 120   # 센티넬에 적어 호스트 유닛에 넘길 유예 (s)
  battery_filter_tau_s: 5.0       # 전압 저역통과 시상수 — 모터 새그 제거
  battery_enter_samples: 3        # 한 단계 내려가는 데 필요한 연속 표본
  battery_exit_samples: 5         # 한 단계 올라오는 데 필요한 연속 표본
  battery_hysteresis_percent: 3.0 # 복귀는 임계 + 이 마진을 넘어야 시작된다
  battery_curve:                  # 2S Li-ion OCV (팩 전압, percent). 없으면 아래 스팬 사용
    - [8.40, 100]
    - [8.12, 90]
    - [7.96, 80]
    - [7.84, 70]
    - [7.74, 60]
    - [7.64, 50]
    - [7.58, 40]
    - [7.50, 30]
    - [7.42, 20]
    - [7.32, 10]
    - [6.60, 5]
    - [6.40, 0]
  battery_full_voltage: 8.4      # 전압→퍼센트 선형 변환 (HWA Profile 참조)
  battery_empty_voltage: 6.4
  fleet_loss_policy: STOP         # SAF-003 STOP|HOLD|RETURN_HOME|CONTINUE (D-419)
  fleet_loss_timeout_s: 5.0       # SAF-003: 마지막 허브 수신부터 이만큼 끊기면 정책 적용 (4–60 s, >= 1 + fleet.heartbeat_reply_timeout_s + 1)
  stuck_timeout_s: 30             # NAV-006
  manual_linear: 0.15
  manual_angular: 0.60
  fleet_linear: 0.20
  fleet_angular: 0.80

line_follow:                       # D-143 selected-source, fail-closed policy
  cruise_speed: 0.08               # straight-line target; reduced by curve/confidence
  max_linear: 0.10                 # conservative Pinky Pro host default (m/s)
  steering_gain: 0.80
  max_angular: 0.70                # ceiling; the live cap is min(this, safety.manual_angular)
  max_angular_follows_manual: true # D-344 §13: follow the D-342 manual-limit ladder; false = max_angular only
  lane_auto_min_manual_angular: 0.30  # D-344 §13: lane auto only at ladder L1+ (else HOLD limit_level_too_low).
                                   # 0 disables this floor; max_angular_follows_manual: false does NOT bypass it
  min_confidence: 0.35
  stale_after_s: 0.30              # stop immediately when evidence lease expires
  lost_after_s: 3.0                # latch LOST (IR_LINE: operator must explicitly reselect)
  # D-407 개정 2026-10-10: CAMERA_LINE LOST resumes in the same mode after lost_resume_frames
  # consecutive fresh confident frames over lost_resume_s, no obstacle hold, IR guard clear.
  lost_auto_resume: true
  lost_resume_frames: 3            # = D-495 junction_reacquire_frames
  lost_resume_s: 1.0               # = D-407 recovery_settle_s
  ir_calibration_revision: null    # must match the configured IR line-observer digest
  # D-344 §11 stop / resume distances from the LiDAR origin. D-422: left unset here on
  # purpose (a value in this layer would count as an operator override). Unset: sector mode
  # and path mode without the URDF body use 0.20 / 0.28; path mode with the body
  # (body_front_x_m ... in the robot package) derives the body gap from the speed below.
  # Set either in the robot overlay to override (both keep their LiDAR-origin meaning).
  # obstacle_stop_m: 0.20
  # obstacle_resume_m: 0.28
  obstacle_half_angle_deg: 20.0    # front sector is +-this around the robot's forward
  lidar_forward_deg: 0.0           # LiDAR angle of the robot's forward (Pinky Pro: 180 in products/pinky_pro/profile/config/core.yaml)
  clearance_stale_s: 0.5           # hold when the LiDAR stops reporting mid-run
  obstacle_mode: sector            # sector = +-half_angle; path = swept corridor along the intended arc
                                   # Pinky Pro core.yaml selects path. This default stays sector.
  obstacle_corridor_half_width_m: 0.09  # path: 0.06 m half footprint + 0.03 m margin
  obstacle_path_horizon_m: 0.40    # path: arc length checked (>= obstacle_resume_m); turn window
                                   # max(90 deg, resume/R) capped at 180 deg; returns within obstacle_stop_m
                                   # anywhere on the 0..180 deg band also count. LiDAR range_min (~0.15 m on
                                   # the C1) is blind: nothing nearer is ever seen.
  obstacle_release_s: 0.2          # path: blocked clears only after this long continuously clear
  # D-422 body-referenced stop (path mode with body_front_x_m/body_lidar_x_m/body_rear_x_m/
  # body_half_width_m/body_rotation_radius_m from the robot package): the URDF outline is swept
  # along the intended lane arc; stop gap = margin + v*latency + v^2/(2*decel) at the intended
  # speed, resume = stop + hysteresis. The stop gap is always at least the straight-ahead body
  # gap of the scan's range_min (the LiDAR is blind inside it; the ultrasonic never lifts this);
  # returns that slip under range_min are remembered from the twist sent to the wheels. The sweep also
  # covers the tighter arc the traffic gate / safety clip can make. In place: rotation radius
  # + obstacle_body_margin_m (obstacle_stop_m/resume_m do not apply there).
  obstacle_body_margin_m: 0.02     # URDF/calibration error and floor slip
  obstacle_latency_s: 0.15         # scan age + tick + command to wheels
  obstacle_decel_mps2: 0.5         # conservative Pinky braking (no measured value yet)
  obstacle_resume_hysteresis_m: 0.03
  obstacle_ultrasonic_half_angle_deg: 15.0   # forward echo counts across this cone (body_ultrasonic_x_m)
  obstacle_ultrasonic_stale_s: 0.3 # older readings are ignored (never used to go)
  obstacle_blind_floor: true       # D-591: false = no range_min floor on the stop gap (Pinky Pro)
  obstacle_escalate_s: 5.0         # publish nav.line_obstacle_hold once after this long in obstacle_ahead
  ir_guard_enabled: false          # D-344 §12 IR lane-departure guard; turn on only after IR calibration
  ir_guard_edge_error: 0.3         # |IR error| at or above this = boundary under a side sensor
  ir_guard_turn: 0.5               # rad/s steer away from the boundary (clamped to max_angular)
  ir_guard_speed_scale: 0.5        # linear scale while steering away
  ir_guard_min_linear: 0.0         # D-344 §12 amend: below this camera linear (turning in place) no side steer-away; 0 = off
  ir_guard_back_speed: 0.0         # D-344 §12 amend 2: then creep back at this speed while turning (rear clear); 0 = turn in place
  # D-491: rest the guard while the IR row is in a crosswalk zone the camera saw (CALIBRATED/GAZEBO
  # ground, bounded uncertainty). ir_row_x_m comes from the robot package (URDF); null = never rest.
  crosswalk_zone_max_m: 0.20       # zone length cap; re-set after measurement
  crosswalk_odom_error_fraction: 0.05  # zone margin per metre travelled since the image
  crosswalk_range_error_fraction: 0.05  # zone margin per metre of camera range (9dfk: ~1.5 cm at 0.3 m)
  # D-573 6 rev: a frame's crosswalk_uncertainty_m (worst-case along-track) above this is not admitted;
  # 8kcn accepted record at the detector's 0.33 m range (D-573 6 derivation).
  crosswalk_max_uncertainty_m: 0.058
  # D-573 crosswalk gate (Safety-Review): stop s_wait before a camera crosswalk zone (URDF body +
  # LiDAR range_min), look, cross only after crosswalk_look_s of empty LiDAR scans; no timeout;
  # crosswalk_blocked stuck to a human after crosswalk_report_s. Needs obstacle_mode path. Keep
  # false until D-577 open item 1 (LEGACY odom pose in the Fleet rear band, stuck_resolver
  # _map_pose) is closed: line_follow.crosswalk null opens the resolver's R3 back-off.
  crosswalk_gate_enabled: false
  crosswalk_look_s: 1.0
  crosswalk_look_min_scans: 8     # 10 Hz LiDAR x 1 s x 0.8
  crosswalk_report_s: 10.0
  crosswalk_cross_speed: 0.04     # lane slow value (cruise 0.08 x 0.5)
  crosswalk_approach_default_m: 0.0   # strip beside a camera-only zone's lane corridor; 0 = corridor only
  crosswalk_range_sigma_m: 0.0035  # measured C1 range noise (8kcn 2026-10-10); edge band = 3 sigma
  crosswalk_persist_k: 2           # an edge-band cell is a person when hit in k of the last n scans
  crosswalk_persist_n: 3
  # D-407 lane stuck recovery: obstacle_ahead >= obstacle_escalate_s or LOST opens one stuck and
  # asks the console (POST /line-follow/stuck/decision). No answer in recovery_ask_s, or no
  # console link -> local back-off (only when recovery_local_enabled; since D-495 that is the
  # robot default, gated by its promotion rule, not a per-robot self-mask step). Rear
  # clearance is measured from the URDF body rear, so the
  # robot package must set body_lidar_x_m / body_rear_x_m (unset = never backs off).
  # On by robot default since D-495 (2026-10-07): it also gates D-468 local lane return (the
  # D-476 rev 1 bridge no longer needs it). Same promotion rule as D-495 (model-PC Gazebo map_v2_fleet_real lap + a real
  # lane lap before robots get it). Roll back per robot with line_follow.recovery_local_enabled:
  # false in ~/.rosy/rosy.yaml or ROSY_CONFIG (no code change).
  recovery_local_enabled: true
  recovery_ask_s: 15.0             # console answer window before the local fallback
  stuck_report_s: 5.0              # active mode, zero command this long for any reason -> stuck no_motion to Fleet (0 = off)
  recovery_back_m: 0.08            # one back-off (<= 0.20)
  recovery_back_speed: 0.03        # m/s ceiling; actual = min(safety.manual_linear, this)
  recovery_rear_clear_m: 0.06      # rear clearance from the body rear, before and during
  recovery_max_attempts: 2         # local back-offs per stuck; then HOLD for the console only
  recovery_settle_s: 1.0           # stand still before re-judging lane + front
  # User decision 2026-10-02: the rear band the LiDAR cannot see (range_min, self-mask
  # windows reaching past the body rear) is entered only over ground just driven: in the
  # recovery_trail_s of CORE-issued commands up to the last forward one, net forward travel
  # >= recovery_back_m and total |yaw| <= recovery_trail_yaw_deg. Else refused (rear_blind).
  recovery_trail_s: 5.0
  recovery_trail_yaw_deg: 10.0
  recovery_trail_max_age_s: 30.0   # decision 2026-10-02: trail's last forward command at most this old
                                   # at back-off start (standing still for the console counts)
  # Clarification 2026-10-02: a stuck re-opening within recovery_restuck_s of a `recovered`
  # close, or before recovery_restuck_m of net forward travel since, is the same stuck for
  # attempt counting (new stuck_id, restuck_of=<previous>, attempts carried).
  recovery_restuck_s: 20.0
  recovery_console_grace_s: 3.0    # a FleetAgent reconnect this short still counts as linked
  recovery_restuck_m: 0.30
  recovery_rear_lateral_margin_m: 0.02   # rear band = body_half_width_m (URDF) + this
  # D-476 expected-road bridge. D-495 decision 2 wants it on by robot default, but D-476 rev 1
  # (main 2026-10-07) makes an enabled bridge need ir_guard_enabled (off above until IR
  # calibration) and control.sensor_adapter enforce or site_floor_map_id (D-507 9); CORE refuses
  # to start otherwise. So the robot default stays off until those are decided per site
  # (D-495 implementation note, merge 2026-10-07).
  # A short camera lane loss right after confident following (rev 2026-10-07: no D-468
  # containment, works with recovery_local_enabled false) drives the followed lane's straight
  # extension in odom (path-mode URDF body). Swept by D-422 along the bridge arc; the D-468
  # worker floor proof also gates it whenever control.sensor_adapter is enforce. Measured odom
  # travel x bridge_distance_scale: full speed (min cruise, manual limit) below bridge_coast_m,
  # x bridge_slow_scale below bridge_slow_m, then stop: D-468 takes over when enabled, else
  # today's HOLD/LOST. Always done by lost_after_s - bridge_time_margin_s; the LOST clock is
  # never reset or extended.
  bridge_enabled: false
  bridge_arm_confidence: 0.5       # arm only on frames this confident (>= min_confidence)
  bridge_arm_frames: 3             # ... this many in a row, the tick TRACKING
  bridge_arm_max_error: 0.1        # ... and straight: |error| (follower slows < 7 % there)
  bridge_arm_max_angular: 0.08     # ... and |angular| (steering_gain x max_error); all four are
                                   # plausibility gates until D-476 replay justifies them
  # D-476 rev 2: outside that straight band, arm on a steady arc instead: over the last
  # bridge_arm_frames the curvature (angular/linear) spreads <= the tolerance (13.4 mm worst
  # lateral over the 0.23 m reach), the error spreads <= tolerance x cruise_speed / steering_gain,
  # and |mean| <= the max (lane_graph roundabout radius 0.2514 m), over >= cruise_speed /
  # steering_gain odom travel whose odom turn agrees. Bridges then follow that arc.
  bridge_arm_max_curvature: 4.0      # 1/m
  bridge_arm_curvature_tolerance: 0.5  # 1/m
  bridge_lookahead_m: 0.10         # pure-pursuit point ahead on the extended centre line
  bridge_coast_m: 0.10             # D-384 COAST
  bridge_slow_m: 0.25              # D-384 SLOW
  bridge_slow_scale: 0.5
  bridge_distance_scale: 1.08      # D-384 odometry inflation
  bridge_time_margin_s: 0.5        # D-384 rev 1 §1
  # D-495 bounded junction turn: consecutive fresh lane frames (confidence >= min_confidence,
  # heading within 30 deg of the turn when containment gives one) that count as reacquired,
  # and the actuation + odom latency the in-place turn stops early for (then settles in 5 deg).
  junction_reacquire_frames: 3
  junction_turn_lead_s: 0.15
  junction_still_linear: 0.01      # m/s; odom below this (and the angular one) for 0.2 s = standing still
  junction_still_angular: 0.05     # rad/s; checked before the turn and before it counts as settled
  # D-507 9 site floor declaration (replaces D-476 bridge_site_no_dropoffs and D-498
  # junction_turn_site_accepted; CORE refuses to start while a layer still sets either).
  # null = none. A SiteMap map_id ([A-Za-z0-9_.-]{1,64}, not the default 'site') declares that
  # the site lead walked every lane and junction of that map, both ways, plus 0.30 m outside
  # (turn circle, advance, approach, bridge, D-468 return and the retrace's rear path) and
  # found no drop-off, hole or step, and recorded map id, walker and date (D-498 D8). The IR
  # guard sees no floor edge and nothing behind the robot, so floor risk rests on this alone.
  # Needs ir_guard_enabled, obstacle_mode path and the URDF body (CORE refuses otherwise). With
  # it, motion_admitted's site basis admits the D-476 bridge, the D-468 return and retrace and
  # the D-495 junction motions without D-400 enforce; capability site_floor_map_id shows it, and
  # Fleet opens lane trips only on the active map with that id. Clear it when the robot leaves.
  site_floor_map_id: null
  # D-520 map-guided arc: omega = arc_curvature_gain x v x kappa + a bounded radial correction
  # toward the map circle in odom (2026-10-09 addendum). A junction instruction's exit_segment
  # (Fleet sends it only with capability lane_arc) makes CORE drive the map arc to the next place
  # after the turn, on odom path length; the IR guard gets one correction per arc, D-422 sweeps
  # the arc twist. On by default (user 2026-10-09), but capability lane_arc needs
  # site_floor_map_id too: without the declaration nothing changes. A device declaring the site
  # floor sets arc_enabled: false until the D-520 DEVICE checklist passes (addendum 2026-10-09).
  arc_enabled: true
  route_context_enabled: false      # D-531: CORE route evidence to perception; off until replay/SIM/device review
  arc_curvature_gain: 1.0          # [0.8, 1.25]; per robot from the D-500 measured motion response
  arc_blind_max_m: 1.0             # step 1 SIM: the whole segment (<= 1.0 m) without a camera fit
  # D-517 4 (M2): true = no line-follow motion without a live Fleet movement authority. False:
  # enforced only once Fleet sent one in this line-follow session (a trip on an authority site).
  authority_required: false
  # D-468 containment (needs recovery_local_enabled; implementation note 2026-10-06). The lane
  # boundaries are eroded by the producer's uncertainty_m and the body is the URDF footprint, so
  # 0 means every corner is inside only if uncertainty_m bounds every lateral error. Jitter and
  # footprint tolerance outside it belong in lane_return_body_margin_m; revisit its default 0 from
  # measured 2-sigma boundary jitter once real producers send uncertainty_m. Entry also subtracts
  # the lateral travel at the live linear limit (conservative, also in verify) over the 0.3 s
  # evidence age bound; a contained tracking robot departs only when margin + uncertainty < 0.
  lane_return_body_margin_m: 0.0       # extra body clearance on top of that, [0, 0.05]
  lane_return_checkpoint_fraction: 0.5 # normal checkpoint: margin >= this x geometric lateral play

localization_mission:              # D-395 P2-7 check manoeuvres; D-424 near checks
  # With the URDF body (line_follow.body_* in the robot package) a turn needs every
  # base_footprint return beyond the rotation radius + rotate_margin_m (watched while turning
  # with rotate_stop_margin_m), and a nudge needs the
  # D-422 stop gap at nudge_linear + nudge_min_m (less room shortens the nudge). Without the
  # body the LiDAR-origin rules apply: rotate_clearance_m and min_front_clearance_m.
  rotate_angular: 0.3
  nudge_linear: 0.03
  nudge_max_m: 0.10
  lane_linear: 0.04
  rotate_margin_m: 0.03             # start a turn: rho + this (D-424 H1, until device evidence)
  rotate_stop_margin_m: 0.01        # end a running turn at rho + this
  rotate_coverage_debounce_ticks: 8   # ...on an evidence gap only after 8 ticks (20 Hz) = 4 scans in a row
  nudge_min_m: 0.02
  min_front_clearance_m: 0.25
  rotate_clearance_m: 0.20

traffic_policy:                    # D-151 semantic road evidence gate
  mode: DISABLED                   # DISABLED | MONITOR_ONLY | ENFORCED
  map_id: map_260905_update_v2
  scene_revision: road-scene-v1
  policy_revision: traffic-policy-v1
  junction_rule: signal_controlled   # signal_controlled | stop_and_go(무신호: 정지+dwell 후 진입, 운영자 선언)
  approach_distance_m: 0.35
  stop_distance_m: 0.12
  stop_dwell_s: 0.50
  stale_after_s: 0.40
  min_confidence: 0.50
  proceed_speed_scale: 0.50
  simulation_signal_control: false  # simulation runtime에서만 true 허용
  signal_observer: {}               # D-337 관측 소스 바인딩(오버레이 전용): {url, roi_map, timeout_s} — 비어 있으면 폴러 없음

vision:                            # authenticated, latest-only dashboard preview
  preview_max_bytes: 512000         # reject oversized JPEG frames before storage
  preview_stale_after_s: 2.0        # hide frames after the local receipt lease expires
  preview_min_pull_interval_s: 0.4  # authenticated viewer cap (<= 2.5 pulls/s)

navigation:
  max_linear_velocity: 0.20       # HWA-001에서 주입 (여기值은 폴백)
  max_angular_velocity: 0.80
  readiness:
    required: false
    stale_after_s: 2.0
    required_components: [amcl, map_server, controller_server, local_costmap, global_costmap, motor_adapter]
    profiles:
      localization: [amcl, map_server, controller_server, local_costmap, global_costmap, motor_adapter]
      slam: [slam_toolbox, controller_server, local_costmap, global_costmap, motor_adapter]
  # map_id: warehouse_a           # 설정 or slam/save 로 갱신 (MAP-001, D-13)

power:                            # PWR-001~004 절전/근접 웨이크 (D-24)
  enabled: true                   # false 이면 항상 ACTIVE — 기존 동작과 동일
  idle_after_s: 600                # 무활동 이 시간 후 IDLE
  standby_after_s: 1800            # 무활동 이 시간 후 STANDBY
  warning_idle_after_s: 60
  warning_standby_after_s: 300
  critical_idle_after_s: 30
  critical_standby_after_s: 120
  info_hold_s: 15                 # 웨이크 후 정보 화면 유지 시간 (s)
  active_rate_hz: 20              # sensor_adc ADC 폴링 주기 (모드별)
  idle_rate_hz: 5
  standby_rate_hz: 2
  presence:                       # 초음파 프레즌스 판정 (단위 m / 표본 수)
    near_m: 0.25                  # 이보다 가까우면 접근
    contact_m: 0.05               # 이보다 가까우면 접촉으로 간주
    hysteresis_m: 0.10            # near_m + 이 값을 넘어야 해제 판정 시작
    detect_samples: 2             # 검출에 필요한 연속 표본 수
    release_samples: 3            # 해제에 필요한 연속 표본 수
    min_valid_m: 0.02             # 센서 min_range — 미만은 무효 표본
    max_valid_m: 3.0              # 센서 max_range — 초과는 무효 표본
  lidar:                          # PWR-005 STANDBY LiDAR 모터 정지
    standby_stop: false           # 벤치 승인(Nav2 영향 확인) 후 true 로 전환
    spinup_s: 2.0                 # start_motor 후 스캔을 신뢰하기까지의 시간

events:
  ring_buffer_size: 1000          # EVT-004

recording:
  pilot_root: "/var/lib/rosy/pilot-recordings"   # D-411 A; CORE reads only. Tests and Gazebo override it

fleet:
  enabled: false                  # 읽히지 않는다 (D-419): FleetAgent 는 pairing_token + hub_url|discovery 로 켜진다
  heartbeat_reply_timeout_s: 2.0  # D-419: 하트비트(1 Hz) 답(ERROR 답 포함)이 이 안에 없으면 소켓을 끊는다 (0.5–10 s; 어기면 Fleet 링크가 있는 로봇만 기동 실패)
