[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosy-contracts-skill"
version = "0.1.0"
description = "ROS-free Skill invocation and receipt identity contracts shared by ROSY parts"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rosy.contracts.skill*"]
namespaces = true
