[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosy-contracts-learning"
version = "0.1.8"
description = "ROS-free learning artifact and owner binding contract drafts"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rosy.contracts.learning*"]
namespaces = true
